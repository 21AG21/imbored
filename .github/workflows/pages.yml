# Publishes the arcade to GitHub Pages.
#
# Deliberately manual: this only runs when you start it yourself from the Actions tab,
# so nothing goes public by accident. To publish on every push instead, add:
#
#   push:
#     branches: [main]
#
# under "on:" below. Publishing also requires Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
