<title>Cubicle Arcade</title>
<style>
/* ============================================================
   CUBICLE ARCADE '98 - THE SHAREWARE COLLECTION
   Beige box. Chunky bevels. Zero rounded corners. Googly eyes.
   ============================================================ */

:root {
  /* the beige box */
  --paper:   #ded6c2;
  --paper2:  #cfc6ae;
  --label:   #fffdf3;
  --chrome:  #a79e88;
  --shade:   #7d755f;
  --hilite:  #fffefa;

  /* ink, biased violet so it never reads as flat grey */
  --ink:     #1d1722;
  --ink2:    #4a4155;
  --ink3:    #7a6f88;

  /* the loud ones */
  --teal:    #00a6b4;
  --hotpink: #ff2d87;
  --banana:  #ffcb1f;
  --grape:   #6f3fa8;
  --lime:    #6fcf2f;
  --tomato:  #e8402a;

  /* the CRT the games live inside */
  --crt:     #0c1119;

  --bevel-out: inset -3px -3px 0 0 var(--shade), inset 3px 3px 0 0 var(--hilite);
  --bevel-in:  inset 3px 3px 0 0 var(--shade), inset -3px -3px 0 0 var(--hilite);
  --hard: 5px 5px 0 0 var(--ink);
}

* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  background-color: var(--paper);
  /* faint diagonal weave, like a mousepad */
  background-image:
    repeating-linear-gradient(45deg, rgba(0,0,0,.028) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.35) 0 2px, transparent 2px 7px);
  color: var(--ink);
  font: 14px/1.55 Verdana, Geneva, Tahoma, sans-serif;
  display: flex;
  flex-direction: column;
  min-height: 100%;
}

a { color: inherit; text-decoration: none; }

h1, h2, h3, .impact {
  font-family: Impact, Haettenschweiler, "Franklin Gothic Heavy", "Arial Narrow Bold", Arial Black, sans-serif;
  font-weight: 400;
  letter-spacing: .01em;
  text-transform: uppercase;
  text-wrap: balance;
}

kbd {
  font: 700 11px/1 "Courier New", Courier, monospace;
  background: var(--label);
  border: 2px solid var(--ink);
  box-shadow: 2px 2px 0 0 var(--ink);
  padding: 2px 5px;
  margin: 0 2px;
  display: inline-block;
}

::selection { background: var(--banana); color: var(--ink); }

:focus-visible { outline: 3px dashed var(--grape); outline-offset: 2px; }

/* ---------------- top chrome: a window title bar ---------------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  background: var(--grape);
  border-bottom: 4px solid var(--ink);
  box-shadow: 0 4px 0 0 rgba(0,0,0,.18);
}

.brand { display: flex; align-items: center; gap: 8px; }
.brand-mark {
  display: grid;
  place-items: center;
  width: 30px; height: 30px;
  background: var(--banana);
  border: 3px solid var(--ink);
  box-shadow: 3px 3px 0 0 rgba(0,0,0,.45);
  font-size: 16px;
  transform: rotate(-6deg);
}
.brand-text {
  font-family: Impact, Haettenschweiler, "Arial Narrow Bold", Arial Black, sans-serif;
  font-size: 21px;
  text-transform: uppercase;
  color: var(--label);
  letter-spacing: .02em;
  text-shadow: 2px 2px 0 var(--ink);
}
.brand-text em { font-style: normal; color: var(--banana); margin-left: .28em; }
.topbar-spacer { flex: 1; }

.search {
  width: min(230px, 40vw);
  background: var(--label);
  border: 3px solid var(--ink);
  box-shadow: var(--bevel-in);
  color: var(--ink);
  padding: 6px 10px;
  font: 12px/1 Verdana, sans-serif;
  outline: none;
}

.icon-btn {
  background: var(--paper2);
  border: 3px solid var(--ink);
  box-shadow: var(--bevel-out);
  width: 38px; height: 34px;
  font-size: 15px;
  cursor: pointer;
  color: var(--ink);
  line-height: 1;
}
.icon-btn:active { box-shadow: var(--bevel-in); transform: translate(1px, 1px); }
.icon-btn.on { background: var(--lime); }

/* ---------------- layout ---------------- */
.view {
  flex: 1;
  width: min(1200px, 100%);
  margin: 0 auto;
  padding: 20px 16px 40px;
}

.foot {
  border-top: 4px solid var(--ink);
  background: var(--paper2);
  padding: 12px 18px 22px;
  font: 11px/1.6 "Courier New", monospace;
  color: var(--ink2);
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: space-between;
}

/* ---------------- hero ---------------- */
.hero {
  position: relative;
  background: var(--banana);
  border: 4px solid var(--ink);
  box-shadow: var(--hard);
  padding: 20px 22px 18px;
  margin: 6px 0 30px;
  overflow: hidden;
}
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(-45deg, rgba(0,0,0,.05) 0 12px, transparent 12px 24px);
  pointer-events: none;
}
.hero h1 {
  position: relative;
  margin: 0 0 6px;
  font-size: clamp(32px, 6.4vw, 62px);
  line-height: .92;
  color: var(--label);
  text-shadow:
     3px 3px 0 var(--ink),
    -1px -1px 0 var(--ink),
     1px -1px 0 var(--ink),
    -1px  1px 0 var(--ink);
  transform: skewX(-5deg);
}
.hero h1 .accent { color: var(--hotpink); display: inline-block; transform: rotate(-2deg); }
.hero p {
  position: relative;
  margin: 0;
  max-width: 60ch;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
}

.sticker {
  position: absolute;
  font-family: Impact, Haettenschweiler, Arial Black, sans-serif;
  text-transform: uppercase;
  background: var(--label);
  border: 3px solid var(--ink);
  box-shadow: 3px 3px 0 0 rgba(0,0,0,.35);
  padding: 5px 9px;
  font-size: 13px;
  line-height: 1;
  z-index: 2;
}
.sticker.s1 { top: 12px; right: 14px; transform: rotate(9deg); background: var(--hotpink); color: var(--label); }
.sticker.s2 { bottom: 14px; right: 96px; transform: rotate(-6deg); background: var(--teal); color: var(--label); }
.sticker.s3 { top: 58px; right: 30px; transform: rotate(-3deg); background: var(--lime); }
@media (max-width: 760px) { .sticker.s2, .sticker.s3 { display: none; } }

/* ---------------- category tabs ---------------- */
.chips { display: flex; flex-wrap: wrap; gap: 0; margin-bottom: 0; padding-left: 6px; }
.chip {
  background: var(--paper2);
  border: 3px solid var(--ink);
  border-bottom: none;
  color: var(--ink2);
  padding: 7px 15px 8px;
  font: 700 12px/1 Verdana, sans-serif;
  cursor: pointer;
  margin-right: -3px;
  position: relative;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.chip:hover { background: var(--paper); color: var(--ink); }
.chip.active {
  background: var(--label);
  color: var(--ink);
  z-index: 2;
  padding-bottom: 11px;
  margin-bottom: -3px;
}

/* ---------------- the shelf of games ---------------- */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
  gap: 20px 18px;
  background: var(--label);
  border: 4px solid var(--ink);
  box-shadow: var(--hard);
  padding: 22px 20px 26px;
}

.card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 12px 12px 40px;
  background: var(--paper);
  border: 3px solid var(--ink);
  box-shadow: 4px 4px 0 0 var(--ink);
  transition: transform .09s steps(2), box-shadow .09s steps(2);
}
.card:hover { transform: translate(-3px, -3px); box-shadow: 8px 8px 0 0 var(--ink); }
.card:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 0 var(--ink); }

/* the emoji lives in a beveled desktop-icon well */
.card-emoji {
  display: grid;
  place-items: center;
  width: 46px; height: 46px;
  font-size: 25px;
  line-height: 1;
  background: var(--paper2);
  border: 3px solid var(--ink);
  box-shadow: var(--bevel-in);
  margin-bottom: 4px;
}
.ico { display: block; }
.ico-wrap { display: inline-flex; vertical-align: middle; }
.icon-btn .ico { margin: 0 auto; }
.gtitle .ge { display: inline-flex; background: var(--banana); border: 2px solid var(--ink); padding: 3px; }
.gl-buy-icon { display: inline-flex; flex: none; background: var(--paper2); border: 2px solid var(--ink); padding: 3px; }
.shop-emoji { display: inline-flex; flex: none; }
.mug-art .ico { width: clamp(70px, 18vw, 130px); height: auto; }
.card-cat {
  position: absolute;
  top: 10px; right: -6px;
  font-family: Impact, Haettenschweiler, Arial Black, sans-serif;
  font-size: 10px;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 3px 7px;
  border: 2px solid var(--ink);
  transform: rotate(4deg);
  color: var(--ink);
}
.cat-sim    .card-cat { background: var(--teal); color: var(--label); }
.cat-puzzle .card-cat { background: var(--banana); }
.cat-action .card-cat { background: var(--hotpink); color: var(--label); }
.cat-brain  .card-cat { background: var(--lime); }
.cat-goof   .card-cat { background: var(--grape); color: var(--label); }

.card-title { margin: 2px 0 0; font-size: 19px; line-height: 1.02; }
.card-blurb { margin: 0; font-size: 11.5px; line-height: 1.45; color: var(--ink2); flex: 1; }
.card-best {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 5px 12px 6px;
  border-top: 3px dashed var(--ink);
  background: var(--label);
  font: 700 10.5px/1.3 "Courier New", monospace;
  color: var(--ink2);
  text-transform: uppercase;
}
.card-best.played { background: var(--banana); color: var(--ink); }

.empty { font-weight: 700; padding: 20px; }

/* ---------------- ticker ---------------- */
.ticker {
  margin: 26px 0 0;
  border: 4px solid var(--ink);
  background: var(--ink);
  color: var(--banana);
  overflow: hidden;
  font: 700 12px/1 "Courier New", monospace;
  white-space: nowrap;
  padding: 8px 0;
}
.ticker span { display: inline-block; padding-left: 100%; animation: roll 34s linear infinite; }
@keyframes roll { to { transform: translateX(-100%); } }
@media (prefers-reduced-motion: reduce) {
  .ticker span { animation: none; padding-left: 12px; }
}

/* ---------------- game screen ---------------- */
.gamehead {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  background: var(--grape);
  border: 4px solid var(--ink);
  box-shadow: var(--hard);
  padding: 9px 12px;
  margin-bottom: 16px;
}
.back {
  background: var(--paper2);
  border: 3px solid var(--ink);
  box-shadow: var(--bevel-out);
  padding: 5px 10px;
  font: 700 11px/1 Verdana, sans-serif;
  text-transform: uppercase;
}
.back:active { box-shadow: var(--bevel-in); }
.gtitle {
  margin: 0;
  font-size: 24px;
  color: var(--label);
  text-shadow: 2px 2px 0 var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}
.ge { font-size: 21px; text-shadow: none; }
.gmeta { margin-left: auto; }

.howto {
  flex-basis: 100%;
  order: 9;
  background: var(--label);
  border: 3px solid var(--ink);
}
.howto summary {
  cursor: pointer;
  padding: 7px 11px;
  font: 700 11.5px/1 Verdana, sans-serif;
  text-transform: uppercase;
  list-style: none;
  background: var(--banana);
  border-bottom: 3px solid transparent;
}
.howto summary::-webkit-details-marker { display: none; }
.howto summary::before { content: "▶ "; font-size: 9px; }
.howto[open] summary { border-bottom-color: var(--ink); }
.howto[open] summary::before { content: "▼ "; }
.howto ul { margin: 8px 0 10px; padding-left: 26px; font-size: 12px; }
.howto li { margin: 4px 0; }

.gametools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }

.btn {
  background: var(--paper2);
  border: 3px solid var(--ink);
  box-shadow: var(--bevel-out);
  color: var(--ink);
  padding: 7px 14px;
  font: 700 12px/1 Verdana, sans-serif;
  text-transform: uppercase;
  cursor: pointer;
}
.btn:hover { background: var(--paper); }
.btn:active { box-shadow: var(--bevel-in); transform: translate(1px, 1px); }
.btn.primary { background: var(--banana); }
.btn.danger { background: var(--tomato); color: var(--label); }
.btn.on { background: var(--lime); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--label);
  border: 3px solid var(--ink);
  padding: 5px 11px;
  font: 700 12px/1 "Courier New", monospace;
  text-transform: uppercase;
  white-space: nowrap;
}
.pill.best { background: var(--banana); }
.pill.good { background: var(--lime); }
.pill.warn { background: #ffa229; }
.pill.bad  { background: var(--tomato); color: var(--label); }

.sel-wrap { display: inline-flex; align-items: center; gap: 6px; font: 700 11px/1 Verdana, sans-serif; text-transform: uppercase; }
.sel {
  background: var(--label);
  color: var(--ink);
  border: 3px solid var(--ink);
  padding: 5px 6px;
  font: 700 12px/1 Verdana, sans-serif;
}

.status {
  min-height: 18px;
  margin-bottom: 12px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink2);
}

.stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }

/* the CRT bezel that every canvas game sits inside */
.gcanvas {
  width: 100%;
  display: block;
  background: var(--crt);
  border: 5px solid var(--ink);
  box-shadow:
    var(--hard),
    inset 0 0 0 4px #6d6552;
  touch-action: manipulation;
}

.panelrow { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; width: 100%; }
.panel {
  background: var(--label);
  border: 3px solid var(--ink);
  box-shadow: 4px 4px 0 0 var(--ink);
  padding: 10px 12px;
}
.panel h4 {
  margin: 0 0 8px;
  font-size: 12px;
  letter-spacing: .05em;
}

.banner {
  width: min(560px, 100%);
  text-align: center;
  padding: 16px 18px 18px;
  background: var(--label);
  border: 4px solid var(--ink);
  box-shadow: var(--hard);
}
.banner h3 { margin: 0 0 6px; font-size: 26px; }
.banner p { margin: 0 0 12px; font-size: 13px; }

.meter {
  width: 100%;
  height: 16px;
  background: var(--label);
  border: 3px solid var(--ink);
  box-shadow: var(--bevel-in);
  overflow: hidden;
}
.meter > i {
  display: block;
  height: 100%;
  background: repeating-linear-gradient(90deg, var(--tomato) 0 10px, #ff6a52 10px 14px);
  transition: width .18s steps(6);
}

/* ---------------- CHOMPS, the office assistant ---------------- */
.chomps {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 40;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  max-width: min(340px, 82vw);
}
.chomps.hidden { display: none; }
.chomps-bubble {
  background: var(--label);
  border: 3px solid var(--ink);
  box-shadow: 4px 4px 0 0 var(--ink);
  padding: 9px 11px 10px;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.4;
  position: relative;
}
.chomps-bubble b { display: block; font-size: 10px; letter-spacing: .08em; color: var(--grape); margin-bottom: 3px; }
.chomps-x {
  position: absolute;
  top: -11px; right: -11px;
  width: 22px; height: 22px;
  background: var(--tomato);
  color: var(--label);
  border: 3px solid var(--ink);
  font: 700 12px/1 Verdana, sans-serif;
  cursor: pointer;
}
.chomps-guy {
  width: 58px;
  height: 62px;
  flex: none;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  animation: bob 2.6s ease-in-out infinite;
}
@keyframes bob { 50% { transform: translateY(-6px) rotate(-3deg); } }
@media (prefers-reduced-motion: reduce) { .chomps-guy { animation: none; } }
@media (max-width: 620px) { .chomps { display: none; } }

/* ---------------- on-screen d-pad ---------------- */
.dpad {
  display: grid;
  grid-template-columns: repeat(3, 56px);
  grid-template-rows: repeat(3, 48px);
  gap: 5px;
  justify-content: center;
}
.dpad .up { grid-area: 1 / 2; }
.dpad .left { grid-area: 2 / 1; }
.dpad .mid { grid-area: 2 / 2; }
.dpad .right { grid-area: 2 / 3; }
.dpad .down { grid-area: 3 / 2; }
.dpad-btn {
  background: var(--paper2);
  border: 3px solid var(--ink);
  box-shadow: var(--bevel-out);
  color: var(--ink);
  font-size: 15px;
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
}
.dpad-btn:active { box-shadow: var(--bevel-in); }
.dpad-btn.ghost { background: transparent; border-color: transparent; box-shadow: none; }
@media (hover: hover) and (pointer: fine) { .dpad.touch-only { display: none; } }

/* ---------------- grid games ---------------- */
.board { display: grid; gap: 3px; user-select: none; touch-action: manipulation; }
.cell {
  display: grid;
  place-items: center;
  background: var(--paper2);
  border: 2px solid var(--ink);
  font: 700 16px/1 Verdana, sans-serif;
  cursor: pointer;
}

/* minesweeper */
.ms { background: var(--paper2); padding: 8px; border: 4px solid var(--ink); box-shadow: var(--hard); }
.ms .board { gap: 2px; }
.ms .cell { width: 30px; height: 30px; font-size: 15px; background: var(--paper); box-shadow: var(--bevel-out); border-width: 2px; }
.ms .cell:hover { background: var(--label); }
.ms .cell.open { background: var(--label); box-shadow: none; cursor: default; }
.ms .cell.mine { background: var(--tomato); }
.ms .cell.flag { background: var(--banana); }
.ms .n1 { color: #1147c9; } .ms .n2 { color: #1a7a26; } .ms .n3 { color: #c41b1b; }
.ms .n4 { color: #4b1a9e; } .ms .n5 { color: #8a4b0f; } .ms .n6 { color: #0f7d80; }
.ms .n7 { color: #b2158c; } .ms .n8 { color: #333; }

/* 2048 */
.g2048 { background: var(--ink); padding: 8px; border: 5px solid var(--ink); box-shadow: var(--hard); }
.g2048 .board { gap: 6px; }
.g2048 .cell { width: 74px; height: 74px; font-size: 25px; border: 3px solid var(--ink); color: var(--ink); font-family: Impact, Arial Black, sans-serif; }
.g2048 .cell[data-v="0"]    { background: #3a3446; border-color: #3a3446; color: transparent; }
.g2048 .cell[data-v="2"]    { background: #fffdf3; }
.g2048 .cell[data-v="4"]    { background: #ffe9a8; }
.g2048 .cell[data-v="8"]    { background: #ffcb1f; }
.g2048 .cell[data-v="16"]   { background: #ff9f1a; }
.g2048 .cell[data-v="32"]   { background: #ff6a2a; }
.g2048 .cell[data-v="64"]   { background: #e8402a; color: #fffdf3; }
.g2048 .cell[data-v="128"]  { background: #ff2d87; color: #fffdf3; font-size: 22px; }
.g2048 .cell[data-v="256"]  { background: #b52ec4; color: #fffdf3; font-size: 22px; }
.g2048 .cell[data-v="512"]  { background: #6f3fa8; color: #fffdf3; font-size: 22px; }
.g2048 .cell[data-v="1024"] { background: #0090c4; color: #fffdf3; font-size: 18px; }
.g2048 .cell[data-v="2048"] { background: #6fcf2f; font-size: 18px; }
.g2048 .cell.big { background: var(--label); font-size: 16px; }
.g2048 .cell.pop { animation: pop .14s steps(3); }
@keyframes pop { from { transform: scale(.55); } to { transform: scale(1); } }
@media (max-width: 480px) { .g2048 .cell { width: 60px; height: 60px; font-size: 21px; } }

/* word guess */
.wg-board { display: grid; gap: 5px; }
.wg-row { display: grid; grid-template-columns: repeat(5, 56px); gap: 5px; }
.wg-tile {
  display: grid; place-items: center;
  width: 56px; height: 56px;
  border: 3px solid var(--ink);
  background: var(--label);
  font: 400 27px/1 Impact, Haettenschweiler, Arial Black, sans-serif;
  text-transform: uppercase;
}
.wg-tile.filled { background: var(--paper); }
.wg-tile.hit  { background: var(--lime); }
.wg-tile.near { background: var(--banana); }
.wg-tile.miss { background: #9a917f; color: var(--label); }
.wg-tile.shake { animation: shake .32s steps(4); }
@keyframes shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
.kbd-row { display: flex; gap: 4px; justify-content: center; margin-bottom: 4px; }
.kbd-key {
  min-width: 36px; height: 44px; padding: 0 7px;
  background: var(--paper2);
  border: 3px solid var(--ink);
  box-shadow: var(--bevel-out);
  color: var(--ink);
  font: 700 13px/1 Verdana, sans-serif;
  text-transform: uppercase;
  cursor: pointer;
}
.kbd-key:active { box-shadow: var(--bevel-in); }
.kbd-key.wide { min-width: 56px; font-size: 10px; }
.kbd-key.hit  { background: var(--lime); }
.kbd-key.near { background: var(--banana); }
.kbd-key.miss { background: #9a917f; color: var(--label); box-shadow: var(--bevel-in); }
@media (max-width: 430px) {
  .wg-row { grid-template-columns: repeat(5, 46px); }
  .wg-tile { width: 46px; height: 46px; font-size: 22px; }
  .kbd-key { min-width: 28px; height: 40px; padding: 0 3px; }
}

/* lights out */

    return m + ':' + String(s % 60).padStart(2, '0');
  };

  /* ---------- tiny DOM builder ---------- */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs && (typeof attrs !== 'object' || attrs.nodeType)) { kids.unshift(attrs); attrs = null; }
    for (const k in attrs || {}) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k === 'data' && typeof v === 'object') Object.assign(el.dataset, v);
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat(9)) {
      if (kid == null || kid === false || kid === '') continue;
      el.appendChild(kid && kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }

  /* ---------- disposer bag ---------- */
  function bag() {
    const fns = [];
    return {
      add(fn) { if (fn) fns.push(fn); return fn; },
      listen(target, type, fn, opts) {
        target.addEventListener(type, fn, opts);
        fns.push(() => target.removeEventListener(type, fn, opts));
        return fn;
      },
      timer(fn, ms) { const id = setInterval(fn, ms); fns.push(() => clearInterval(id)); return id; },
      dispose() { fns.splice(0).reverse().forEach((f) => { try { f(); } catch (e) { console.error(e); } }); }
    };
  }

  /* ---------- canvas ---------- */
  function canvas(parent, w, hh, opts) {
    opts = opts || {};
    const c = document.createElement('canvas');
    c.className = 'gcanvas' + (opts.class ? ' ' + opts.class : '');
    const ctx = c.getContext('2d');
    const dpr = clamp(global.devicePixelRatio || 1, 1, 2);
    c.width = Math.round(w * dpr);
    c.height = Math.round(hh * dpr);
    c.style.aspectRatio = w + ' / ' + hh;
    /* big-screen mode reads these to grow the canvas to the viewport */
    c.style.setProperty('--gw', w + 'px');
    c.style.setProperty('--ar', String(w / hh));
    c.style.maxWidth = 'var(--gw)';
    if (opts.maxHeight) c.style.maxHeight = opts.maxHeight;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    parent.appendChild(c);
    return {
      el: c, ctx, w, h: hh,
      pos(ev) {
        const r = c.getBoundingClientRect();
        const p = ev.touches && ev.touches.length ? ev.touches[0]
          : (ev.changedTouches && ev.changedTouches.length ? ev.changedTouches[0] : ev);
        return { x: (p.clientX - r.left) * w / r.width, y: (p.clientY - r.top) * hh / r.height };
      },
      clear(fill) {
        if (fill) { ctx.fillStyle = fill; ctx.fillRect(0, 0, w, hh); }
        else ctx.clearRect(0, 0, w, hh);
      }
    };
  }

  function roundRect(ctx, x, y, w, hh, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(hh) / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + hh, r);
    ctx.arcTo(x + w, y + hh, x, y + hh, r);
    ctx.arcTo(x, y + hh, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  const Engine = {
    paused: false,
    clamp, lerp, rand, randInt, pick, shuffle, fmtTime, h, bag, canvas, roundRect
  };

  /* ---------- game loop (respects a global pause) ---------- */
  Engine.loop = function loop(fn) {
    let last = performance.now();
    let raf = 0;
    let dead = false;
    function tick(now) {
      if (dead) return;
      let dt = (now - last) / 1000;
      last = now;
      if (dt > 0.06) dt = 0.06;          // a backgrounded tab must not explode the sim
      if (!Engine.paused) {
        try { fn(dt); }
        catch (e) { dead = true; console.error(e); return; }
      }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    return () => { dead = true; cancelAnimationFrame(raf); };
  };

  /* ---------- keyboard ---------- */
  const isEditable = (t) => !!t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
  Engine.isEditable = isEditable;

  Engine.keys = function keys(capture) {
    const cap = new Set(capture || []);
    const st = Object.create(null);
    const down = (e) => {
      if (isEditable(e.target)) return;      // typing beats every game binding
      st[e.code] = true; st[e.key] = true;
      if (cap.has(e.code) || cap.has(e.key)) e.preventDefault();
    };
    const up = (e) => { st[e.code] = false; st[e.key] = false; };
    const blur = () => { for (const k in st) st[k] = false; };
    addEventListener('keydown', down);
    addEventListener('keyup', up);
    addEventListener('blur', blur);
    return {
      state: st,
      get(...ks) { return ks.some((k) => !!st[k]); },
      dispose() {
        removeEventListener('keydown', down);
        removeEventListener('keyup', up);
        removeEventListener('blur', blur);
      }
    };
  };

  /* discrete key presses; handler returns true to preventDefault */
  Engine.onKey = function onKey(fn) {
    const down = (e) => {
      if (isEditable(e.target)) return;
      if (fn(e) === true) e.preventDefault();
    };
    addEventListener('keydown', down);
    return () => removeEventListener('keydown', down);
  };

  /* swipe helper for touch */
  Engine.swipe = function swipe(el, fn, threshold) {
    threshold = threshold || 24;
    let sx = 0, sy = 0, active = false;
    const start = (e) => {
      const p = e.touches ? e.touches[0] : e;
      sx = p.clientX; sy = p.clientY; active = true;
    };
    const end = (e) => {
      if (!active) return;
      active = false;
      const p = e.changedTouches ? e.changedTouches[0] : e;
      const dx = p.clientX - sx, dy = p.clientY - sy;
      if (Math.abs(dx) < threshold && Math.abs(dy) < threshold) return;
      fn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    };
    el.addEventListener('touchstart', start, { passive: true });
    el.addEventListener('touchend', end, { passive: true });
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', end);
    return () => {
      el.removeEventListener('touchstart', start);
      el.removeEventListener('touchend', end);
      el.removeEventListener('mousedown', start);
      el.removeEventListener('mouseup', end);
    };
  };

  /* on-screen d-pad for phones */
  Engine.dpad = function dpad(parent, fn, opts) {
    opts = opts || {};
    const mk = (label, dir, cls) =>
      h('button', {
        class: 'dpad-btn ' + cls, type: 'button', 'aria-label': dir,
        onpointerdown: (e) => { e.preventDefault(); fn(dir); }
      }, label);
    const pad = h('div', { class: 'dpad' + (opts.class ? ' ' + opts.class : '') },
      mk('▲', 'up', 'up'), mk('◀', 'left', 'left'),
      opts.center
        ? h('button', {
          class: 'dpad-btn mid', type: 'button',
          onpointerdown: (e) => { e.preventDefault(); fn('action'); }
        }, opts.center)
        : h('span', { class: 'dpad-btn mid ghost' }),
      mk('▶', 'right', 'right'), mk('▼', 'down', 'down'));
    parent.appendChild(pad);
    return pad;
  };

  /* ---------- audio ---------- */
  const audio = (function () {
    let ac;
    function ctx() {
      if (ac === undefined) {
        try { ac = new (global.AudioContext || global.webkitAudioContext)(); }
        catch (e) { ac = null; }
      }
      if (ac && ac.state === 'suspended') ac.resume();
      return ac;
    }
    function tone(o) {
      o = o || {};
      if (api.muted) return;
      const a = ctx();
      if (!a) return;
      const t0 = a.currentTime + (o.delay || 0);
      const osc = a.createOscillator();
      const g = a.createGain();
      osc.type = o.type || 'square';
      const f = o.freq || 440;
      osc.frequency.setValueAtTime(f, t0);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + (o.dur || 0.1));
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(o.vol || 0.12, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + (o.dur || 0.1));
      osc.connect(g); g.connect(a.destination);
      osc.start(t0); osc.stop(t0 + (o.dur || 0.1) + 0.03);
    }
    function noise(o) {
      o = o || {};
      if (api.muted) return;
      const a = ctx();
      if (!a) return;
      const dur = o.dur || 0.15;
      const buf = a.createBuffer(1, Math.ceil(a.sampleRate * dur), a.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      const src = a.createBufferSource();
      src.buffer = buf;
      const g = a.createGain();
      g.gain.value = o.vol || 0.1;
      const flt = a.createBiquadFilter();
      flt.type = 'lowpass';
      flt.frequency.value = o.cutoff || 1400;
      src.connect(flt); flt.connect(g); g.connect(a.destination);
      src.start();
    }
    const api = {
      muted: true,
      tone, noise,
      blip(f) { tone({ freq: f || 640, dur: 0.05, vol: 0.08 }); },
      click() { tone({ freq: 320, dur: 0.03, vol: 0.06, type: 'triangle' }); },
      good() {
        tone({ freq: 520, dur: 0.08, type: 'triangle', vol: 0.12 });
        tone({ freq: 784, dur: 0.12, type: 'triangle', vol: 0.1, delay: 0.07 });
      },
      great() { [523, 659, 784, 1046].forEach((f, i) => tone({ freq: f, dur: 0.12, type: 'triangle', vol: 0.1, delay: i * 0.06 })); },
      bad() { tone({ freq: 180, to: 60, dur: 0.28, type: 'sawtooth', vol: 0.1 }); },
      thud() { noise({ dur: 0.12, cutoff: 500, vol: 0.12 }); },
      boom() { noise({ dur: 0.45, cutoff: 900, vol: 0.16 }); }
    };
    return api;
  })();
  Engine.audio = audio;
  Engine.sfx = audio;

  global.Engine = Engine;
})(window);

</script>
