<title>Cubicle Arcade</title>
<style>
/* Cubicle Arcade */
:root {
  --bg: #0a0d16;
  --bg2: #10142240;
  --panel: #151b2c;
  --panel2: #1c2438;
  --line: #2a3450;
  --ink: #e8ecf7;
  --dim: #8f9ab8;
  --dimmer: #5f6a86;
  --cyan: #38e1ff;
  --mag: #ff5cc8;
  --lime: #9dff5c;
  --amber: #ffc043;
  --red: #ff5a5a;
  --radius: 14px;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background:
    radial-gradient(1200px 700px at 12% -10%, #1c2a55 0%, transparent 60%),
    radial-gradient(900px 600px at 95% 0%, #3a1046 0%, transparent 55%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  min-height: 100%;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(255, 255, 255, .022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, .022) 1px, transparent 1px);
  background-size: 44px 44px;
  z-index: 0;
}

a { color: inherit; text-decoration: none; }

kbd {
  font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  background: #222b44;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 3px 5px;
  color: #cdd6ee;
}

/* ---------------- topbar ---------------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 18px;
  background: rgba(10, 13, 22, .78);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}

.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; letter-spacing: -.02em; }
.brand-mark {
  display: grid; place-items: center;
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, var(--cyan), var(--mag));
  color: #06101c; font-size: 15px;
}
.brand-text { font-size: 17px; }
.brand-text em { font-style: normal; color: var(--cyan); margin-left: 4px; }
.topbar-spacer { flex: 1; }

.search {
  width: min(260px, 42vw);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--ink);
  padding: 8px 14px;
  font-size: 13px;
  outline: none;
}
.search:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px #38e1ff22; }

.icon-btn {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  width: 36px; height: 34px;
  font-size: 15px;
  cursor: pointer;
  color: var(--ink);
  transition: transform .1s, border-color .15s, background .15s;
}
.icon-btn:hover { border-color: var(--cyan); transform: translateY(-1px); }
.icon-btn.on { border-color: var(--lime); }

/* ---------------- layout ---------------- */
.view {
  position: relative;
  z-index: 1;
  flex: 1;
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: 26px 18px 48px;
}

.foot {
  position: relative;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: space-between;
  padding: 16px 22px 26px;
  color: var(--dimmer);
  font-size: 12px;
  border-top: 1px solid #1b2338;
}

/* ---------------- hero + hub ---------------- */
.hero { margin: 10px 0 22px; }
.hero h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 46px); letter-spacing: -.03em; }
.hero .accent { background: linear-gradient(100deg, var(--cyan), var(--mag)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { margin: 0; color: var(--dim); max-width: 62ch; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.chip {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--dim);
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
}
.chip:hover { color: var(--ink); border-color: #3d4a70; }
.chip.active { background: linear-gradient(120deg, #38e1ff22, #ff5cc822); border-color: var(--cyan); color: var(--ink); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(232px, 1fr));
  gap: 14px;
}

.card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 16px 16px 14px;
  background: linear-gradient(170deg, var(--panel2), var(--panel));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  transition: transform .13s ease, border-color .13s, box-shadow .13s;
}
.card::after {
  content: "";
  position: absolute;
  inset: 0 auto auto 0;
  width: 100%; height: 3px;
  background: var(--accent, var(--cyan));
  opacity: .8;
}
.card:hover { transform: translateY(-3px); border-color: var(--accent, var(--cyan)); box-shadow: 0 12px 30px -14px var(--accent, #38e1ff); }
.card.cat-sim { --accent: #38e1ff; }
.card.cat-puzzle { --accent: #ffc043; }
.card.cat-action { --accent: #ff5cc8; }
.card.cat-brain { --accent: #9dff5c; }

.card-emoji { font-size: 27px; line-height: 1; margin-bottom: 2px; }
.card-cat { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 700; }
.card-title { margin: 0; font-size: 17px; letter-spacing: -.01em; }
.card-blurb { margin: 0; font-size: 13px; color: var(--dim); flex: 1; }
.card-best { font: 600 11.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dimmer); margin-top: 8px; }

.empty { color: var(--dim); }

/* ---------------- game shell ---------------- */
.gamehead { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
.back { color: var(--dim); font-size: 13px; font-weight: 600; }
.back:hover { color: var(--cyan); }
.gtitle { margin: 0; font-size: 21px; display: flex; align-items: center; gap: 9px; letter-spacing: -.02em; }
.ge { font-size: 22px; }
.gmeta { margin-left: auto; display: flex; gap: 8px; }

.howto { flex-basis: 100%; order: 9; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; }
.howto summary { cursor: pointer; padding: 9px 0; font-size: 13px; font-weight: 600; color: var(--dim); list-style: none; }
.howto summary::marker, .howto summary::-webkit-details-marker { display: none; }
.howto summary::before { content: "?"; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line); margin-right: 8px; font-size: 10px; }
.howto[open] summary { color: var(--ink); }
.howto ul { margin: 0 0 12px; padding-left: 20px; color: var(--dim); font-size: 13px; }
.howto li { margin: 3px 0; }

.gametools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }

.btn {
  background: var(--panel2);
  border: 1px solid var(--line);
  color: var(--ink);
  border-radius: 9px;
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color .13s, background .13s, transform .1s;
}
.btn:hover { border-color: var(--cyan); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(120deg, var(--cyan), #4aa8ff); color: #04121e; border-color: transparent; }
.btn.danger { border-color: #6b2b3a; color: #ffb3c0; }
.btn.on { border-color: var(--lime); color: var(--lime); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 13px;
  font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--dim);
  white-space: nowrap;
}
.pill.best { color: var(--amber); }
.pill.good { color: var(--lime); border-color: #34532a; }
.pill.warn { color: var(--amber); border-color: #5b471c; }
.pill.bad { color: var(--red); border-color: #5e2a2a; }

.sel-wrap { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
.sel {
  background: var(--panel2);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 8px;
  font-size: 12.5px;
}

.status { min-height: 20px; margin-bottom: 10px; color: var(--dim); font-size: 13.5px; }

.stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }

.gcanvas {
  width: 100%;
  border-radius: 12px;
  background: #070a12;
  border: 1px solid var(--line);
  touch-action: manipulation;
  display: block;
}

.panelrow { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; width: 100%; }
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
}
.panel h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dimmer); }

.banner {
  width: min(560px, 100%);
  text-align: center;
  padding: 16px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--panel);
}
.banner h3 { margin: 0 0 6px; font-size: 19px; }
.banner p { margin: 0 0 10px; color: var(--dim); font-size: 13.5px; }

/* meters */
.meter { width: 100%; height: 9px; border-radius: 99px; background: #0c1120; border: 1px solid var(--line); overflow: hidden; }
.meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--lime), var(--amber), var(--red)); transition: width .2s; }

/* ---------------- d-pad ---------------- */
.dpad {
  display: grid;
  grid-template-columns: repeat(3, 54px);
  grid-template-rows: repeat(3, 46px);
  gap: 6px;
  justify-content: center;
}
.dpad .up { grid-area: 1 / 2; }
.dpad .left { grid-area: 2 / 1; }
.dpad .mid { grid-area: 2 / 2; }
.dpad .right { grid-area: 2 / 3; }
.dpad .down { grid-area: 3 / 2; }
.dpad-btn {
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--ink);
  font-size: 15px;
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
}
.dpad-btn:active { background: #2a3450; }
.dpad-btn.ghost { background: transparent; border-color: transparent; }
@media (hover: hover) and (pointer: fine) { .dpad.touch-only { display: none; } }

/* ---------------- grid-based games ---------------- */
.board { display: grid; gap: 4px; user-select: none; touch-action: manipulation; }
.cell {
  display: grid;
  place-items: center;
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 7px;
  font: 700 16px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  cursor: pointer;
}

/* minesweeper */
.ms { background: #0d1220; padding: 8px; border-radius: 12px; border: 1px solid var(--line); }
.ms .cell { width: 30px; height: 30px; font-size: 15px; border-radius: 5px; background: #26304a; border-color: #323e60; }
.ms .cell:hover { background: #313d5e; }
.ms .cell.open { background: #131a2c; border-color: #1e2740; cursor: default; }
.ms .cell.mine { background: #6b1f2c; }
.ms .cell.flag { color: var(--amber); }
.ms .n1 { color: #6aa9ff; } .ms .n2 { color: #6ee06e; } .ms .n3 { color: #ff8080; }
.ms .n4 { color: #b48cff; } .ms .n5 { color: #ffb04d; } .ms .n6 { color: #4ce0d0; }
.ms .n7 { color: #ff7fd0; } .ms .n8 { color: #b9c4dd; }

/* 2048 */
.g2048 { background: #131a2c; padding: 9px; border-radius: 14px; border: 1px solid var(--line); }
.g2048 .cell { width: 74px; height: 74px; font-size: 26px; background: #1b2440; border: none; color: #0a0d16; transition: background .1s; }
.g2048 .cell[data-v="0"] { background: #1b2440; color: transparent; }
.g2048 .cell[data-v="2"] { background: #dfe6f5; }
.g2048 .cell[data-v="4"] { background: #cdd8f0; }
.g2048 .cell[data-v="8"] { background: #7ad0ff; }
.g2048 .cell[data-v="16"] { background: #46b7ff; }
.g2048 .cell[data-v="32"] { background: #6c8dff; color: #fff; }
.g2048 .cell[data-v="64"] { background: #a06cff; color: #fff; }
.g2048 .cell[data-v="128"] { background: #ff6cd0; color: #fff; font-size: 23px; }
.g2048 .cell[data-v="256"] { background: #ff5c8f; color: #fff; font-size: 23px; }
.g2048 .cell[data-v="512"] { background: #ff9040; color: #fff; font-size: 23px; }
.g2048 .cell[data-v="1024"] { background: #ffc043; font-size: 19px; }
.g2048 .cell[data-v="2048"] { background: #9dff5c; font-size: 19px; box-shadow: 0 0 22px #9dff5c88; }
.g2048 .cell.big { font-size: 17px; background: #eaff8a; }
.g2048 .cell.pop { animation: pop .16s ease; }
@keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
@media (max-width: 480px) { .g2048 .cell { width: 62px; height: 62px; font-size: 22px; } }

/* wordle */
.wg-board { display: grid; gap: 6px; }
.wg-row { display: grid; grid-template-columns: repeat(5, 56px); gap: 6px; }
.wg-tile {
  display: grid; place-items: center;
  width: 56px; height: 56px;
  border: 2px solid #2a3450;
  border-radius: 8px;
  font: 800 25px/1 ui-sans-serif, system-ui, sans-serif;
  text-transform: uppercase;
  background: #101728;
}
.wg-tile.filled { border-color: #46557f; }
.wg-tile.hit { background: #2f9e4f; border-color: #2f9e4f; }
.wg-tile.near { background: #c9a227; border-color: #c9a227; color: #17130a; }
.wg-tile.miss { background: #222b41; border-color: #222b41; color: #7f8aa8; }
.wg-tile.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.kbd-row { display: flex; gap: 5px; justify-content: center; margin-bottom: 5px; }
.kbd-key {
  min-width: 34px; height: 44px; padding: 0 8px;
  background: #2a3450; border: none; border-radius: 6px;
  color: var(--ink); font-weight: 700; font-size: 13px; text-transform: uppercase; cursor: pointer;
}
.kbd-key.wide { min-width: 52px; font-size: 11px; }
.kbd-key.hit { background: #2f9e4f; }
.kbd-key.near { background: #c9a227; color: #17130a; }
.kbd-key.miss { background: #161d2f; color: #59637e; }
@media (max-width: 420px) {
  .wg-row { grid-template-columns: repeat(5, 46px); }
  .wg-tile { width: 46px; height: 46px; font-size: 21px; }
  .kbd-key { min-width: 27px; height: 40px; padding: 0 4px; }
}

/* lights out */
.lo .cell { width: 62px; height: 62px; border-radius: 10px; background: #161d2f; border-color: #232c46; }
.lo .cell.on { background: radial-gradient(circle at 35% 30%, #fff4c2, #ffc043 55%, #d98a12); border-color: #ffd980; box-shadow: 0 0 18px #ffc04366; }

/* power grid */
.plant { min-width: 172px; max-width: 210px; }
.plant .row { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--dim); margin-top: 5px; }
.plant .row > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plant .val { color: var(--ink); font-family: ui-monospace, Menlo, monospace; white-space: nowrap; flex: none; }
.slider { width: 100%; accent-color: var(--cyan); }

/* ---------------- boss screen ---------------- */
.boss {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: #f6f7fb;
  color: #1b1c1f;
  display: flex;
  flex-direction: column;
  font: 13px/1.35 "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
}
.boss.hidden { display: none; }
body.boss-on { overflow: hidden; }
.boss-bar {
  display: flex; align-items: center; gap: 18px;
  padding: 7px 14px;
  background: #217346;
  color: #fff;
}
.boss-file { font-weight: 600; }
.boss-menu { display: flex; gap: 14px; opacity: .92; font-size: 12.5px; }
.boss-hint { margin-left: auto; font-size: 10.5px; opacity: .45; }
.boss-formula {
  display: flex; align-items: center; gap: 10px;
  padding: 5px 12px; background: #fff; border-bottom: 1px solid #d8dbe2;
  font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #444;
}
.boss-formula .cellref { min-width: 62px; border: 1px solid #d8dbe2; padding: 2px 6px; border-radius: 3px; }
.boss-formula .fx { font-style: italic; color: #888; }
.boss-sheet { flex: 1; overflow: auto; background: #fff; }
.boss-sheet table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.boss-sheet th, .boss-sheet td {
  border: 1px solid #dfe2e9; padding: 3px 9px; text-align: left; white-space: nowrap; height: 23px;
}
.boss-sheet th { background: #f0f2f6; color: #666; font-weight: 600; text-align: center; }
.boss-sheet .rowhead { background: #f0f2f6; color: #888; text-align: center; width: 34px; }
.boss-sheet .hcell { font-weight: 700; background: #eef4ef; }
.boss-sheet .num { text-align: right; font-variant-numeric: tabular-nums; }
.boss-sheet .pos { color: #14743a; }
.boss-sheet .neg { color: #b3261e; }
.boss-sheet .total td { font-weight: 700; background: #f7f9fc; border-top: 2px solid #217346; }
.boss-tabs { display: flex; gap: 2px; padding: 4px 10px; background: #eef0f4; border-top: 1px solid #d8dbe2; }
.boss-tabs .tab { padding: 4px 12px; font-size: 12px; color: #555; border-radius: 3px 3px 0 0; }
.boss-tabs .tab.active { background: #fff; font-weight: 600; color: #217346; }

@media (max-width: 640px) {
  .topbar { padding: 8px 12px; gap: 7px; }
  .brand-text { display: none; }
  .view { padding: 18px 12px 36px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 10px; }
  .card { padding: 12px; }
}

/* Cubicle Arcade — shared engine helpers.
   Plain old script (no modules) so the site works from file:// as well as a server. */
(function (global) {
  'use strict';

  /* ---------- math / misc ---------- */
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
  const randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = randInt(0, i);
      const t = a[i]; a[i] = a[j]; a[j] = t;

    return a;
  };
  const fmtTime = (s) => {
    s = Math.max(0, Math.floor(s));
    const m = Math.floor(s / 60);
    return m + ':' + String(s % 60).padStart(2, '0');
  };

  /* ---------- tiny DOM builder ---------- */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs && (typeof attrs !== 'object' || attrs.nodeType)) { kids.unshift(attrs); attrs = null; }
    for (const k in attrs || {}) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k === 'data' && typeof v === 'object') Object.assign(el.dataset, v);
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else el.setAttribute(k, v === true ? '' : v);

    for (const kid of kids.flat(9)) {
      if (kid == null || kid === false || kid === '') continue;
      el.appendChild(kid && kid.nodeType ? kid : document.createTextNode(String(kid)));

    return el;
  }

  /* ---------- disposer bag ---------- */
  function bag() {
    const fns = [];
    return {
      add(fn) { if (fn) fns.push(fn); return fn; },
      listen(target, type, fn, opts) {
        target.addEventListener(type, fn, opts);
        fns.push(() => target.removeEventListener(type, fn, opts));
        return fn;

      timer(fn, ms) { const id = setInterval(fn, ms); fns.push(() => clearInterval(id)); return id; },
      dispose() { fns.splice(0).reverse().forEach((f) => { try { f(); } catch (e) { console.error(e); } }); }
    };
  }

  /* ---------- canvas ---------- */
  function canvas(parent, w, hh, opts) {
    opts = opts || {};
    const c = document.createElement('canvas');
    c.className = 'gcanvas' + (opts.class ? ' ' + opts.class : '');

    c.width = Math.round(w * dpr);
    c.height = Math.round(hh * dpr);
    c.style.aspectRatio = w + ' / ' + hh;
    c.style.maxWidth = w + 'px';
    if (opts.maxHeight) c.style.maxHeight = opts.maxHeight;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    parent.appendChild(c);
    return {
      el: c, ctx, w, h: hh,
      pos(ev) {
        const r = c.getBoundingClientRect();
        const p = ev.touches && ev.touches.length ? ev.touches[0]
          : (ev.changedTouches && ev.changedTouches.length ? ev.changedTouches[0] : ev);
        return { x: (p.clientX - r.left) * w / r.width, y: (p.clientY - r.top) * hh / r.height };
      },
      clear(fill) {
        if (fill) { ctx.fillStyle = fill; ctx.fillRect(0, 0, w, hh); }
        else ctx.clearRect(0, 0, w, hh);
      }
    };
  }

  function roundRect(ctx, x, y, w, hh, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(hh) / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + hh, r);
    ctx.arcTo(x + w, y + hh, x, y + hh, r);
    ctx.arcTo(x, y + hh, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  const Engine = {
    paused: false,
    clamp, lerp, rand, randInt, pick, shuffle, fmtTime, h, bag, canvas, roundRect
  };

  /* ---------- game loop (respects a global pause) ---------- */
  Engine.loop = function loop(fn) {
    let last = performance.now();
    let raf = 0;
    let dead = false;
    function tick(now) {
      if (dead) return;
      let dt = (now - last) / 1000;
      last = now;
      if (dt > 0.06) dt = 0.06;          // a backgrounded tab must not explode the sim
      if (!Engine.paused) {
        try { fn(dt); }
        catch (e) { dead = true; console.error(e); return; }
      }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    return () => { dead = true; cancelAnimationFrame(raf); };
  };

  /* ---------- keyboard ---------- */
  Engine.keys = function keys(capture) {
    const cap = new Set(capture || []);
    const st = Object.create(null);
    const down = (e) => {
      st[e.code] = true; st[e.key] = true;
      if (cap.has(e.code) || cap.has(e.key)) e.preventDefault();
    };
    const up = (e) => { st[e.code] = false; st[e.key] = false; };
    const blur = () => { for (const k in st) st[k] = false; };
    addEventListener('keydown', down);
    addEventListener('keyup', up);
    addEventListener('blur', blur);
    return {
      state: st,
      get(...ks) { return ks.some((k) => !!st[k]); },
      dispose() {
        removeEventListener('keydown', down);
        removeEventListener('keyup', up);
        removeEventListener('blur', blur);
      }
    };
  };

  /* discrete key presses; handler returns true to preventDefault */
  Engine.onKey = function onKey(fn) {
    const down = (e) => {
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      if (fn(e) === true) e.preventDefault();
    };
    addEventListener('keydown', down);
    return () => removeEventListener('keydown', down);
  };

  /* swipe helper for touch */
  Engine.swipe = function swipe(el, fn, threshold) {
    threshold = threshold || 24;
    let sx = 0, sy = 0, active = false;
    const start = (e) => {
      const p = e.touches ? e.touches[0] : e;
      sx = p.clientX; sy = p.clientY; active = true;
    };
    const end = (e) => {
      if (!active) return;
      active = false;
      const p = e.changedTouches ? e.changedTouches[0] : e;
      const dx = p.clientX - sx, dy = p.clientY - sy;
      if (Math.abs(dx) < threshold && Math.abs(dy) < threshold) return;
      fn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    };
    el.addEventListener('touchstart', start, { passive: true });
    el.addEventListener('touchend', end, { passive: true });
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', end);
    return () => {
      el.removeEventListener('touchstart', start);
      el.removeEventListener('touchend', end);
      el.removeEventListener('mousedown', start);
      el.removeEventListener('mouseup', end);
    };
  };

  /* on-screen d-pad for phones */
  Engine.dpad = function dpad(parent, fn, opts) {
    opts = opts || {};
    const mk = (label, dir, cls) =>
      h('button', {
        class: 'dpad-btn ' + cls, type: 'button', 'aria-label': dir,
        onpointerdown: (e) => { e.preventDefault(); fn(dir); }
      }, label);
    const pad = h('div', { class: 'dpad' + (opts.class ? ' ' + opts.class : '') },
      mk('▲', 'up', 'up'), mk('◀', 'left', 'left'),
      opts.center
        ? h('button', {
          class: 'dpad-btn mid', type: 'button',
          onpointerdown: (e) => { e.preventDefault(); fn('action'); }
        }, opts.center)
        : h('span', { class: 'dpad-btn mid ghost' }),
      mk('▶', 'right', 'right'), mk('▼', 'down', 'down'));
    parent.appendChild(pad);
    return pad;
  };

  /* ---------- audio ---------- */
  const audio = (function () {
    let ac;
    function ctx() {
      if (ac === undefined) {
        try { ac = new (global.AudioContext || global.webkitAudioContext)(); }
        catch (e) { ac = null; }
      }
      if (ac && ac.state === 'suspended') ac.resume();
      return ac;
    }
    function tone(o) {
      o = o || {};
      if (api.muted) return;
      const a = ctx();
      if (!a) return;
      const t0 = a.currentTime + (o.delay || 0);
      const osc = a.createOscillator();
      const g = a.createGain();
      osc.type = o.type || 'square';
      const f = o.freq || 440;
      osc.frequency.setValueAtTime(f, t0);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + (o.dur || 0.1));
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(o.vol || 0.12, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + (o.dur || 0.1));
      osc.connect(g); g.connect(a.destination);
      osc.start(t0); osc.stop(t0 + (o.dur || 0.1) + 0.03);
    }
    function noise(o) {
      o = o || {};
      if (api.muted) return;
      const a = ctx();
      if (!a) return;
      const dur = o.dur || 0.15;
      const buf = a.createBuffer(1, Math.ceil(a.sampleRate * dur), a.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      const src = a.createBufferSource();
      src.buffer = buf;
      const g = a.createGain();
      g.gain.value = o.vol || 0.1;
      const flt = a.createBiquadFilter();
      flt.type = 'lowpass';
      flt.frequency.value = o.cutoff || 1400;
      src.connect(flt); flt.connect(g); g.connect(a.destination);
      src.start();
    }
    const api = {
      muted: true,
      tone, noise,
      blip(f) { tone({ freq: f || 640, dur: 0.05, vol: 0.08 }); },
      click() { tone({ freq: 320, dur: 0.03, vol: 0.06, type: 'triangle' }); },
      good() {
        tone({ freq: 520, dur: 0.08, type: 'triangle', vol: 0.12 });
        tone({ freq: 784, dur: 0.12, type: 'triangle', vol: 0.1, delay: 0.07 });
      },
      great() { [523, 659, 784, 1046].forEach((f, i) => tone({ freq: f, dur: 0.12, type: 'triangle', vol: 0.1, delay: i * 0.06 })); },
      bad() { tone({ freq: 180, to: 60, dur: 0.28, type: 'sawtooth', vol: 0.1 }); },
      thud() { noise({ dur: 0.12, cutoff: 500, vol: 0.12 }); },
      boom() { noise({ dur: 0.45, cutoff: 900, vol: 0.16 }); }
    };
    return api;
  })();
  Engine.audio = audio;
  Engine.sfx = audio;

  global.Engine = Engine;
})(window);

</script>
<script>
/* Cubicle Arcade — registry, hub, router, scores, boss key. */
(function (global) {
  'use strict';

  const h = Engine.h;

  const games = [];
  const byId = new Map();
  const CATS = [
    { id: 'sim', label: 'Simulations' },
    { id: 'puzzle', label: 'Puzzles' },
    { id: 'action', label: 'Action' },
    { id: 'brain', label: 'Brain' }
  ];

  /* ---------------- storage ---------------- */
  const store = {
    get(k, d) {
      try { const v = localStorage.getItem('cubicle:' + k); return v == null ? d : JSON.parse(v); }
      catch (e) { return d; }
    },
    set(k, v) { try { localStorage.setItem('cubicle:' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } }
  };

  let currentDispose = null;
  let currentGame = null;
  let bossOn = false;
  const REAL_TITLE = 'Cubicle Arcade';
  const BOSS_TITLE = 'Q3_Regional_Forecast_v7_FINAL.xlsx';

  /* ---------------- public API ---------------- */
  const Arcade = {
    CATS,
    register(def) {
      if (byId.has(def.id)) { console.warn('duplicate game id', def.id); return; }
      const g = Object.assign(
        { cat: 'puzzle', emoji: '🎮', blurb: '', how: [], scoreLabel: 'Best', lowerIsBetter: false },
        def);
      games.push(g);
      byId.set(g.id, g);
      return g;
    },
    games: () => games.slice(),
    get: (id) => byId.get(id),

    best(id) { return store.get('best:' + id, null); },
    submit(id, value) {
      const g = byId.get(id);
      const prev = store.get('best:' + id, null);
      const better = prev == null || (g && g.lowerIsBetter ? value < prev : value > prev);
      if (better) store.set('best:' + id, value);
      store.set('plays:' + id, store.get('plays:' + id, 0) + 1);
      return { best: better ? value : prev, isRecord: better && prev != null, isFirst: prev == null };
    },
    plays(id) { return store.get('plays:' + id, 0); },
    store,
    muted() { return Engine.audio.muted; },
    go(id) { location.hash = id ? '#g/' + id : ''; }
  };
  global.Arcade = Arcade;

  /* ---------------- chrome ---------------- */
  function buildChrome() {
    const search = h('input', {
      class: 'search', type: 'search', placeholder: 'Search games…   /', 'aria-label': 'Search games',
      oninput: () => { if (!location.hash) renderHub(); }
    });
    Arcade._search = search;

    const soundBtn = h('button', { class: 'icon-btn', type: 'button', title: 'Sound on/off' });
    const syncSound = () => {
      soundBtn.textContent = Engine.audio.muted ? '🔇' : '🔊';
      soundBtn.classList.toggle('on', !Engine.audio.muted);
    };
    soundBtn.addEventListener('click', () => {
      Engine.audio.muted = !Engine.audio.muted;
      store.set('muted', Engine.audio.muted);
      syncSound();
      if (!Engine.audio.muted) Engine.audio.good();
    });
    Engine.audio.muted = store.get('muted', true);
    syncSound();

    const bar = h('header', { class: 'topbar' },
      h('a', { class: 'brand', href: '#' },
        h('span', { class: 'brand-mark' }, '▚'),
        h('span', { class: 'brand-text' }, 'Cubicle', h('em', null, 'Arcade'))),
      h('div', { class: 'topbar-spacer' }),
      search,
      h('button', {
        class: 'icon-btn', type: 'button', title: 'Random game',
        onclick: () => Arcade.go(Engine.pick(games).id)
      }, '🎲'),
      soundBtn,
      h('button', { class: 'icon-btn boss-btn', type: 'button', title: 'Boss key (`)', onclick: () => toggleBoss() }, '🕴️'));

    const view = h('main', { id: 'view', class: 'view' });
    const foot = h('footer', { class: 'foot' },
      h('span', null, 'No accounts. No network. Everything runs in this tab.'),
      h('span', null, h('kbd', null, '`'), ' boss key · ', h('kbd', null, '/'), ' search · ', h('kbd', null, 'Esc'), ' back to hub'));
    document.body.append(bar, view, foot);
    return view;
  }

  /* ---------------- hub ---------------- */
  let activeCat = 'all';

  function renderHub() {
    const view = document.getElementById('view');
    if (!view) return;
    const q = ((Arcade._search && Arcade._search.value) || '').trim().toLowerCase();

    const list = games.filter((g) => {
      if (activeCat !== 'all' && g.cat !== activeCat) return false;
      if (!q) return true;
      return (g.title + ' ' + g.blurb + ' ' + (g.tags || []).join(' ') + ' ' + g.cat).toLowerCase().includes(q);
    });

    const chips = h('div', { class: 'chips' },
      ['all'].concat(CATS.map((c) => c.id)).map((id) =>
        h('button', {
          class: 'chip' + (activeCat === id ? ' active' : ''), type: 'button',
          onclick: () => { activeCat = id; renderHub(); }
        }, id === 'all'
          ? 'All ' + games.length
          : (CATS.find((c) => c.id === id) || {}).label + ' ' + games.filter((g) => g.cat === id).length)));

    const cards = list.map((g) => {
      const best = Arcade.best(g.id);
      return h('a', { class: 'card cat-' + g.cat, href: '#g/' + g.id },
        h('span', { class: 'card-emoji' }, g.emoji),
        h('span', { class: 'card-cat' }, (CATS.find((c) => c.id === g.cat) || { label: g.cat }).label),
        h('h3', { class: 'card-title' }, g.title),
        h('p', { class: 'card-blurb' }, g.blurb),
        h('span', { class: 'card-best' },
          best == null ? 'not played yet' : g.scoreLabel + ': ' + (g.formatScore ? g.formatScore(best) : best)));
    });

    view.replaceChildren(
      h('section', { class: 'hero' },
        h('h1', null, 'Look busy. ', h('span', { class: 'accent' }, 'Be busy.')),
        h('p', null,
          games.length + ' games and fix-the-system simulations. They load instantly, need no account, ',
          'and vanish behind a spreadsheet the moment you hit ', h('kbd', null, '`'), '.')),
      chips,
      h('div', { class: 'grid' }, cards.length ? cards : h('p', { class: 'empty' }, 'Nothing matches that search.')));
    document.title = bossOn ? BOSS_TITLE : REAL_TITLE;
  }

  /* ---------------- game shell ---------------- */
  function renderGame(g) {
    const view = document.getElementById('view');
    const stage = h('div', { class: 'stage' });
    const statusEl = h('div', { class: 'status' });
    const bestEl = h('span', { class: 'pill best' });

    const syncBest = () => {
      const b = Arcade.best(g.id);
      bestEl.textContent = b == null
        ? g.scoreLabel + ': —'
        : g.scoreLabel + ': ' + (g.formatScore ? g.formatScore(b) : b);
    };
    syncBest();

    const toolbar = h('div', { class: 'gametools' });

    const api = {
      game: g,
      stage,
      toolbar,
      status(txt) { statusEl.textContent = txt || ''; },
      submit(v) { const r = Arcade.submit(g.id, v); syncBest(); return r; },
      best() { return Arcade.best(g.id); },
      sfx: Engine.audio,
      save(k, v) { store.set('g:' + g.id + ':' + k, v); },
      load(k, d) { return store.get('g:' + g.id + ':' + k, d); },
      button(label, fn, cls) {
        const b = h('button', { class: 'btn ' + (cls || ''), type: 'button', onclick: fn }, label);
        toolbar.appendChild(b);
        return b;
      },
      pill(label, cls) {
        const p = h('span', { class: 'pill ' + (cls || '') }, label);
        toolbar.appendChild(p);
        return p;
      },
      select(label, options, value, fn) {
        const sel = h('select', { class: 'sel', onchange: () => fn(sel.value) },
          options.map((o) => h('option', { value: o.value, selected: o.value === value ? true : null }, o.label)));
        toolbar.appendChild(h('label', { class: 'sel-wrap' }, h('span', null, label), sel));
        return sel;
      }
    };

    view.replaceChildren(
      h('div', { class: 'gamehead' },
        h('a', { class: 'back', href: '#' }, '← All games'),
        h('h2', { class: 'gtitle' }, h('span', { class: 'ge' }, g.emoji), g.title),
        h('div', { class: 'gmeta' }, bestEl),
        h('details', { class: 'howto' },
          h('summary', null, 'How to play'),
          h('ul', null, g.how.map((s) => h('li', null, s))))),
      toolbar, statusEl, stage);

    let dispose = null;
    try {
      dispose = g.mount(stage, api);
    } catch (e) {
      console.error('[' + g.id + '] failed to start', e);
      stage.replaceChildren(h('p', { class: 'empty' }, 'This game hit a snag starting up — check the console.'));
    }
    currentDispose = () => { if (typeof dispose === 'function') dispose(); };
    currentGame = g;
    document.title = bossOn ? BOSS_TITLE : g.title + ' — ' + REAL_TITLE;
  }

  /* ---------------- router ---------------- */
  function route() {
    if (currentDispose) { try { currentDispose(); } catch (e) { console.error(e); } }
    currentDispose = null;
    currentGame = null;
    Engine.paused = bossOn || document.hidden;
    const m = /^#g\/([\w-]+)/.exec(location.hash || '');
    const g = m && byId.get(m[1]);
    if (g) {
      const recent = store.get('recent', []).filter((x) => x !== g.id);
      recent.unshift(g.id);
      store.set('recent', recent.slice(0, 8));
      renderGame(g);
    } else {
      renderHub();
    }
    scrollTo(0, 0);
  }

  /* ---------------- boss key ---------------- */
  const SHEET_ROWS = [
    ['Northeast', 'Enterprise', 1284900, 1402350, 9.1, 'On track'],
    ['Northeast', 'Mid-Market', 842100, 811200, -3.7, 'At risk'],
    ['Southeast', 'Enterprise', 977400, 1055800, 8.0, 'On track'],
    ['Southeast', 'SMB', 431050, 468990, 8.8, 'On track'],
    ['Midwest', 'Enterprise', 1120600, 1098450, -2.0, 'Watch'],
    ['Midwest', 'Mid-Market', 655300, 702110, 7.1, 'On track'],
    ['Mountain', 'SMB', 288750, 301400, 4.4, 'On track'],
    ['Pacific', 'Enterprise', 1640200, 1822900, 11.1, 'Ahead'],
    ['Pacific', 'Mid-Market', 903800, 889700, -1.6, 'Watch'],
    ['Pacific', 'SMB', 512400, 559330, 9.2, 'On track'],
    ['International', 'Enterprise', 1345000, 1290500, -4.1, 'At risk'],
    ['International', 'Mid-Market', 720900, 764480, 6.0, 'On track'],
    ['International', 'SMB', 398200, 425610, 6.9, 'On track'],
    ['Public Sector', 'Enterprise', 1088000, 1141200, 4.9, 'On track'],
    ['Public Sector', 'Mid-Market', 470300, 455900, -3.1, 'Watch']
  ];
  const money = (n) => '$' + n.toLocaleString('en-US');

  function buildBoss() {
    const cols = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
    const head = h('tr', null, h('th', { class: 'rowhead' }, ''), cols.map((l) => h('th', null, l)));
    const rows = [h('tr', null, h('td', { class: 'rowhead' }, '1'),
      ['Region', 'Segment', 'FY Plan', 'FY Actual', 'Var %', 'Status', 'Owner'].map((t) => h('td', { class: 'hcell' }, t)))];
    SHEET_ROWS.forEach((r, i) => {
      rows.push(h('tr', null,
        h('td', { class: 'rowhead' }, i + 2),
        h('td', null, r[0]), h('td', null, r[1]),
        h('td', { class: 'num' }, money(r[2])),
        h('td', { class: 'num' }, money(r[3])),
        h('td', { class: 'num ' + (r[4] < 0 ? 'neg' : 'pos') }, (r[4] > 0 ? '+' : '') + r[4].toFixed(1) + '%'),
        h('td', null, r[5]),
        h('td', null, '')));
    });
    rows.push(h('tr', { class: 'total' },
      h('td', { class: 'rowhead' }, SHEET_ROWS.length + 2),
      h('td', null, 'TOTAL'), h('td', null, ''),
      h('td', { class: 'num' }, money(SHEET_ROWS.reduce((a, r) => a + r[2], 0))),
      h('td', { class: 'num' }, money(SHEET_ROWS.reduce((a, r) => a + r[3], 0))),
      h('td', { class: 'num pos' }, '+3.4%'), h('td', null, ''), h('td', null, '')));
    for (let i = 0; i < 8; i++) {
      rows.push(h('tr', null, h('td', { class: 'rowhead' }, SHEET_ROWS.length + 3 + i), cols.map(() => h('td', null, ''))));
    }

    return h('div', { class: 'boss hidden', id: 'boss', 'aria-hidden': 'true' },
      h('div', { class: 'boss-bar' },
        h('span', { class: 'boss-file' }, BOSS_TITLE),
        h('span', { class: 'boss-menu' }, ['File', 'Edit', 'View', 'Insert', 'Format', 'Data', 'Tools', 'Help'].map((m) => h('span', null, m))),
        h('span', { class: 'boss-hint' }, 'press ` to resume')),
      h('div', { class: 'boss-formula' },
        h('span', { class: 'cellref' }, 'D18'), h('span', { class: 'fx' }, 'fx'), h('span', null, '=SUM(D2:D16)')),
      h('div', { class: 'boss-sheet' }, h('table', null, h('thead', null, head), h('tbody', null, rows))),
      h('div', { class: 'boss-tabs' },
        h('span', { class: 'tab active' }, 'Summary'),
        h('span', { class: 'tab' }, 'By Region'),
        h('span', { class: 'tab' }, 'Pipeline'),
        h('span', { class: 'tab' }, 'Assumptions'),
        h('span', { class: 'tab' }, 'Sheet4')));
  }

  function toggleBoss(force) {
    bossOn = force === undefined ? !bossOn : force;
    const el = document.getElementById('boss');
    if (el) {
      el.classList.toggle('hidden', !bossOn);
      el.setAttribute('aria-hidden', bossOn ? 'false' : 'true');
    }
    document.body.classList.toggle('boss-on', bossOn);
    Engine.paused = bossOn || document.hidden;
    document.title = bossOn ? BOSS_TITLE : (currentGame ? currentGame.title + ' — ' + REAL_TITLE : REAL_TITLE);
  }
  Arcade.toggleBoss = toggleBoss;

  /* ---------------- boot ---------------- */
  Arcade.start = function start() {
    games.sort((a, b) => (a.order || 50) - (b.order || 50));
    buildChrome();
    document.body.appendChild(buildBoss());

    addEventListener('hashchange', route);

    addEventListener('keydown', (e) => {
      const t = e.target;
      const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
      if (e.key === '`' || (e.ctrlKey && !e.altKey && e.key.toLowerCase() === 'b' && !typing)) {
        e.preventDefault();
        toggleBoss();
        return;
      }
      if (bossOn) return;
      if (typing) {
        if (e.key === 'Escape') { t.value = ''; t.blur(); if (!location.hash) renderHub(); }
        return;
      }
      if (e.key === '/') { e.preventDefault(); if (!location.hash) Arcade._search.focus(); }
      if (e.key === 'Escape' && location.hash) location.hash = '';
    });

    addEventListener('visibilitychange', () => {
      Engine.paused = bossOn || document.hidden;
    });

    route();
  };

<script>
/* Gridlock — traffic light simulation. Keep a city grid flowing. */
(function () {
  'use strict';
  const { h, clamp, rand, randInt, pick } = Engine;

  const W = 960, H = 560;
  const ROWS = 3, COLS = 4;
  const X0 = 150, DX = 220;
  const Y0 = 120, DY = 170;
  const OFF = 70;                 // how far off-canvas roads run
  const LANE = 9;                 // lane offset from road centre
  const ROAD = 38;                // road width
  const HALF_INT = 24;            // half intersection, for stop lines
  const CAR_L = 21, CAR_W = 11;
  const VMAX = 92;                // px/s
  const ACC = 140, DEC = 320;
  const FOLLOW = 30;              // desired bumper gap

  const COLORS = ['#ff5c8f', '#38e1ff', '#9dff5c', '#ffc043', '#c08cff', '#ff8f4d', '#59f0d0', '#f0f4ff'];

  const nodeX = (c) => X0 + c * DX;
  const nodeY = (r) => Y0 + r * DY;

  function mount(root, api) {
    const bagg = Engine.bag();
    const cv = Engine.canvas(root, W, H);
    const ctx = cv.ctx;

    const pDelivered = api.pill('Through: 0');
    const pWave = api.pill('Wave 1');
    const pJam = api.pill('Jammed: 0');
    const meterWrap = h('div', { class: 'panel', style: { width: 'min(560px,100%)' } },
      h('h4', null, 'Commuter rage'),
      h('div', { class: 'meter' }, h('i', { style: { width: '0%' } })));
    root.appendChild(meterWrap);
    const meter = meterWrap.querySelector('i');

    let lights, cars, delivered, rage, wave, waveT, spawnT, over, elapsed, autoMode, prefill;

    function reset() {
      lights = [];
      for (let r = 0; r < ROWS; r++) {
        lights.push([]);
        for (let c = 0; c < COLS; c++) {
          lights[r].push({ phase: (r + c) % 2 ? 'NS' : 'EW', t: rand(0, 6), red: 0, pending: null, flash: 0 });
        }
      }
      cars = [];
      delivered = 0; rage = 0; wave = 1; waveT = 0; spawnT = 0.2; elapsed = 0;
      over = false; autoMode = true;

      /* run the sim forward a little so you arrive to a city already in motion */
      prefill = true;
      for (let i = 0; i < 420; i++) update(1 / 30);
      prefill = false;
      delivered = 0; rage = 0; wave = 1; waveT = 0; elapsed = 0;

      api.status('Click any intersection to flip its lights. Green light = that direction goes.');
      banner.style.display = 'none';
      sync();
    }

    /* ---------- route building ---------- */
    function buildPath() {
      const sides = ['W', 'E', 'N', 'S'];
      const inSide = pick(sides);
      let outSide = pick(sides.filter((s) => s !== inSide));

      let sr, sc, er, ec;
      if (inSide === 'W') { sr = randInt(0, ROWS - 1); sc = 0; }
      else if (inSide === 'E') { sr = randInt(0, ROWS - 1); sc = COLS - 1; }
      else if (inSide === 'N') { sr = 0; sc = randInt(0, COLS - 1); }
      else { sr = ROWS - 1; sc = randInt(0, COLS - 1); }

      if (outSide === 'W') { er = randInt(0, ROWS - 1); ec = 0; }
      else if (outSide === 'E') { er = randInt(0, ROWS - 1); ec = COLS - 1; }
      else if (outSide === 'N') { er = 0; ec = randInt(0, COLS - 1); }
      else { er = ROWS - 1; ec = randInt(0, COLS - 1); }

      const horizIn = inSide === 'W' || inSide === 'E';
      const horizOut = outSide === 'W' || outSide === 'E';
      const nodes = [];
      const push = (r, c) => {
        const last = nodes[nodes.length - 1];
        if (!last || last[0] !== r || last[1] !== c) nodes.push([r, c]);
      };
      const runH = (r, from, to) => { const st = to > from ? 1 : -1; for (let c = from; ; c += st) { push(r, c); if (c === to) break; } };
      const runV = (c, from, to) => { const st = to > from ? 1 : -1; for (let r = from; ; r += st) { push(r, c); if (r === to) break; } };

      if (horizIn && horizOut) {
        const mid = randInt(0, COLS - 1);
        runH(sr, sc, mid); runV(mid, sr, er); runH(er, mid, ec);
      } else if (horizIn && !horizOut) {
        runH(sr, sc, ec); runV(ec, sr, er);
      } else if (!horizIn && !horizOut) {
        const mid = randInt(0, ROWS - 1);
        runV(sc, sr, mid); runH(mid, sc, ec); runV(ec, mid, er);
      } else {
        runV(sc, sr, er); runH(er, sc, ec);
      }

      const pts = nodes.map(([r, c]) => ({ x: nodeX(c), y: nodeY(r), r, c }));
      const first = pts[0], last = pts[pts.length - 1];
      const entry = inSide === 'W' ? { x: -OFF, y: first.y } : inSide === 'E' ? { x: W + OFF, y: first.y }
        : inSide === 'N' ? { x: first.x, y: -OFF } : { x: first.x, y: H + OFF };
      const exit = outSide === 'W' ? { x: -OFF, y: last.y } : outSide === 'E' ? { x: W + OFF, y: last.y }
        : outSide === 'N' ? { x: last.x, y: -OFF } : { x: last.x, y: H + OFF };

      const raw = [entry].concat(pts, [exit]);

      /* drop zero-length segments (can happen when entry and first node coincide) */
      const clean = [raw[0]];
      for (let i = 1; i < raw.length; i++) {
        const p = raw[i], q = clean[clean.length - 1];
        if (Math.abs(p.x - q.x) < 0.5 && Math.abs(p.y - q.y) < 0.5) continue;
        clean.push(p);
      }
      if (clean.length < 2) return null;

      /* lane-offset the polyline so the whole route stays continuous */
      const dirs = [];
      for (let i = 0; i < clean.length - 1; i++) {
        const dx = clean[i + 1].x - clean[i].x, dy = clean[i + 1].y - clean[i].y;
        const len = Math.hypot(dx, dy);
        dirs.push({ x: dx / len, y: dy / len });
      }
      const nrm = (d) => ({ x: -d.y, y: d.x });   // right-hand side, screen coords
      const out = [];
      for (let i = 0; i < clean.length; i++) {
        const p = clean[i];
        let ox, oy;
        if (i === 0) { const n = nrm(dirs[0]); ox = n.x * LANE; oy = n.y * LANE; }
        else if (i === clean.length - 1) { const n = nrm(dirs[dirs.length - 1]); ox = n.x * LANE; oy = n.y * LANE; }
        else {
          const a = dirs[i - 1], b = dirs[i];
          const na = nrm(a), nb = nrm(b);
          const straight = Math.abs(a.x - b.x) < 1e-6 && Math.abs(a.y - b.y) < 1e-6;
          ox = na.x * LANE + (straight ? 0 : nb.x * LANE);
          oy = na.y * LANE + (straight ? 0 : nb.y * LANE);
        }
        out.push({ x: p.x + ox, y: p.y + oy, r: p.r, c: p.c, dirIn: i > 0 ? dirs[i - 1] : null });
      }

      const cum = [0];
      for (let i = 0; i < out.length - 1; i++) {
        cum.push(cum[i] + Math.hypot(out[i + 1].x - out[i].x, out[i + 1].y - out[i].y));
      }

      const stops = [];
      for (let i = 1; i < out.length - 1; i++) {
        if (out[i].r === undefined) continue;
        const d = out[i].dirIn;
        stops.push({ s: cum[i] - HALF_INT, r: out[i].r, c: out[i].c, axis: Math.abs(d.x) > 0.5 ? 'EW' : 'NS' });
      }
      return { pts: out, cum, total: cum[cum.length - 1], stops, dir0: dirs[0] };
    }

    function spawn() {
      if (cars.length > 78) return;
      const p = buildPath();
      if (!p) return;
      const head = p.pts[0];
      for (const c of cars) {
        if (Math.hypot(c.x - head.x, c.y - head.y) < 46) return;   // don't stack on the on-ramp
      }
      cars.push({
        path: p, s: 0, seg: 0, v: VMAX * 0.6, wait: 0, stopIdx: 0,
        x: head.x, y: head.y, dx: p.dir0.x, dy: p.dir0.y,
        color: pick(COLORS), age: 0
      });
    }

    function place(car) {
      const { cum, pts } = car.path;
      let i = car.seg;
      while (i < pts.length - 2 && car.s > cum[i + 1]) i++;
      while (i > 0 && car.s < cum[i]) i--;
      car.seg = i;
      const segLen = cum[i + 1] - cum[i] || 1;
      const t = clamp((car.s - cum[i]) / segLen, 0, 1);
      const a = pts[i], b = pts[i + 1];
      car.x = a.x + (b.x - a.x) * t;
      car.y = a.y + (b.y - a.y) * t;
      car.dx = (b.x - a.x) / segLen;
      car.dy = (b.y - a.y) / segLen;
    }

    const speedFor = (gap) => clamp(gap * 2.1 - 8, 0, VMAX);

    function isGreen(r, c, axis) {
      const L = lights[r][c];
      return L.red <= 0 && L.phase === axis;
    }

    /* ---------- update ---------- */
    function update(dt) {
      if (over) return;
      elapsed += dt;
      waveT += dt;
      if (waveT > 34) { waveT = 0; wave++; api.sfx.blip(880); }

      /* lights */
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const L = lights[r][c];
          L.flash = Math.max(0, L.flash - dt);
          if (L.red > 0) {
            L.red -= dt;
            if (L.red <= 0 && L.pending) { L.phase = L.pending; L.pending = null; L.t = 0; }
          } else {
            L.t += dt;
            if (autoMode && L.t > 11) switchLight(r, c);
          }
        }
      }

      /* spawn */
      spawnT -= dt;
      if (spawnT <= 0) {
        spawn();
        spawnT = Math.max(0.38, 1.35 - wave * 0.09) * rand(0.7, 1.4);
      }

      for (const car of cars) place(car);

      /* decide speeds */
      let jammed = 0;
      for (const a of cars) {
        let allowed = VMAX;

        /* car ahead (this also stops cars from driving into a blocked box) */
        for (const b of cars) {
          if (b === a) continue;
          const vx = b.x - a.x, vy = b.y - a.y;
          const fwd = vx * a.dx + vy * a.dy;
          if (fwd <= 0 || fwd > 110) continue;
          const lat = Math.abs(vx * -a.dy + vy * a.dx);
          if (lat > 12) continue;
          allowed = Math.min(allowed, speedFor(fwd - FOLLOW));
        }

        /* red light ahead */
        while (a.stopIdx < a.path.stops.length && a.s > a.path.stops[a.stopIdx].s + 6) a.stopIdx++;
        const st = a.path.stops[a.stopIdx];
        if (st) {
          const d = st.s - a.s;
          if (d >= 0 && d < 130 && !isGreen(st.r, st.c, st.axis)) allowed = Math.min(allowed, speedFor(d));
        }

        a.v += clamp(allowed - a.v, -DEC * dt, ACC * dt);
        a.v = clamp(a.v, 0, VMAX);
        a.s += a.v * dt;
        a.age += dt;
        if (a.v < 8) { a.wait += dt; if (a.wait > 3) jammed++; }
        else a.wait = Math.max(0, a.wait - dt * 2.5);
      }

      for (let i = cars.length - 1; i >= 0; i--) {
        if (cars[i].s >= cars[i].path.total) { cars.splice(i, 1); delivered++; }
      }

      rage = clamp(rage + dt * (jammed * 0.85 - 2.6), 0, 100);
      if (rage >= 100 && !prefill) endGame();

      pJam.textContent = 'Jammed: ' + jammed;
      pDelivered.textContent = 'Through: ' + delivered;
      pWave.textContent = 'Wave ' + wave;
      meter.style.width = rage.toFixed(0) + '%';
      meterWrap.classList.toggle('warn', rage > 60);
    }

    function switchLight(r, c) {
      const L = lights[r][c];
      const want = L.phase === 'NS' ? 'EW' : 'NS';
      if (L.pending === want) return;
      L.pending = want;
      L.red = 0.85;
      L.flash = 0.35;
    }

    function endGame() {
      over = true;
      const res = api.submit(delivered);
      api.sfx.bad();
      banner.style.display = '';
      banner.replaceChildren(
        h('h3', null, 'Total gridlock.'),
        h('p', null, delivered + ' commuters made it through in ' + Engine.fmtTime(elapsed) + '.' +
          (res.isRecord ? ' New personal best!' : res.isFirst ? '' : ' Best: ' + res.best + '.')),
        h('button', { class: 'btn primary', type: 'button', onclick: reset }, 'Try again'));
    }

    /* ---------- render ---------- */
    function draw() {
      ctx.fillStyle = '#0c1220';
      ctx.fillRect(0, 0, W, H);

      /* blocks between the roads */
      ctx.fillStyle = '#0f1729';
      for (let r = -1; r < ROWS; r++) {
        for (let c = -1; c < COLS; c++) {
          const x = c < 0 ? -OFF : nodeX(c) + ROAD / 2;
          const y = r < 0 ? -OFF : nodeY(r) + ROAD / 2;
          const x2 = c + 1 >= COLS ? W + OFF : nodeX(c + 1) - ROAD / 2;
          const y2 = r + 1 >= ROWS ? H + OFF : nodeY(r + 1) - ROAD / 2;
          Engine.roundRect(ctx, x + 6, y + 6, x2 - x - 12, y2 - y - 12, 8);
          ctx.fill();
        }
      }

      /* asphalt */
      ctx.fillStyle = '#28324a';
      for (let r = 0; r < ROWS; r++) ctx.fillRect(-OFF, nodeY(r) - ROAD / 2, W + OFF * 2, ROAD);
      for (let c = 0; c < COLS; c++) ctx.fillRect(nodeX(c) - ROAD / 2, -OFF, ROAD, H + OFF * 2);

      /* lane dashes */
      ctx.strokeStyle = '#59648a';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([11, 13]);
      ctx.beginPath();
      for (let r = 0; r < ROWS; r++) { ctx.moveTo(-OFF, nodeY(r)); ctx.lineTo(W + OFF, nodeY(r)); }
      for (let c = 0; c < COLS; c++) { ctx.moveTo(nodeX(c), -OFF); ctx.lineTo(nodeX(c), H + OFF); }
      ctx.stroke();
      ctx.setLineDash([]);

      /* intersections + signals */
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const x = nodeX(c), y = nodeY(r), L = lights[r][c];
          ctx.fillStyle = '#323d59';
          ctx.fillRect(x - ROAD / 2, y - ROAD / 2, ROAD, ROAD);
          if (L.flash > 0) {
            ctx.strokeStyle = 'rgba(56,225,255,' + (L.flash / 0.35 * 0.9).toFixed(2) + ')';
            ctx.lineWidth = 2;
            ctx.strokeRect(x - ROAD / 2 - 3, y - ROAD / 2 - 3, ROAD + 6, ROAD + 6);
          }
          const ns = L.red > 0 ? '#ffb020' : (L.phase === 'NS' ? '#4ade5e' : '#ff4d5e');
          const ew = L.red > 0 ? '#ffb020' : (L.phase === 'EW' ? '#4ade5e' : '#ff4d5e');
          const d = ROAD / 2 + 5;
          const dot = (px, py, col) => {
            ctx.fillStyle = col;
            ctx.beginPath();
            ctx.arc(px, py, 3.4, 0, 7);
            ctx.fill();
          };
          dot(x - 4, y - d, ns); dot(x + 4, y + d, ns);
          dot(x - d, y + 4, ew); dot(x + d, y - 4, ew);
        }
      }

      /* cars */
      for (const car of cars) {
        ctx.save();
        ctx.translate(car.x, car.y);
        ctx.rotate(Math.atan2(car.dy, car.dx));
        ctx.fillStyle = 'rgba(0,0,0,.35)';
        Engine.roundRect(ctx, -CAR_L / 2 + 1.5, -CAR_W / 2 + 2, CAR_L, CAR_W, 3);
        ctx.fill();
        ctx.fillStyle = car.color;
        Engine.roundRect(ctx, -CAR_L / 2, -CAR_W / 2, CAR_L, CAR_W, 3);
        ctx.fill();
        ctx.fillStyle = 'rgba(10,14,24,.55)';
        Engine.roundRect(ctx, -1, -CAR_W / 2 + 1.5, 7, CAR_W - 3, 2);
        ctx.fill();
        if (car.v < 6) {
          ctx.fillStyle = '#ff3b3b';
          ctx.fillRect(-CAR_L / 2 - 1, -CAR_W / 2 + 1, 2, CAR_W - 2);
        }
        ctx.restore();
        if (car.wait > 4) {
          const a = clamp((car.wait - 4) / 5, 0, 1);
          ctx.fillStyle = 'rgba(255,80,80,' + (0.35 + a * 0.55).toFixed(2) + ')';
          ctx.font = 'bold 13px system-ui';
          ctx.textAlign = 'center';
          ctx.fillText('!', car.x, car.y - 11);
        }
      }

      if (Engine.paused && !over) {
        ctx.fillStyle = 'rgba(8,11,20,.62)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#e8ecf7';
        ctx.font = 'bold 24px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('paused', W / 2, H / 2);
      }
    }

    /* the pause overlay needs to render while the sim is frozen */
    let rafId = 0;
    (function paintLoop() {
      rafId = requestAnimationFrame(paintLoop);
      if (Engine.paused) draw();
    })();
    bagg.add(() => cancelAnimationFrame(rafId));

    const banner = h('div', { class: 'banner', style: { display: 'none' } });
    root.appendChild(banner);

    bagg.listen(cv.el, 'pointerdown', (e) => {
      if (over) return;
      const p = cv.pos(e);
      let bestD = 1e9, br = -1, bc = -1;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const d = Math.hypot(p.x - nodeX(c), p.y - nodeY(r));
          if (d < bestD) { bestD = d; br = r; bc = c; }
        }
      }
      if (bestD < 62) { switchLight(br, bc); api.sfx.click(); }
    });

    api.button('Restart', reset);
    const autoBtn = api.button('Auto-cycle: on', () => {
      autoMode = !autoMode;
      autoBtn.textContent = 'Auto-cycle: ' + (autoMode ? 'on' : 'off');
      autoBtn.classList.toggle('on', autoMode);
    }, 'on');
    api.button('All lights E–W', () => {
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (lights[r][c].phase !== 'EW') switchLight(r, c);
    });
    api.button('All lights N–S', () => {
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (lights[r][c].phase !== 'NS') switchLight(r, c);
    });

    function sync() { meter.style.width = '0%'; }

    reset();
    bagg.add(Engine.loop((dt) => { update(dt); draw(); }));
    return () => bagg.dispose();
  }

  Arcade.register({
    id: 'gridlock',
    title: 'Gridlock',
    emoji: '🚦',
    cat: 'sim',
    order: 1,
    blurb: 'Twelve intersections, one rush hour. Flip the lights and keep the city moving before commuter rage boils over.',
    scoreLabel: 'Cars through',
    tags: ['traffic', 'jam', 'city', 'lights'],
    how: [
      'Click any intersection to flip which direction gets the green.',
      'Every switch runs a short all-red clearance first, so plan a beat ahead.',
      'Auto-cycle flips lights on a timer — turn it off to take full manual control.',
      'Cars stuck in traffic build commuter rage. Fill the bar and the city revolts.',
      'Waves get busier every 34 seconds. Score = cars delivered off the map.'
    ],
    mount
  });
})();
