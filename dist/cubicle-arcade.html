<script>
/* Seating Chart — Schelling's segregation model (1971).
 *
 * A floor of two teams plus some empty desks. Each person is content only if at
 * least a fraction T of their occupied neighbours share their team; the content
 * stay put, the discontented get up and take a random empty desk. One rule, run
 * to equilibrium. The lesson nobody wants: even a mild preference — around a
 * third — curdles a well-mixed floor into hard single-team blocks. Push the
 * preference too high (past ~0.75) and it JAMS: nobody can ever settle, and the
 * floor stays churned. The instrument is the segregation-index-vs-tolerance
 * curve, measured live from the model, with its peak marked.
 */
(function () {
  'use strict';
  const { h, clamp, shuffle } = Engine;
  const W = 560, H = 560, L = 62;
  const CELL = W / L;
  const EMPTY = 0, A = 1, B = 2;

  function mount(root, api) {
    const bagg = Engine.bag();
    const grid = new Int8Array(L * L);
    let T = 0.35, emptyFrac = 0.08, running = false, rounds = 0;
    const samples = [];      // {T, seg} settled points the player produced
    let ref = [];            // measured reference curve

    const cv = Engine.canvas(root, W, H, { maxHeight: '62vh' });
    const ctx = cv.ctx;
    const plot = h('canvas', { class: 'fire-plot', width: 520, height: 200 });
    root.appendChild(h('div', { class: 'fire-panel' }, plot));
    const pctx = plot.getContext('2d');

    const pTol = api.pill('Preference: 0.35');
    const pSeg = api.pill('Segregation: 0%');
    const pUnhappy = api.pill('Unsettled: 0%');

    const slider = h('input', { type: 'range', min: '0', max: '0.85', step: '0.01', value: '0.35', class: 'slider' });
    slider.addEventListener('input', () => { T = parseFloat(slider.value); pTol.textContent = 'Preference: ' + T.toFixed(2); });
    api.toolbar.appendChild(h('label', { class: 'sel-wrap' }, h('span', null, 'preference'), slider));
    const runBtn = api.button('Run', () => { running = !running; runBtn.textContent = running ? 'Pause' : 'Run'; });
    api.button('Reshuffle', () => fill());

    function fill() {
      for (let i = 0; i < grid.length; i++) grid[i] = Math.random() < emptyFrac ? EMPTY : (Math.random() < 0.5 ? A : B);
      rounds = 0;
      running = false; runBtn.textContent = 'Run';
      api.status('Set how strongly people prefer same-team neighbours, then Run. A mild preference is enough to segregate a mixed floor completely.');
      syncPills();
    }

    /* fraction of a cell's occupied neighbours that share its team */
    function sameFrac(i) {
      const x = i % L, y = (i / L) | 0, me = grid[i];
      let same = 0, occ = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= L || ny >= L) continue;
        const v = grid[ny * L + nx];
        if (v === EMPTY) continue;
        occ++;
        if (v === me) same++;
      }
      return occ === 0 ? 1 : same / occ;   // isolated agents are content
    }

    /* one relocation round; returns how many people moved */
    function step() {
      const unhappy = [], empties = [];
      for (let i = 0; i < grid.length; i++) {
        if (grid[i] === EMPTY) empties.push(i);
        else if (sameFrac(i) < T) unhappy.push(i);
      }
      shuffle(empties);
      let ei = 0, moved = 0;
      for (const i of shuffle(unhappy)) {
        if (ei >= empties.length) break;
        const dest = empties[ei++];
        grid[dest] = grid[i];
        grid[i] = EMPTY;
        empties.push(i);           // the vacated cell becomes available later
        moved++;
      }
      rounds++;
      return moved;
    }

    function stats() {
      let seg = 0, occ = 0, unhappy = 0;
      for (let i = 0; i < grid.length; i++) {
        if (grid[i] === EMPTY) continue;
        occ++;
        const f = sameFrac(i);
        seg += f;
        if (f < T) unhappy++;
      }
      return { seg: occ ? seg / occ : 0, unhappy: occ ? unhappy / occ : 0, occ: occ };
    }

    function syncPills() {
      const s = stats();
      pTol.textContent = 'Preference: ' + T.toFixed(2);
      pSeg.textContent = 'Segregation: ' + Math.round(s.seg * 100) + '%';
      pUnhappy.textContent = 'Unsettled: ' + Math.round(s.unhappy * 100) + '%';
      pUnhappy.className = 'pill ' + (s.unhappy > 0.15 ? 'warn' : '');
    }

    /* measured reference curve on a small grid: settle at each T, record seg */
    function measureReference() {
      const S = 34, g = new Int8Array(S * S), out = [];
      const sf = (i) => {
        const x = i % S, y = (i / S) | 0, me = g[i]; let same = 0, occ = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue; const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= S || ny >= S) continue;
          const v = g[ny * S + nx]; if (v === EMPTY) continue; occ++; if (v === me) same++;
        }
        return occ === 0 ? 1 : same / occ;
      };
      for (let ti = 0; ti <= 20; ti++) {
        const tt = 0.85 * ti / 20;
        for (let i = 0; i < g.length; i++) g[i] = Math.random() < 0.08 ? 0 : (Math.random() < 0.5 ? A : B);
        for (let round = 0; round < 60; round++) {
          const un = [], em = [];
          for (let i = 0; i < g.length; i++) { if (g[i] === 0) em.push(i); else if (sf(i) < tt) un.push(i); }
          if (!un.length) break;
          let ei = 0;
          for (let q = em.length - 1; q > 0; q--) { const r = (Math.random() * (q + 1)) | 0; const t = em[q]; em[q] = em[r]; em[r] = t; }
          for (const i of un) { if (ei >= em.length) break; const d = em[ei++]; g[d] = g[i]; g[i] = 0; em.push(i); }
        }
        let seg = 0, occ = 0;
        for (let i = 0; i < g.length; i++) { if (g[i] === 0) continue; occ++; seg += sf(i); }
        out.push({ T: tt, seg: occ ? seg / occ : 0 });
      }
      return out;
    }

    function drawPlot() {
      const w = plot.width, hh = plot.height, m = 26;
      pctx.fillStyle = '#12100c'; pctx.fillRect(0, 0, w, hh);
      const X = (t) => m + t / 0.85 * (w - m - 8);
      const Y = (s) => hh - m - s * (hh - m - 8);
      pctx.strokeStyle = '#4a4436'; pctx.lineWidth = 1;
      pctx.beginPath(); pctx.moveTo(m, Y(0)); pctx.lineTo(w - 8, Y(0)); pctx.moveTo(m, Y(0)); pctx.lineTo(m, Y(1)); pctx.stroke();
      pctx.fillStyle = '#8a8064'; pctx.font = '10px Verdana, sans-serif';
      pctx.fillText('segregation', 2, 12); pctx.fillText('preference T', w - 78, hh - 8);
      /* mixed baseline ~0.5 */
      pctx.strokeStyle = 'rgba(0,166,180,.6)'; pctx.setLineDash([3, 3]);
      pctx.beginPath(); pctx.moveTo(m, Y(0.5)); pctx.lineTo(w - 8, Y(0.5)); pctx.stroke(); pctx.setLineDash([]);
      pctx.fillStyle = '#00a6b4'; pctx.fillText('well-mixed 50%', m + 4, Y(0.5) - 3);
      if (ref.length) {
        pctx.strokeStyle = '#ffcb1f'; pctx.lineWidth = 2; pctx.beginPath();
        ref.forEach((s, i) => { const x = X(s.T), y = Y(s.seg); i ? pctx.lineTo(x, y) : pctx.moveTo(x, y); });
        pctx.stroke();
      }
      for (const s of samples) { pctx.fillStyle = '#e8402a'; pctx.beginPath(); pctx.arc(X(s.T), Y(s.seg), 3, 0, 7); pctx.fill(); }
      pctx.fillStyle = '#fffdf3'; pctx.beginPath(); pctx.moveTo(X(T), Y(0) + 2); pctx.lineTo(X(T) - 4, Y(0) + 9); pctx.lineTo(X(T) + 4, Y(0) + 9); pctx.fill();
    }

    function draw() {
      ctx.fillStyle = '#141019'; ctx.fillRect(0, 0, W, H);
      for (let i = 0; i < grid.length; i++) {
        const v = grid[i];
        if (v === EMPTY) continue;
        ctx.fillStyle = v === A ? '#00a6b4' : '#e8402a';
        ctx.fillRect((i % L) * CELL, ((i / L) | 0) * CELL, CELL + 1, CELL + 1);
      }
      drawPlot();
    }

    window.__schelling = {
      reset(opts) { if (opts && opts.T != null) T = opts.T; if (opts && opts.empty != null) emptyFrac = opts.empty; fill(); },
      step() { return { moved: step() }; },
      settle(maxRounds) { let r = 0; while (r++ < (maxRounds || 200)) { if (step() === 0) break; } return stats(); },
      stats() { return stats(); },
      setRunning(v) { running = !!v; }
    };
    bagg.add(() => { if (window.__schelling) delete window.__schelling; });

    ref = measureReference();
    fill();
    bagg.add(Engine.loop(() => {
      if (running) {
        const moved = step();
        if (moved === 0) {
          running = false; runBtn.textContent = 'Run';
          const s = stats();
          samples.push({ T: T, seg: s.seg });
          api.submit(Math.round(s.seg * 100));
          api.status('Settled after ' + rounds + ' rounds at ' + Math.round(s.seg * 100) + '% same-team neighbours. Slide the preference and Run again to trace the curve.');
        }
      }
      syncPills();
      draw();
    }));

    return () => bagg.dispose();
  }

  Arcade.register({
    id: 'schelling',
    title: 'Seating Chart',
    emoji: 'schelling',
    cat: 'sim',
    order: 7,
    blurb: 'Two teams, some empty desks, and one mild rule about who you want to sit near. Nobody in here is a villain, and the floor still sorts itself into hard blocks. A famous, uncomfortable little model.',
    scoreLabel: 'Peak segregation',
    tags: ['schelling', 'segregation', 'phase-transition', 'emergence'],
    how: [
      'Teal and red are two teams; the dark squares are empty desks. Each person is content if at least a fraction T of their occupied neighbours share their team.',
      'Set that preference T with the slider, then Run. Discontented people get up and take a random empty desk; content people stay.',
      'The instrument plots the settled segregation against the preference, measured live from the model, against the 50% you would get from pure chance.',
      'The uncomfortable part: even a preference around a third drives segregation far past 50%. Nobody wanted a segregated floor and you get one anyway.',
      'Crank it past about 0.75 and it never settles — too fussy to ever be happy — so the floor stays churned and segregation actually falls.'
    ],
    mount
  });
})();

<script>
/* Sick Day — a spatial SIR epidemic (Kermack-McKendrick, on a lattice).
 *
 * Every desk is Susceptible, Infected, or Recovered. Each step an infected desk
 * infects each susceptible neighbour with probability beta and itself recovers
 * with probability gamma. One uniform rule. The basic reproduction number is
 * roughly R0 = (contacts * beta) / gamma: below the epidemic threshold the
 * cough fizzles in a corner; above it, it sweeps the floor into empty chairs.
 * The instrument is the textbook curve — the susceptible line falling, the
 * infected hump, the recovered line rising to the final attack rate. Desk
 * spacing (the empty fraction) and beta are your levers; the goal is to keep
 * the final size under a cap by pushing R0 back under 1.
 */
(function () {
  'use strict';
  const { h, clamp } = Engine;
  const W = 540, H = 540, L = 90;
  const CELL = W / L;
  const EMPTY = 0, S = 1, I = 2, R = 3;

  function mount(root, api) {
    const bagg = Engine.bag();
    let grid = new Uint8Array(L * L);
    let next = new Uint8Array(L * L);
    let beta = 0.10, gamma = 0.12, occ = 0.92;
    let running = false, tstep = 0, peakI = 0, occCount = 0;
    const series = [];   // {s,i,r} fractions per step

    const cv = Engine.canvas(root, W, H, { maxHeight: '60vh' });
    const ctx = cv.ctx;
    const plot = h('canvas', { class: 'fire-plot', width: 520, height: 200 });
    root.appendChild(h('div', { class: 'fire-panel' }, plot));
    const pctx = plot.getContext('2d');

    const pR0 = api.pill('R0 ~ 1.0');
    const pInf = api.pill('Infected: 0%');
    const pAttack = api.pill('Attack rate: 0%');

    const betaS = h('input', { type: 'range', min: '0.02', max: '0.5', step: '0.01', value: '0.10', class: 'slider' });
    const gammaS = h('input', { type: 'range', min: '0.04', max: '0.4', step: '0.01', value: '0.12', class: 'slider' });
    const occS = h('input', { type: 'range', min: '0.4', max: '1', step: '0.02', value: '0.92', class: 'slider' });
    betaS.addEventListener('input', () => { beta = parseFloat(betaS.value); syncPills(); });
    gammaS.addEventListener('input', () => { gamma = parseFloat(gammaS.value); syncPills(); });
    occS.addEventListener('input', () => { occ = parseFloat(occS.value); reset(); });
    api.toolbar.appendChild(h('label', { class: 'sel-wrap' }, h('span', null, 'spread beta'), betaS));
    api.toolbar.appendChild(h('label', { class: 'sel-wrap' }, h('span', null, 'recover gamma'), gammaS));
    api.toolbar.appendChild(h('label', { class: 'sel-wrap' }, h('span', null, 'occupancy'), occS));
    const runBtn = api.button('Run', () => { running = !running; runBtn.textContent = running ? 'Pause' : 'Run'; });
    api.button('Reset', reset);

    /* R0 = effective-contacts * beta / gamma. The effective contact number
       (3.3, not the raw 8 neighbours) is CALIBRATED so this crosses 1 at the
       lattice's measured epidemic threshold — see tools/sweep-sir.mjs. Without
       that calibration the readout would claim an epidemic where the model
       actually fizzles. */
    function r0() { return (occ * 3.3 * beta) / gamma; }

    function reset() {
      occCount = 0;
      for (let i = 0; i < grid.length; i++) { const o = Math.random() < occ; grid[i] = o ? S : EMPTY; if (o) occCount++; }
      /* seed a small cluster of infected near the centre */
      const c = ((L / 2) | 0) * L + ((L / 2) | 0);
      for (const j of [c, c + 1, c - 1, c + L, c - L]) if (grid[j] === S) grid[j] = I;
      running = false; runBtn.textContent = 'Run'; tstep = 0; peakI = 0;
      series.length = 0;
      api.status('Set the spread rate, recovery rate and how packed the desks are, then Run. The epidemic takes off or fizzles depending on whether R0 clears 1.');
      recordAndSync();
    }

    function counts() {
      let s = 0, i = 0, r = 0;
      for (let k = 0; k < grid.length; k++) { const v = grid[k]; if (v === S) s++; else if (v === I) i++; else if (v === R) r++; }
      return { s: s, i: i, r: r };
    }

    /* one synchronous SIR update over the whole lattice */
    function step() {
      next.set(grid);
      for (let y = 0; y < L; y++) {
        for (let x = 0; x < L; x++) {
          const idx = y * L + x, v = grid[idx];
          if (v === S) {
            let inf = 0;
            for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
              if (!dx && !dy) continue;
              const nx = x + dx, ny = y + dy;
              if (nx < 0 || ny < 0 || nx >= L || ny >= L) continue;
              if (grid[ny * L + nx] === I) inf++;
            }
            if (inf && Math.random() < 1 - Math.pow(1 - beta, inf)) next[idx] = I;
          } else if (v === I) {
            if (Math.random() < gamma) next[idx] = R;
          }
        }
      }
      const t = grid; grid = next; next = t;
      tstep++;
    }

    function recordAndSync() {
      const c = counts();
      const tot = occCount || 1;
      series.push({ s: c.s / tot, i: c.i / tot, r: c.r / tot });
      if (c.i / tot > peakI) peakI = c.i / tot;
      pR0.textContent = 'R0 ~ ' + r0().toFixed(2);
      pR0.className = 'pill ' + (r0() > 1 ? 'warn' : 'good');
      pInf.textContent = 'Infected: ' + Math.round(c.i / tot * 100) + '%';
      pAttack.textContent = 'Attack rate: ' + Math.round(c.r / tot * 100) + '%';
      return c;
    }
    function syncPills() { pR0.textContent = 'R0 ~ ' + r0().toFixed(2); pR0.className = 'pill ' + (r0() > 1 ? 'warn' : 'good'); }

    function drawPlot() {
      const w = plot.width, hh = plot.height, m = 24;
      pctx.fillStyle = '#12100c'; pctx.fillRect(0, 0, w, hh);
      pctx.strokeStyle = '#4a4436'; pctx.lineWidth = 1;
      pctx.beginPath(); pctx.moveTo(m, hh - m); pctx.lineTo(w - 6, hh - m); pctx.moveTo(m, hh - m); pctx.lineTo(m, 8); pctx.stroke();
      pctx.fillStyle = '#8a8064'; pctx.font = '10px Verdana, sans-serif';
      pctx.fillText('fraction', 2, 12); pctx.fillText('time', w - 30, hh - 8);
      const n = series.length; if (n < 2) return;
      const X = (k) => m + k / (n - 1) * (w - m - 6);
      const Y = (f) => (hh - m) - f * (hh - m - 8);
      const lineOf = (key, col) => {
        pctx.strokeStyle = col; pctx.lineWidth = 2; pctx.beginPath();
        for (let k = 0; k < n; k++) { const x = X(k), y = Y(series[k][key]); k ? pctx.lineTo(x, y) : pctx.moveTo(x, y); }
        pctx.stroke();
      };
      lineOf('s', '#00a6b4');   // susceptible
      lineOf('r', '#a79e88');   // recovered
      lineOf('i', '#e8402a');   // infected hump
      pctx.fillStyle = '#e8402a'; pctx.fillText('infected', w - 120, 14);
      pctx.fillStyle = '#00a6b4'; pctx.fillText('S', w - 46, 14);
      pctx.fillStyle = '#a79e88'; pctx.fillText('R', w - 30, 14);
    }

    function draw() {
      ctx.fillStyle = '#141019'; ctx.fillRect(0, 0, W, H);
      for (let k = 0; k < grid.length; k++) {
        const v = grid[k];
        if (v === EMPTY) continue;
        ctx.fillStyle = v === S ? '#d9c9a0' : v === I ? '#e8402a' : '#6b6350';
        ctx.fillRect((k % L) * CELL, ((k / L) | 0) * CELL, CELL + 1, CELL + 1);
      }
      drawPlot();
    }

    window.__sir = {
      reset(opts) {
        if (opts) { if (opts.beta != null) { beta = opts.beta; betaS.value = String(beta); } if (opts.gamma != null) { gamma = opts.gamma; gammaS.value = String(gamma); } if (opts.occ != null) { occ = opts.occ; occS.value = String(occ); } }
        reset();
      },
      step() { step(); const c = counts(); return { s: c.s, i: c.i, r: c.r }; },
      runToEnd() {
        let guard = 0, pk = 0;
        while (guard++ < 5000) { const c = counts(); if (c.i > pk) pk = c.i; if (c.i === 0) break; step(); }
        const c = counts(); const tot = occCount || 1;
        return { finalSize: c.r / tot, peakI: pk / tot, duration: tstep };
      },
      stats() { const c = counts(); const tot = occCount || 1; return { S: c.s / tot, I: c.i / tot, R: c.r / tot, R0: r0() }; },
      setRunning(v) { running = !!v; }
    };
    bagg.add(() => { if (window.__sir) delete window.__sir; });

    reset();
    bagg.add(Engine.loop(() => {
      if (running) {
        const c = counts();
        if (c.i === 0) { running = false; runBtn.textContent = 'Run'; api.submit(Math.round((c.r / (occCount || 1)) * 100)); api.status('Burned out after ' + tstep + ' steps. Final attack rate ' + Math.round(c.r / (occCount || 1) * 100) + '%. Lower beta or thin the desks to push R0 under 1.'); }
        else { step(); recordAndSync(); }
      }
      draw();
    }));

    return () => bagg.dispose();
  }

  Arcade.register({
    id: 'sir',
    title: 'Sick Day',
    emoji: 'sir',
    cat: 'sim',
    order: 8,
    blurb: 'Someone coughs at the coffee machine. Whether it fizzles at three desks or empties the floor comes down to one number crossing one line — the real epidemic threshold, not a scare.',
    scoreLabel: 'Worst attack rate',
    tags: ['sir', 'epidemic', 'threshold', 'emergence'],
    how: [
      'Every desk is susceptible (paper), infected (red), or recovered (grey). Each step an infected desk infects susceptible neighbours with probability beta and recovers with probability gamma.',

<script>
/* In-Box — the Bak-Tang-Wiesenfeld sandpile (1987), self-organized criticality.
 *
 * Memos pile on desks. A desk holding four topples, shedding one memo to each
 * orthogonal neighbour — which can push them over too, in a reply-all cascade.
 * Grains that fall off the edge are lost. There is no dial to tune: drop memos
 * at random and the pile drives ITSELF to the critical point, where avalanche
 * sizes have no typical scale — sometimes one desk, sometimes the whole floor,
 * and everything between, following a power law. The instrument is the avalanche
 * size distribution on log-log axes; criticality shows up as a straight line.
 * The anti-lesson: you cannot calm it. There is no stable regime to reach.
 */
(function () {
  'use strict';
  const { h } = Engine;
  const W = 540, H = 540, L = 90;
  const CELL = W / L;

  function mount(root, api) {
    const bagg = Engine.bag();
    const height = new Uint8Array(L * L);
    const flash = new Float32Array(L * L);
    let running = true, grains = 0, avalanches = 0, biggest = 0;
    const hist = {};   // avalanche size -> count

    const cv = Engine.canvas(root, W, H, { maxHeight: '60vh' });
    const ctx = cv.ctx;
    const plot = h('canvas', { class: 'fire-plot', width: 520, height: 200 });
    root.appendChild(h('div', { class: 'fire-panel' }, plot));
    const pctx = plot.getContext('2d');

    const pGrains = api.pill('Memos dropped: 0');
    const pAval = api.pill('Avalanches: 0');
    const pBig = api.pill('Biggest: 0');

    const runBtn = api.button('Pause', () => { running = !running; runBtn.textContent = running ? 'Pause' : 'Run'; });
    api.button('Reset', reset);

    function reset() {
      height.fill(0); flash.fill(0);
      grains = 0; avalanches = 0; biggest = 0;
      for (const k in hist) delete hist[k];
      api.status('Memos drop on random desks. A desk with four topples onto its neighbours, which can set off a chain. Click to drop one yourself.');
      syncPills();
    }

    /* drop one grain at idx and let the whole avalanche resolve; return its size */
    function drop(idx) {
      height[idx]++;
      grains++;
      let size = 0;
      const stack = [];
      if (height[idx] >= 4) stack.push(idx);
      while (stack.length) {
        const i = stack.pop();
        if (height[i] < 4) continue;
        const times = (height[i] / 4) | 0;
        height[i] -= times * 4;
        size += times;
        flash[i] = 1;
        const x = i % L, y = (i / L) | 0;
        if (x > 0) { height[i - 1] += times; if (height[i - 1] >= 4) stack.push(i - 1); }
        if (x < L - 1) { height[i + 1] += times; if (height[i + 1] >= 4) stack.push(i + 1); }
        if (y > 0) { height[i - L] += times; if (height[i - L] >= 4) stack.push(i - L); }
        if (y < L - 1) { height[i + L] += times; if (height[i + L] >= 4) stack.push(i + L); }
        /* grains off the edge are lost — the dissipation that makes SOC work */
      }
      if (size > 0) { avalanches++; hist[size] = (hist[size] || 0) + 1; if (size > biggest) biggest = size; }
      return size;
    }

    function syncPills() {
      pGrains.textContent = 'Memos dropped: ' + grains;
      pAval.textContent = 'Avalanches: ' + avalanches;
      pBig.textContent = 'Biggest: ' + biggest;
    }

    function drawPlot() {
      const w = plot.width, hh = plot.height, m = 28;
      pctx.fillStyle = '#12100c'; pctx.fillRect(0, 0, w, hh);
      pctx.strokeStyle = '#4a4436'; pctx.lineWidth = 1;
      pctx.beginPath(); pctx.moveTo(m, hh - m); pctx.lineTo(w - 6, hh - m); pctx.moveTo(m, hh - m); pctx.lineTo(m, 8); pctx.stroke();
      pctx.fillStyle = '#8a8064'; pctx.font = '10px Verdana, sans-serif';
      pctx.fillText('log count', 2, 12); pctx.fillText('log avalanche size', w - 118, hh - 8);
      /* logarithmic bins */
      const sizes = Object.keys(hist);
      if (sizes.length < 2) return;
      const maxLog = Math.log10(biggest) || 1;
      const NB = 22;
      const bins = new Array(NB).fill(0);
      for (const s of sizes) { const b = Math.min(NB - 1, Math.floor(Math.log10(+s) / maxLog * (NB - 1))); bins[b] += hist[s]; }
      let maxC = 1; for (const c of bins) if (c > maxC) maxC = c;
      const X = (b) => m + b / (NB - 1) * (w - m - 6);
      const Y = (c) => (hh - m) - (Math.log10(c) / (Math.log10(maxC) || 1)) * (hh - m - 8);
      pctx.strokeStyle = '#ffcb1f'; pctx.lineWidth = 2; pctx.beginPath();
      let started = false;
      for (let b = 0; b < NB; b++) { if (bins[b] <= 0) continue; const x = X(b), y = Y(bins[b]); started ? pctx.lineTo(x, y) : pctx.moveTo(x, y); started = true; }
      pctx.stroke();
      pctx.fillStyle = '#e8402a';
      for (let b = 0; b < NB; b++) { if (bins[b] <= 0) continue; pctx.beginPath(); pctx.arc(X(b), Y(bins[b]), 2.5, 0, 7); pctx.fill(); }
      pctx.fillStyle = '#8a8064'; pctx.fillText('a straight line here = criticality', m + 6, 22);
    }

    function draw() {
      ctx.fillStyle = '#141019'; ctx.fillRect(0, 0, W, H);
      const shades = ['#1b2430', '#2d5f6b', '#c7a637', '#e8402a'];
      for (let i = 0; i < height.length; i++) {
        const hgt = height[i];
        if (hgt === 0 && flash[i] <= 0) continue;
        if (flash[i] > 0) { ctx.fillStyle = 'rgba(255,253,243,' + (0.25 + 0.6 * flash[i]) + ')'; flash[i] -= 0.12; }
        else ctx.fillStyle = shades[hgt] || '#e8402a';
        ctx.fillRect((i % L) * CELL, ((i / L) | 0) * CELL, CELL + 1, CELL + 1);
      }
      drawPlot();
    }

    bagg.listen(cv.el, 'pointerdown', (e) => {
      const p = cv.pos(e);
      const gx = Math.floor(p.x / W * L), gy = Math.floor(p.y / H * L);
      if (gx >= 0 && gy >= 0 && gx < L && gy < L) { drop(gy * L + gx); syncPills(); }
    });

    window.__sandpile = {
      reset() { reset(); },
      drop() { const s = drop((Math.random() * L * L) | 0); syncPills(); return s; },
      dropN(n) { for (let k = 0; k < (n || 1); k++) drop((Math.random() * L * L) | 0); syncPills(); },
      stats() { return { grains: grains, avalanches: avalanches, biggest: biggest, distinctSizes: Object.keys(hist).length }; },
      setRunning(v) { running = !!v; }
    };
    bagg.add(() => { if (window.__sandpile) delete window.__sandpile; });

    reset();
    bagg.add(Engine.loop(() => {
      if (running) { for (let k = 0; k < 4; k++) drop((Math.random() * L * L) | 0); syncPills(); if (grains % 200 === 0) api.submit(biggest); }
      draw();
    }));

    return () => bagg.dispose();
  }

  Arcade.register({
    id: 'sandpile',
    title: 'In-Box',
    emoji: 'sandpile',
    cat: 'sim',
    order: 9,
    blurb: 'Memos land on desks; a desk with four spills over onto its neighbours, sometimes setting off a reply-all storm that crosses the whole floor. It tunes itself to the edge of chaos with no help from you, which is the unsettling part.',
    scoreLabel: 'Biggest avalanche',
    tags: ['sandpile', 'self-organized-criticality', 'power-law', 'emergence'],
    how: [

      'A topple can push neighbours over too, so one memo can trigger an avalanche of any size. Click a desk to drop one yourself.',
      'There is no setting to change. Left alone, the pile drives itself to criticality — the point where avalanches have no typical size.',
      'The instrument is the avalanche-size distribution on log-log axes. When it settles into a straight line, that line is the power law of self-organized criticality.',
      'You cannot calm it down; there is no stable state to reach. Your score is simply the biggest avalanche you have seen.'
    ],
    mount
  });
})();

<script>
/* The Herd — the Vicsek model (1995), the founding flocking phase transition.
 *
 * A crowd of self-propelled dots, each moving at constant speed and, every step,
 * turning to the average heading of everyone within a short radius — plus a dose
 * of random noise. One rule. Below a critical noise the whole crowd spontaneously
 * commits to a single direction with no leader; above it, they mill uselessly.
 * The order parameter phi (mean of the unit velocities) is 0 for a milling crowd
 * and 1 for perfect lockstep. The instrument is phi versus noise, measured live
 * from the model. Default noise sits just inside the ordered side.
 */
(function () {
  'use strict';
  const { h, rand } = Engine;
  const W = 560, H = 560, LB = 100, N = 340, R = 5.0, V0 = 1.0;
  const SCALE = W / LB;

  function mount(root, api) {
    const bagg = Engine.bag();
    const x = new Float32Array(N), y = new Float32Array(N), th = new Float32Array(N), nth = new Float32Array(N);
    let eta = 1.2, running = true;
    const samples = [];
    let ref = [];

    const cv = Engine.canvas(root, W, H, { maxHeight: '62vh' });
    const ctx = cv.ctx;
    const plot = h('canvas', { class: 'fire-plot', width: 520, height: 200 });
    root.appendChild(h('div', { class: 'fire-panel' }, plot));
    const pctx = plot.getContext('2d');

    const pEta = api.pill('Noise: 1.20');
    const pPhi = api.pill('Alignment: 0.00');

    const slider = h('input', { type: 'range', min: '0', max: '5', step: '0.05', value: '1.2', class: 'slider' });
    slider.addEventListener('input', () => { eta = parseFloat(slider.value); pEta.textContent = 'Noise: ' + eta.toFixed(2); });
    api.toolbar.appendChild(h('label', { class: 'sel-wrap' }, h('span', null, 'noise'), slider));
    const runBtn = api.button('Pause', () => { running = !running; runBtn.textContent = running ? 'Pause' : 'Run'; });
    api.button('Reset', reset);

    function reset() {
      for (let i = 0; i < N; i++) { x[i] = Math.random() * LB; y[i] = Math.random() * LB; th[i] = rand(-Math.PI, Math.PI); }
      api.status('Lower the noise and watch a milling crowd snap into one shared heading with nobody in charge. Raise it and the flock dissolves.');
      syncPills();
    }

    function wrap(v) { return v < 0 ? v + LB : v >= LB ? v - LB : v; }

    function step() {
      for (let i = 0; i < N; i++) {
        let sc = 0, ss = 0;
        for (let j = 0; j < N; j++) {
          let dx = x[j] - x[i], dy = y[j] - y[i];
          if (dx > LB / 2) dx -= LB; else if (dx < -LB / 2) dx += LB;
          if (dy > LB / 2) dy -= LB; else if (dy < -LB / 2) dy += LB;
          if (dx * dx + dy * dy <= R * R) { sc += Math.cos(th[j]); ss += Math.sin(th[j]); }
        }
        nth[i] = Math.atan2(ss, sc) + rand(-eta / 2, eta / 2);
      }
      for (let i = 0; i < N; i++) { th[i] = nth[i]; x[i] = wrap(x[i] + V0 * Math.cos(th[i])); y[i] = wrap(y[i] + V0 * Math.sin(th[i])); }
    }

    function phi() {
      let sc = 0, ss = 0;
      for (let i = 0; i < N; i++) { sc += Math.cos(th[i]); ss += Math.sin(th[i]); }
      return Math.hypot(sc, ss) / N;
    }

    function syncPills() { pEta.textContent = 'Noise: ' + eta.toFixed(2); const ph = phi(); pPhi.textContent = 'Alignment: ' + ph.toFixed(2); pPhi.className = 'pill ' + (ph > 0.5 ? 'good' : 'warn'); }

    /* measured reference: settle at each noise, record alignment (smaller flock) */
    function measureReference() {
      const n = 160, xr = new Float32Array(n), yr = new Float32Array(n), tr = new Float32Array(n), ntr = new Float32Array(n), out = [];
      for (let ei = 0; ei <= 18; ei++) {
        const et = 5 * ei / 18;
        for (let i = 0; i < n; i++) { xr[i] = Math.random() * LB; yr[i] = Math.random() * LB; tr[i] = rand(-Math.PI, Math.PI); }
        for (let s = 0; s < 60; s++) {
          for (let i = 0; i < n; i++) {
            let sc = 0, ss = 0;
            for (let j = 0; j < n; j++) {
              let dx = xr[j] - xr[i], dy = yr[j] - yr[i];
              if (dx > LB / 2) dx -= LB; else if (dx < -LB / 2) dx += LB;
              if (dy > LB / 2) dy -= LB; else if (dy < -LB / 2) dy += LB;
              if (dx * dx + dy * dy <= R * R) { sc += Math.cos(tr[j]); ss += Math.sin(tr[j]); }
            }
            ntr[i] = Math.atan2(ss, sc) + rand(-et / 2, et / 2);
          }
          for (let i = 0; i < n; i++) { tr[i] = ntr[i]; xr[i] = wrap(xr[i] + V0 * Math.cos(tr[i])); yr[i] = wrap(yr[i] + V0 * Math.sin(tr[i])); }
        }
        let sc = 0, ss = 0; for (let i = 0; i < n; i++) { sc += Math.cos(tr[i]); ss += Math.sin(tr[i]); }
        out.push({ eta: et, phi: Math.hypot(sc, ss) / n });
      }
      return out;
    }

    function drawPlot() {
      const w = plot.width, hh = plot.height, m = 26;
      pctx.fillStyle = '#12100c'; pctx.fillRect(0, 0, w, hh);
      const X = (e) => m + e / 5 * (w - m - 8);
      const Y = (f) => hh - m - f * (hh - m - 8);
      pctx.strokeStyle = '#4a4436'; pctx.lineWidth = 1;
      pctx.beginPath(); pctx.moveTo(m, Y(0)); pctx.lineTo(w - 8, Y(0)); pctx.moveTo(m, Y(0)); pctx.lineTo(m, Y(1)); pctx.stroke();
      pctx.fillStyle = '#8a8064'; pctx.font = '10px Verdana, sans-serif';
      pctx.fillText('alignment', 2, 12); pctx.fillText('noise', w - 40, hh - 8);
      if (ref.length) { pctx.strokeStyle = '#6fcf2f'; pctx.lineWidth = 2; pctx.beginPath(); ref.forEach((s, i) => { const px = X(s.eta), py = Y(s.phi); i ? pctx.lineTo(px, py) : pctx.moveTo(px, py); }); pctx.stroke(); }
      for (const s of samples) { pctx.fillStyle = '#e8402a'; pctx.beginPath(); pctx.arc(X(s.eta), Y(s.phi), 3, 0, 7); pctx.fill(); }
      pctx.fillStyle = '#fffdf3'; pctx.beginPath(); pctx.moveTo(X(eta), Y(0) + 2); pctx.lineTo(X(eta) - 4, Y(0) + 9); pctx.lineTo(X(eta) + 4, Y(0) + 9); pctx.fill();
    }

    function draw() {
      ctx.fillStyle = '#0f1420'; ctx.fillRect(0, 0, W, H);
      for (let i = 0; i < N; i++) {
        const px = x[i] * SCALE, py = y[i] * SCALE, a = th[i];
        const hue = ((a + Math.PI) / (2 * Math.PI) * 360) | 0;
        ctx.fillStyle = 'hsl(' + hue + ',75%,62%)';
        ctx.beginPath();
        ctx.moveTo(px + Math.cos(a) * 5, py + Math.sin(a) * 5);
        ctx.lineTo(px + Math.cos(a + 2.5) * 3, py + Math.sin(a + 2.5) * 3);
        ctx.lineTo(px + Math.cos(a - 2.5) * 3, py + Math.sin(a - 2.5) * 3);
        ctx.fill();
      }
      drawPlot();
    }

    window.__vicsek = {
      reset(opts) { if (opts && opts.eta != null) { eta = opts.eta; slider.value = String(eta); } reset(); },
      step() { step(); return phi(); },
      settle(steps) { for (let s = 0; s < (steps || 120); s++) step(); return phi(); },
      stats() { return { phi: phi(), eta: eta }; },
      setRunning(v) { running = !!v; }
    };
    bagg.add(() => { if (window.__vicsek) delete window.__vicsek; });

    ref = measureReference();
    reset();
    bagg.add(Engine.loop(() => {
      if (running) { step(); if ((Math.random() * 30 | 0) === 0) { const ph = phi(); samples.push({ eta: eta, phi: ph }); if (samples.length > 60) samples.shift(); api.submit(Math.round(ph * 100)); } }
      syncPills();
      draw();
    }));

    return () => bagg.dispose();
  }

  Arcade.register({
    id: 'vicsek',
    title: 'The Herd',
    emoji: 'vicsek',
    cat: 'sim',
    order: 10,
    blurb: 'A few hundred dots, each just steering toward the average heading of its neighbours plus a little randomness. Turn the randomness down and a directionless swarm suddenly moves as one, leaderless. The original model of flocking.',
    scoreLabel: 'Best alignment',
    tags: ['vicsek', 'flocking', 'phase-transition', 'emergence'],
    how: [
      'Every dot moves at the same speed and, each step, turns to the average heading of the dots within a short radius, plus some random jitter.',
      'The noise slider is that jitter. There is no leader and no goal — alignment is entirely emergent.',
      'The order parameter, "alignment", is 0 when the crowd mills in all directions and 1 when it moves in perfect lockstep.',
      'The instrument plots alignment against noise, measured live. Below a critical noise the flock locks in; above it, it falls apart. The change is sharp.',
      'Your score is the best alignment you sustain. The interesting play is right around the transition.'
    ],
    mount
  });
})();

<script>
/* Slow Clap — the Kuramoto model (1975) of coupled oscillators.
 *
 * A room of clappers, each with their own natural rhythm, each nudging its phase
 * toward the crowd's average. Below a critical coupling the applause is a wash of

 * synchronized slow clap — a real, documented instance of this model (rhythmic
 * applause, Neda et al., Nature 2000). The order parameter r runs 0 (incoherent)
 * to 1 (locked). Mean-field dynamics: dtheta_i = omega_i + K r sin(psi - theta_i).
 * Critical coupling for a normal spread of rhythms is K_c ~ 1.6 sigma. The
 * instrument is r versus coupling K, measured live.
 */
(function () {
  'use strict';

  const CX = W / 2, CY = H / 2 - 30, RC = 190;

    const slider = h('input', { type: 'range', min: '0', max: '4', step: '0.05', value: '2.2', class: 'slider' });
    slider.addEventListener('input', () => { K = parseFloat(slider.value); pK.textContent = 'Coupling K: ' + K.toFixed(2); });
    api.toolbar.appendChild(h('label', { class: 'sel-wrap' }, h('span', null, 'coupling'), slider));
    const runBtn = api.button('Pause', () => { running = !running; runBtn.textContent = running ? 'Pause' : 'Run'; });
    api.button('Reset', reset);

      for (let i = 0; i < N; i++) { th[i] = Math.random() * 2 * Math.PI; om[i] = gauss() * SIGMA; }
      api.status('Everyone claps at their own pace. Raise the coupling — how hard they listen to the room — past the critical point and the whole crowd snaps into one rhythm.');

      ctx.strokeStyle = '#fffdf3'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(CX + Math.cos(o.psi) * RC * o.r, CY + Math.sin(o.psi) * RC * o.r); ctx.stroke();

    };
    bagg.add(() => { if (window.__kuramoto) delete window.__kuramoto; });

<script>
/* Rush Hour — the Nagel–Schreckenberg traffic model.
 *
 * A single-lane ring road of cells. Each car has an integer speed 0..vmax and
 * every tick the whole road updates at once by four rules (Nagel & Schreckenberg
 * 1992): accelerate (v -> min(v+1, vmax)); brake to the gap so you never hit the
 * car ahead (v -> min(v, gap)); dawdle — with probability p, v -> max(v-1, 0);
 * then move v cells. That single random brake is the whole story: below a
 * critical density the road runs at free flow, but past it a lone dawdle seeds a
 * jam that propagates backward as a wave while every car keeps obeying the rules.
 * Flux (cars past a point per tick) rises with density, peaks at the critical
 * density, then falls into the congested branch — the fundamental diagram of
 * traffic. The panel measures that diagram live, and the window.__traffic seam
 * lets a headless sweep find the peak (tools/sweep-traffic.mjs).
 */
(function () {
  'use strict';
  const { h, clamp } = Engine;
  const L = 196;                       // ring length in cells
  const HST = 260;                     // rows of space-time history
  const W = 560, H = 560;

  function mount(root, api) {
    const bagg = Engine.bag();
    let vmax = 5, pDawdle = 0.25, density = 0.14;
    let cars = [];                       // {x, v} in cyclic order
    let running = true;
    let flow = 0, meanV = 0, jam = 0;
    let peakFlow = 0;
    let ref = [];

    const cv = Engine.canvas(root, W, H, { maxHeight: '58vh' });
    const ctx = cv.ctx;
    const off = document.createElement('canvas');
    off.width = L; off.height = HST;
    const octx = off.getContext('2d');
    const stImg = octx.createImageData(L, HST);
    const stBuf = new Uint32Array(stImg.data.buffer);
    stBuf.fill(0xff100c08 >>> 0);        // dark asphalt

    const plot = h('canvas', { class: 'fire-plot', width: 520, height: 200 });
    root.appendChild(h('div', { class: 'fire-panel' }, plot));
    const pctx = plot.getContext('2d');

    const pDensity = api.pill('Density: 0.14');
    const pFlow = api.pill('Flow: 0.00');
    const pSpeed = api.pill('Mean v: 0.0');
    const pJam = api.pill('Stopped: 0%');

    const dSlider = h('input', { type: 'range', min: '0.02', max: '0.6', step: '0.005', value: '0.14', class: 'slider' });
    dSlider.addEventListener('input', () => { density = parseFloat(dSlider.value); reset(); });
    api.toolbar.appendChild(h('label', { class: 'sel-wrap' }, h('span', null, 'density'), dSlider));
    const pSlider = h('input', { type: 'range', min: '0', max: '0.6', step: '0.02', value: '0.25', class: 'slider' });
    pSlider.addEventListener('input', () => { pDawdle = parseFloat(pSlider.value); });
    api.toolbar.appendChild(h('label', { class: 'sel-wrap' }, h('span', null, 'dawdle p'), pSlider));
    api.select('Top speed', [3, 4, 5, 6].map((v) => ({ value: String(v), label: 'v_max ' + v })), '5', (v) => { vmax = +v; reset(); });
    api.button('Reset', reset);

    function reset() {
      const n = Math.max(1, Math.round(density * L));
      /* place n cars at distinct cells, kept in ascending (cyclic) order */
      const occ = new Set();
      while (occ.size < n) occ.add((Math.random() * L) | 0);
      cars = [...occ].sort((a, b) => a - b).map((x) => ({ x, v: (Math.random() * (vmax + 1)) | 0 }));
      peakFlow = 0;
      stBuf.fill(0xff100c08 >>> 0);
      syncPills();
      api.status('Set the density and watch. Below the critical density the road flows; above it, a single random tap of the brakes blossoms into a jam that crawls backwards through the pack.');
    }

    /* one synchronous Nagel–Schreckenberg update of the whole road */
    function step() {
      const n = cars.length;
      if (!n) { flow = 0; meanV = 0; jam = 0; return; }
      /* gaps from current positions (no overtaking: v<=gap keeps cyclic order) */
      for (let i = 0; i < n; i++) {
        const next = cars[(i + 1) % n];
        let gap = next.x - cars[i].x - 1;
        if (gap < 0) gap += L;           // wrap for the leading car
        let v = cars[i].v;
        if (v < vmax) v++;               // 1. accelerate
        if (v > gap) v = gap;            // 2. brake to the gap
        if (v > 0 && Math.random() < pDawdle) v--;  // 3. dawdle
        cars[i].v = v;
      }
      let sv = 0, stopped = 0;
      for (let i = 0; i < n; i++) {
        cars[i].x = (cars[i].x + cars[i].v) % L;   // 4. move
        sv += cars[i].v;
        if (cars[i].v === 0) stopped++;
      }
      meanV = sv / n;
      flow = sv / L;                     // flux = (1/L) Σ v  (cars per cell per tick)
      jam = stopped / n;
      if (flow > peakFlow) { peakFlow = flow; api.submit(Math.round(peakFlow * 1000)); }
    }

    function syncPills() {
      pDensity.textContent = 'Density: ' + density.toFixed(3);
      pFlow.textContent = 'Flow: ' + flow.toFixed(3);
      pSpeed.textContent = 'Mean v: ' + meanV.toFixed(1);
      pJam.textContent = 'Stopped: ' + Math.round(jam * 100) + '%';
      pJam.className = 'pill ' + (jam > 0.25 ? 'warn' : '');
      pFlow.className = 'pill ' + (flow > 0.28 ? 'good' : '');
    }

    /* colour a car by speed: red (stopped) -> amber -> green (free) */
    function carColor(v) {
      const f = clamp(v / vmax, 0, 1);
      const r = Math.round(232 - 150 * f), g = Math.round(70 + 150 * f), b = 42;
      return (0xff000000 | (b << 16) | (g << 8) | r) >>> 0;   // ABGR
    }

    function pushRow() {
      stBuf.copyWithin(L, 0);            // scroll history down by one row
      const base = 0;
      for (let x = 0; x < L; x++) stBuf[base + x] = 0xff100c08 >>> 0;  // fresh asphalt row
      for (const car of cars) stBuf[base + car.x] = carColor(car.v);
    }

    function drawPlot() {
      const w = plot.width, hh = plot.height, m = 26;
      pctx.clearRect(0, 0, w, hh);
      pctx.fillStyle = '#12100c'; pctx.fillRect(0, 0, w, hh);
      const maxQ = 0.6;
      const X = (d) => m + d / 0.6 * (w - m - 8);
      const Y = (q) => hh - m - q / maxQ * (hh - m - 8);
      pctx.strokeStyle = '#4a4436'; pctx.lineWidth = 1;
      pctx.beginPath(); pctx.moveTo(m, Y(0)); pctx.lineTo(w - 8, Y(0)); pctx.moveTo(m, Y(0)); pctx.lineTo(m, Y(maxQ)); pctx.stroke();
      pctx.fillStyle = '#8a8064'; pctx.font = '10px Verdana, sans-serif';
      pctx.fillText('flow', 2, 12); pctx.fillText('density', w - 54, hh - 8);
      /* measured fundamental diagram */
      if (ref.length) {
        let best = ref[0];
        pctx.strokeStyle = '#00a6b4'; pctx.lineWidth = 2; pctx.beginPath();
        ref.forEach((s, i) => { const x = X(s.d), y = Y(s.q); i ? pctx.lineTo(x, y) : pctx.moveTo(x, y); if (s.q > best.q) best = s; });
        pctx.stroke();
        /* critical density: the peak of the diagram */
        pctx.strokeStyle = 'rgba(232,64,42,.8)'; pctx.setLineDash([4, 3]);
        pctx.beginPath(); pctx.moveTo(X(best.d), Y(0)); pctx.lineTo(X(best.d), Y(maxQ)); pctx.stroke();
        pctx.setLineDash([]);
        pctx.fillStyle = '#e8402a'; pctx.fillText('peak ~' + best.d.toFixed(2), X(best.d) + 3, Y(maxQ) + 10);
      }
      /* live sample */
      pctx.fillStyle = '#ffcb1f';
      pctx.beginPath(); pctx.arc(X(density), Y(flow), 4, 0, 7); pctx.fill();
      pctx.fillStyle = '#fffdf3';
      pctx.beginPath(); pctx.moveTo(X(density), Y(0) + 2); pctx.lineTo(X(density) - 4, Y(0) + 9); pctx.lineTo(X(density) + 4, Y(0) + 9); pctx.fill();
    }

    function draw() {
      octx.putImageData(stImg, 0, 0);
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(off, 0, 0, L, HST, 0, 0, W, H);
      ctx.restore();
      /* label the live road at the top */
      ctx.fillStyle = 'rgba(20,16,12,.7)'; ctx.fillRect(0, 0, 96, 18);
      ctx.fillStyle = '#ded6c2'; ctx.font = '11px Verdana, sans-serif'; ctx.textBaseline = 'middle';
      ctx.fillText('now', 8, 9); ctx.fillText('▼ time', 44, 9);
      ctx.textBaseline = 'alphabetic';
      drawPlot();
    }

    /* a real sweep of the model to draw the fundamental diagram */
    function measureReference() {
      const out = [];
      for (let di = 1; di <= 30; di++) {
        const d = 0.6 * di / 30;
        const n = Math.max(1, Math.round(d * L));
        const occ = new Set();
        while (occ.size < n) occ.add((Math.random() * L) | 0);
        let cs = [...occ].sort((a, b) => a - b).map((x) => ({ x, v: 0 }));
        const doStep = () => {
          const m = cs.length;
          for (let i = 0; i < m; i++) {
            const nx = cs[(i + 1) % m];
            let gap = nx.x - cs[i].x - 1; if (gap < 0) gap += L;
            let v = cs[i].v; if (v < vmax) v++; if (v > gap) v = gap;
            if (v > 0 && Math.random() < pDawdle) v--; cs[i].v = v;
          }
          let sv = 0;
          for (let i = 0; i < m; i++) { cs[i].x = (cs[i].x + cs[i].v) % L; sv += cs[i].v; }
          return sv / L;
        };
        for (let w = 0; w < 120; w++) doStep();        // warm up
        let acc = 0;
        for (let w = 0; w < 120; w++) acc += doStep();
        out.push({ d, q: acc / 120 });
      }
      return out;
    }

    /* ---- test seam: lets a headless sweep find the peak of the diagram ---- */
    window.__traffic = {
      reset(opts) {
        if (opts) {
          if (opts.density != null) { density = opts.density; dSlider.value = String(density); }
          if (opts.p != null) { pDawdle = opts.p; pSlider.value = String(pDawdle); }
          if (opts.vmax != null) vmax = opts.vmax;
        }
        reset();
      },
      step(n) { for (let k = 0; k < (n || 1); k++) step(); },
      stats() { return { density: cars.length / L, flow: flow, meanV: meanV, jam: jam, cars: cars.length }; },
      setRunning(v) { running = !!v; }
    };
    bagg.add(() => { if (window.__traffic) delete window.__traffic; });

    reset();
    const refTimer = setTimeout(() => { ref = measureReference(); }, 60);
    bagg.add(() => clearTimeout(refTimer));
    bagg.add(Engine.loop(() => {
      if (running) { step(); pushRow(); }
      syncPills();
      draw();
    }));

    return () => bagg.dispose();
  }

  Arcade.register({
    id: 'traffic',
    title: 'Rush Hour',
    emoji: 'traffic',
    cat: 'sim',
    order: 9,
    blurb: 'A one-lane ring road where every driver follows the same four rules and jams still appear out of nowhere. Push the density up and watch a phantom traffic wave crawl backwards through the pack — then read the exact point where the road carries the most cars.',
    scoreLabel: 'Peak flow',
    tags: ['nagel-schreckenberg', 'phase-transition', 'traffic', 'emergence'],
    how: [
      'Cars sit on a single-lane loop. Each has a speed from 0 to v_max, and the whole road updates together every tick.',
      'The four rules, applied to every car at once: speed up by one; slow down so you never hit the car ahead; then with probability p tap the brakes for no reason; then move. That one random tap is the only noise in the system.',
      'At low density everyone reaches v_max and the road is empty stripes of fast traffic. Raise the density slider past the critical point and a single dawdle triggers a jam that spreads backward — a wave of stopped cars moving the wrong way while every driver keeps obeying the rules.',
      'The main view is a space-time diagram: the top line is the road right now, and each row below is one tick into the past. Jams show up as dark bands leaning backward through time.',
      'The side panel is the fundamental diagram — flow against density — measured live from the model. Flow climbs, peaks at the critical density (the dashed line), then collapses into gridlock. Your current state is the yellow dot.',
      'Your score is the highest flow you can sustain, which means parking the density right at that peak. More dawdling (higher p) makes the jams worse and the peak lower.'
    ],
    mount
  });
})();

<script>
/* Window Frost — Diffusion-Limited Aggregation (Witten & Sander 1981).
 *
 * A single seed sits at the centre of a cold window. Water molecules wander in
 * by a random walk; the instant one touches the growing crystal it freezes in
 * place and never moves again. That one rule — stick on contact — grows a
 * branching dendrite, because the tips shadow the interior: a walker almost
 * always meets an outer branch before it can reach a fjord. The result is a
 * fractal, and not a vague one: its mass grows with radius as N(r) ~ r^D with
 * dimension D ≈ 1.71 for 2D DLA (Witten–Sander). The panel measures that
 * mass–radius law live on log–log axes and fits the slope. On a finite
 * lattice crystal the cumulative-mass fit reads a little under the asymptotic
 * value — it climbs through the 1.5s into the mid 1.6s as the frost fills the
 * window, and the whole-cluster mass–radius exponent sits around 1.75, so the
 * true 1.71 is bracketed rather than nailed. The window.__dla seam lets a
 * headless run confirm this (tools/sweep-dla.mjs). Walkers far from the crystal
 * take exact first-passage jumps across empty space, so it grows fast without
 * cheating the physics.
 */
(function () {
  'use strict';
  const { h, clamp } = Engine;
  const N = 420;                       // grid cells per side (big enough that D converges before the frame)
  const W = 560, H = 560;
  const CX = N / 2, CY = N / 2;
  const RMAX = N / 2 - 8;              // stop when the crystal nears the frame
  const DREF = 1.71;                   // known 2D DLA fractal dimension

  function mount(root, api) {
    const bagg = Engine.bag();
    const occ = new Uint8Array(N * N);
    const age = new Int32Array(N * N);  // 0 empty, else stick order (for colour)
    const rhist = new Float64Array(N + 2);  // radial histogram of crystal mass
    let count = 0, R = 0, done = false, running = true;
    let wx = 0, wy = 0;                  // current walker (float)
    let dim = 0;
    let peak = 0;

    const cv = Engine.canvas(root, W, H, { maxHeight: '58vh' });
    const ctx = cv.ctx;
    const off = document.createElement('canvas');
    off.width = N; off.height = N;
    const octx = off.getContext('2d');
    const img = octx.createImageData(N, N);
    const buf = new Uint32Array(img.data.buffer);

    const plot = h('canvas', { class: 'fire-plot', width: 520, height: 200 });
    root.appendChild(h('div', { class: 'fire-panel' }, plot));
    const pctx = plot.getContext('2d');

    const pCount = api.pill('Frozen: 1');
    const pR = api.pill('Radius: 0');
    const pDim = api.pill('D: —');

    api.select('Growth', [{ value: '2', label: 'Steady' }, { value: '6', label: 'Fast' }, { value: '15', label: 'Blizzard' }], '6', (v) => { perFrame = +v; });
    api.button('New window', reset);
    let perFrame = 6;                    // walkers landed per frame (budget-limited)

    const idx = (x, y) => y * N + x;

    function reset() {
      occ.fill(0); age.fill(0); rhist.fill(0);
      count = 0; R = 0; done = false; dim = 0; peak = 0;
      stick(CX | 0, CY | 0);             // the seed
      launch();
      buf.fill(0xff1a1208 >>> 0);
      api.status('Cold glass, one speck of ice in the middle. Wandering molecules freeze the instant they touch it, and the crystal branches into frost. The panel fits its fractal dimension as it grows — it climbs into the mid 1.6s on a finite crystal, bracketing the textbook 1.71.');
    }

    function stick(ix, iy) {
      const i = idx(ix, iy);
      if (occ[i]) return;
      occ[i] = 1; age[i] = ++count;
      const rr = Math.hypot(ix - CX, iy - CY);
      rhist[Math.min(rhist.length - 1, Math.round(rr))] += 1;
      if (rr > R) R = rr;
      if (count > peak) { peak = count; api.submit(peak); }
      if (R >= RMAX) { done = true; api.status('The frost reached the window frame. Fractal dimension measured at ' + dim.toFixed(2) + ' (Witten–Sander: ' + DREF + ').'); }
    }

    function launch() {
      const rl = R + 5;                // small margin; the big grid, not the margin, is what tames the spike
      const a = Math.random() * Math.PI * 2;
      wx = CX + rl * Math.cos(a);
      wy = CY + rl * Math.sin(a);
    }

    /* advance the walker; returns true when it freezes onto the crystal */
    function walkerStep() {
      const dx = wx - CX, dy = wy - CY;
      const d = Math.hypot(dx, dy);
      const rkill = 3 * R + 40;         // generous, so wanderers re-diffuse instead of dying at the tip
      if (d > rkill) { launch(); return false; }
      const m = d - R - 1;              // radius of guaranteed-empty disk around walker
      if (m > 2) {                       // exact first-passage jump onto that disk
        const a = Math.random() * Math.PI * 2;
        wx += m * Math.cos(a); wy += m * Math.sin(a);
        return false;
      }
      /* near the crystal: single lattice step, then test for contact */
      const dir = (Math.random() * 4) | 0;
      wx += dir === 0 ? 1 : dir === 1 ? -1 : 0;
      wy += dir === 2 ? 1 : dir === 3 ? -1 : 0;
      const ix = Math.round(wx), iy = Math.round(wy);
      if (ix < 1 || iy < 1 || ix >= N - 1 || iy >= N - 1) { launch(); return false; }
      if (occ[idx(ix - 1, iy)] || occ[idx(ix + 1, iy)] || occ[idx(ix, iy - 1)] || occ[idx(ix, iy + 1)]) {
        stick(ix, iy);
        launch();                      // a fresh molecule for the next contact, or it welds a spike
        return true;
      }
      return false;
    }

    /* least-squares slope of log N(<r) vs log r over the scaling window */
    function measureDimension() {
      if (R < 12) { dim = 0; return; }
      const rmin = 4, rmax = Math.max(rmin + 2, R * 0.7);
      let cum = 0, k = 0, sx = 0, sy = 0, sxx = 0, sxy = 0;
      for (let r = 1; r <= Math.round(rmax); r++) {
        cum += rhist[r];
        if (r >= rmin && cum > 0) {
          const X = Math.log(r), Y = Math.log(cum);
          sx += X; sy += Y; sxx += X * X; sxy += X * Y; k++;
        }
      }
      if (k >= 3) {
        const den = k * sxx - sx * sx;
        if (den > 1e-9) dim = (k * sxy - sx * sy) / den;
      }
    }

    function syncPills() {
      pCount.textContent = 'Frozen: ' + count;
      pR.textContent = 'Radius: ' + Math.round(R);
      pDim.textContent = 'D: ' + (dim ? dim.toFixed(2) : '—');
      pDim.className = 'pill ' + (dim > 1.5 && dim < 1.9 ? 'good' : '');
    }

    /* frost colour: fresh tips bright white, older core pale blue */
    function ageColor(a) {
      const f = clamp(a / Math.max(1, count), 0, 1);   // 0 old core .. 1 new tip
      const r = Math.round(150 + 105 * f);
      const g = Math.round(200 + 55 * f);
      const b = 255;
      return (0xff000000 | (b << 16) | (g << 8) | r) >>> 0;
    }

    function draw() {
      for (let i = 0; i < occ.length; i++) buf[i] = occ[i] ? ageColor(age[i]) : (0xff1a1208 >>> 0);
      octx.putImageData(img, 0, 0);
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(off, 0, 0, N, N, 0, 0, W, H);
      ctx.restore();
      drawPlot();
    }

    function drawPlot() {
      const w = plot.width, hh = plot.height, m = 30;
      pctx.clearRect(0, 0, w, hh);
      pctx.fillStyle = '#0b0f16'; pctx.fillRect(0, 0, w, hh);
      const lrMax = Math.log(RMAX), lnMax = Math.log(Math.max(10, count));
      const X = (lr) => m + lr / lrMax * (w - m - 10);
      const Y = (ln) => hh - m - ln / lnMax * (hh - m - 10);
      pctx.strokeStyle = '#3a4658'; pctx.lineWidth = 1;
      pctx.beginPath(); pctx.moveTo(m, Y(0)); pctx.lineTo(w - 10, Y(0)); pctx.moveTo(m, Y(0)); pctx.lineTo(m, Y(lnMax)); pctx.stroke();
      pctx.fillStyle = '#6c7a90'; pctx.font = '10px Verdana, sans-serif';
      pctx.fillText('log N', 2, 12); pctx.fillText('log r', w - 40, hh - 10);
      /* reference slope D = 1.71 through the cloud's lower anchor */
      const r0 = 4, n0 = rhist[1] + rhist[2] + rhist[3] + rhist[4] || 1;
      pctx.strokeStyle = 'rgba(232,64,42,.8)'; pctx.setLineDash([4, 3]); pctx.beginPath();
      let first = true;
      for (let lr = Math.log(r0); lr <= lrMax; lr += 0.1) {
        const ln = Math.log(n0) + DREF * (lr - Math.log(r0));
        const x = X(lr), y = Y(Math.min(ln, lnMax));
        first ? (pctx.moveTo(x, y), first = false) : pctx.lineTo(x, y);
      }
      pctx.stroke(); pctx.setLineDash([]);
      pctx.fillStyle = '#e8402a'; pctx.fillText('slope ' + DREF, w - 96, 14);
      /* measured mass–radius cloud */
      pctx.fillStyle = '#9fe0ff';
      let cum = 0;
      for (let r = 1; r <= Math.round(R); r++) {
        cum += rhist[r];
        if (r >= 2 && cum > 0) { pctx.fillRect(X(Math.log(r)) - 1, Y(Math.log(cum)) - 1, 2, 2); }
      }
      /* fitted D readout */
      pctx.fillStyle = '#fffdf3'; pctx.font = 'bold 12px Verdana, sans-serif';
      pctx.fillText('fitted D = ' + (dim ? dim.toFixed(2) : '—'), m + 6, Y(lnMax) + 4);
    }

    /* ---- test seam ---- */
    window.__dla = {
      reset() { reset(); },
      grow(n) {
        let added = 0, budget = n * 4000 + 20000;
        while (added < n && budget-- > 0 && !done) { if (walkerStep()) added++; }
        measureDimension();
        return added;
      },
      stats() { return { count: count, radius: R, dimension: dim, done: done }; },
      measureDimension() { measureDimension(); return dim; },
      setRunning(v) { running = !!v; }
    };
    bagg.add(() => { if (window.__dla) delete window.__dla; });

    reset();
    let acc = 0;
    bagg.add(Engine.loop(() => {
      if (running && !done) {
        let landed = 0, budget = 12000;
        while (landed < perFrame && budget-- > 0) { if (walkerStep()) landed++; }
        acc++;
        if (acc % 4 === 0) measureDimension();
      }
      syncPills();
      draw();
    }));

    return () => bagg.dispose();
  }

  Arcade.register({
    id: 'frost',
    title: 'Window Frost',
    emoji: 'frost',
    cat: 'sim',
    order: 10,
    blurb: 'One speck of ice on a cold window and a fog of wandering molecules. Each one freezes the moment it touches the crystal, and out of that single rule grows a branching frost fern — a genuine fractal whose dimension the panel measures as it spreads.',
    scoreLabel: 'Crystal size',
    tags: ['dla', 'fractal', 'diffusion', 'emergence'],
    how: [
      'A single frozen cell sits in the middle. Molecules wander in on random walks and freeze onto the crystal the instant they touch it — that is the only rule.',
      'The tips grow faster than the gaps, because a wanderer almost always bumps an outer branch before it can reach the sheltered interior. That shadowing is what makes frost branch instead of filling in.',
      'The shape is a fractal: its frozen mass within radius r grows like r to the power D. The panel fits that exponent live on log–log axes, with the known 2D DLA value D ≈ 1.71 drawn as the reference slope. A finite crystal reads a touch under it — the fit climbs into the mid 1.6s as the frost fills the window.',
      'Fresh tips are drawn bright white, the older core pale blue, so you can read the growth history straight off the crystal.',
      'Growth speed just changes how many molecules land per moment — it never changes the rule, so the dimension it converges to is the same. Your score is how large a crystal you grow before it reaches the frame.'
    ],
    mount
  });
})();

<script>
/* Boom & Bust — the logistic map, May's route to chaos (Robert May, 1974/76).
 *
 * One line of arithmetic runs a population: next = r · x · (1 − x), where x is
 * this year's stock as a fraction of the maximum and r is the growth rate.
 * Turn r up and the behaviour reorganises: a steady level, then a two-year
 * boom–bust cycle, then four years, eight, sixteen — the period keeps doubling,
 * faster each time — until at r ≈ 3.5699 the cycle length goes infinite and the
 * population never repeats. That is deterministic chaos from a one-liner. Inside
 * the chaos sit sudden windows of order (a clean three-year cycle near r ≈ 3.83).
 * The main view is the bifurcation diagram; the panel is the Lyapunov exponent,
 * which is negative wherever the map is periodic and turns positive exactly when
 * chaos begins — its zero crossing is the onset. The window.__logistic seam lets
 * a headless sweep confirm that crossing (tools/sweep-logistic.mjs).
 */
(function () {
  'use strict';
  const { h, clamp } = Engine;
  const W = 560, H = 560;
  const BIFH = 416;                    // bifurcation-diagram band height
  const ORBH = H - BIFH;               // live-orbit strip below it
  const RLO = 2.5, RHI = 4.0;
  const RCHAOS = 3.56995;              // onset of chaos (Feigenbaum accumulation)
  const R3 = 3.8284;                   // start of the period-3 window

  const map = (r, x) => r * x * (1 - x);

  /* Lyapunov exponent from a generic start (NOT x=0.5 — that lands on the
     critical orbit and collapses at r=4). Negative = periodic, positive = chaos. */
  function lyapunov(r, warm, n) {
    let x = 0.4, s = 0;
    for (let i = 0; i < warm; i++) x = map(r, x);
    for (let i = 0; i < n; i++) { s += Math.log(Math.max(1e-12, Math.abs(r * (1 - 2 * x)))); x = map(r, x); }
    return s / n;
  }
  /* shortest period p (<= maxP) the orbit settles into, or 0 for chaos/none */
  function periodOf(r, maxP) {
    let x = 0.4;
    for (let i = 0; i < 5000; i++) x = map(r, x);
    const seq = [x];
    for (let i = 0; i < maxP; i++) { x = map(r, x); seq.push(x); }
    for (let p = 1; p <= maxP; p++) if (Math.abs(seq[0] - seq[p]) < 1e-4) return p;
    return 0;
  }

  function mount(root, api) {
    const bagg = Engine.bag();
    let r = 3.2, xcur = 0.4, curP = 0, curL = 0, bestP = 0;
    const orbit = [];                    // recent x values for the live strip

    const cv = Engine.canvas(root, W, H, { maxHeight: '60vh' });
    const ctx = cv.ctx;
    const bif = document.createElement('canvas');   // cached bifurcation diagram
    bif.width = W; bif.height = BIFH;
    const bctx = bif.getContext('2d');
    let bifReady = false;
    let lam = null;                      // cached Lyapunov curve across the panel

    const plot = h('canvas', { class: 'fire-plot', width: 520, height: 200 });
    root.appendChild(h('div', { class: 'fire-panel' }, plot));
    const pctx = plot.getContext('2d');

    const pR = api.pill('r: 3.20');
    const pPeriod = api.pill('cycle: —');
    const pLam = api.pill('λ: —');
    const pRegime = api.pill('steady');

    const slider = h('input', { type: 'range', min: String(RLO), max: String(RHI), step: '0.001', value: '3.2', class: 'slider' });
    slider.addEventListener('input', () => setR(parseFloat(slider.value)));
    api.toolbar.appendChild(h('label', { class: 'sel-wrap' }, h('span', null, 'growth rate r'), slider));
    api.button('Onset of chaos', () => setR(RCHAOS));
    api.button('Period-3 window', () => setR(3.835));

    function setR(v) {
      r = clamp(v, RLO, RHI);
      slider.value = String(r);
      xcur = 0.4; orbit.length = 0;
      curP = periodOf(r, 16);
      curL = lyapunov(r, 1500, 6000);
      if (curP > bestP) { bestP = curP; api.submit(bestP); }
      syncPills();
    }

    function syncPills() {
      pR.textContent = 'r: ' + r.toFixed(3);
      pPeriod.textContent = 'cycle: ' + (curP ? curP + '-year' : 'chaotic');
      pLam.textContent = 'λ: ' + curL.toFixed(3);
      const chaotic = curL > 0 && !curP;
      pRegime.textContent = curP === 1 ? 'steady' : curP ? 'period-' + curP : chaotic ? 'CHAOS' : 'edge';
      pRegime.className = 'pill ' + (chaotic ? 'warn' : curP ? 'good' : '');
      pPeriod.className = 'pill ' + (curP ? 'good' : 'warn');
    }

    /* build the bifurcation diagram once: for each r-column, iterate from a
       generic seed, discard the transient, then plot where the orbit lands */
    function buildBif() {
      const im = bctx.createImageData(W, BIFH);
      const d = im.data;
      for (let px = 0; px < W; px++) {
        const rr = RLO + (RHI - RLO) * px / (W - 1);
        let x = 0.4;
        for (let i = 0; i < 600; i++) x = map(rr, x);
        for (let i = 0; i < 320; i++) {
          x = map(rr, x);
          const py = Math.min(BIFH - 1, Math.max(0, Math.round((1 - x) * (BIFH - 1))));
          const o = (py * W + px) * 4;
          d[o] = Math.min(255, d[o] + 90);
          d[o + 1] = Math.min(255, d[o + 1] + 150);
          d[o + 2] = Math.min(255, d[o + 2] + 170);
          d[o + 3] = 255;
        }
      }
      bctx.putImageData(im, 0, 0);
      bifReady = true;
    }

    function buildLyap() {
      const w = plot.width, n = w - 40;
      lam = new Float64Array(n);
      for (let i = 0; i < n; i++) lam[i] = lyapunov(RLO + (RHI - RLO) * i / (n - 1), 800, 2500);
    }

    const RX = (rr, x0, wpix) => x0 + (rr - RLO) / (RHI - RLO) * wpix;

    function drawPanel() {
      const w = plot.width, hh = plot.height, mL = 30, mB = 22;
      pctx.fillStyle = '#0b0f16'; pctx.fillRect(0, 0, w, hh);
      const plw = w - mL - 8, plh = hh - mB - 8;
      const lamMin = -1.6, lamMax = 0.8;
      const Y = (l) => 8 + (lamMax - clamp(l, lamMin, lamMax)) / (lamMax - lamMin) * plh;
      const X = (rr) => RX(rr, mL, plw);
      /* zero line */
      pctx.strokeStyle = '#3a4658'; pctx.lineWidth = 1;
      pctx.beginPath(); pctx.moveTo(mL, Y(0)); pctx.lineTo(w - 8, Y(0)); pctx.stroke();
      pctx.fillStyle = '#6c7a90'; pctx.font = '10px Verdana, sans-serif';
      pctx.fillText('λ', 4, Y(0) - 3); pctx.fillText('0', 16, Y(0) + 3); pctx.fillText('r', w - 14, hh - 8);
      /* onset of chaos marker */
      pctx.strokeStyle = 'rgba(232,64,42,.8)'; pctx.setLineDash([4, 3]);
      pctx.beginPath(); pctx.moveTo(X(RCHAOS), 6); pctx.lineTo(X(RCHAOS), hh - mB); pctx.stroke();
      pctx.setLineDash([]);
      pctx.fillStyle = '#e8402a'; pctx.fillText('chaos ' + RCHAOS.toFixed(3), X(RCHAOS) - 64, hh - 10);
      /* the curve */
      if (lam) {
        pctx.strokeStyle = '#00a6b4'; pctx.lineWidth = 1.4; pctx.beginPath();
        for (let i = 0; i < lam.length; i++) {
          const rr = RLO + (RHI - RLO) * i / (lam.length - 1);
          const x = X(rr), y = Y(lam[i]);
          i ? pctx.lineTo(x, y) : pctx.moveTo(x, y);
        }
        pctx.stroke();
      }
      /* current r */
      pctx.strokeStyle = '#ffcb1f'; pctx.lineWidth = 1;
      pctx.beginPath(); pctx.moveTo(X(r), 6); pctx.lineTo(X(r), hh - mB); pctx.stroke();
    }

    function draw() {
      /* bifurcation diagram */
      ctx.fillStyle = '#0b0f16'; ctx.fillRect(0, 0, W, H);
      if (bifReady) ctx.drawImage(bif, 0, 0);
      else { ctx.fillStyle = '#6c7a90'; ctx.font = '13px Verdana'; ctx.fillText('measuring the map…', 20, 30); }
      /* current-r line + labels on the diagram */
      const xr = RX(r, 0, W - 1);
      ctx.strokeStyle = 'rgba(255,203,31,.9)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(xr, 0); ctx.lineTo(xr, BIFH); ctx.stroke();
      ctx.fillStyle = '#e8402a';
      const xc = RX(RCHAOS, 0, W - 1);
      ctx.setLineDash([3, 3]); ctx.strokeStyle = 'rgba(232,64,42,.6)';
      ctx.beginPath(); ctx.moveTo(xc, 0); ctx.lineTo(xc, BIFH); ctx.stroke(); ctx.setLineDash([]);
      ctx.font = '10px Verdana, sans-serif';
      ctx.fillText('onset of chaos', xc + 3, 12);
      ctx.fillStyle = '#8a8064';
      ctx.fillText('r = ' + RLO, 4, BIFH - 4); ctx.fillText('r = ' + RHI, W - 44, BIFH - 4);
      ctx.fillStyle = '#ded6c2'; ctx.fillText('population x', 4, 12);

      /* live orbit strip */
      ctx.fillStyle = '#141019'; ctx.fillRect(0, BIFH, W, ORBH);
      ctx.strokeStyle = '#2a2440'; ctx.beginPath(); ctx.moveTo(0, BIFH + 0.5); ctx.lineTo(W, BIFH + 0.5); ctx.stroke();
      const oy = (x) => BIFH + 8 + (1 - x) * (ORBH - 16);
      ctx.strokeStyle = '#6fcf2f'; ctx.lineWidth = 1.5; ctx.beginPath();
      for (let i = 0; i < orbit.length; i++) {
        const x = 6 + i / 140 * (W - 12), y = oy(orbit[i]);
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
      ctx.fillStyle = '#6fcf2f';
      for (let i = 0; i < orbit.length; i++) ctx.fillRect(6 + i / 140 * (W - 12) - 1, oy(orbit[i]) - 1, 2, 2);
      ctx.fillStyle = '#8a8064'; ctx.font = '10px Verdana, sans-serif';
      ctx.fillText('this year → next year (watch the cycle length)', 8, H - 6);

      drawPanel();
    }

    /* ---- test seam ---- */
    window.__logistic = {
      setR(v) { setR(v); },
      lyapunov(v, warm, n) { return lyapunov(v, warm || 2000, n || 20000); },
      period(v, maxP) { return periodOf(v, maxP || 16); },
      stats() { return { r: r, period: curP, lambda: curL }; }
    };
    bagg.add(() => { if (window.__logistic) delete window.__logistic; });

    setR(3.2);
    const t1 = setTimeout(buildBif, 40);
    const t2 = setTimeout(buildLyap, 60);
    bagg.add(() => { clearTimeout(t1); clearTimeout(t2); });
    api.status('Drag the growth rate. Low and steady, then a boom–bust cycle, then it doubles and doubles until it never repeats. The panel’s Lyapunov exponent goes positive exactly where chaos starts.');

    bagg.add(Engine.loop(() => {
      /* advance the live orbit a few years per frame */
      for (let s = 0; s < 2; s++) { xcur = map(r, xcur); orbit.push(xcur); if (orbit.length > 141) orbit.shift(); }
      draw();
    }));

    return () => bagg.dispose();
  }

  Arcade.register({
    id: 'logistic',
    title: 'Boom & Bust',
    emoji: 'boom',
    cat: 'sim',
    order: 11,
    blurb: 'One line of arithmetic runs a population, and turning a single knob marches it from a steady level, through doubling boom–bust cycles, into full-blown chaos — with islands of clean order hidden inside the storm. The famous route to chaos, live and measured.',
    scoreLabel: 'Deepest cycle',
    tags: ['logistic-map', 'chaos', 'bifurcation', 'dynamical-systems'],
    how: [
      'The rule is next = r × x × (1 − x): a population that grows when small and crashes when it overshoots. x is the stock (0 to 1), r is the growth rate you control.',
      'The big picture is the bifurcation diagram: for each growth rate it shows the values the population eventually settles into. One line means a steady level; two means it alternates high–low every year; four means a longer cycle, and so on.',
      'Raise r and the cycle length keeps doubling — 1, 2, 4, 8, 16 — in ever-smaller steps, piling up at r ≈ 3.5699. Past that the population never repeats: deterministic chaos from a one-liner.',
      'The bottom strip plays the actual orbit year by year, so you can watch the cycle length with your own eyes: flat, then a two-beat, then a jitter that never settles.',
      'The panel measures the Lyapunov exponent — the rate nearby populations pull apart. It is negative wherever the map is periodic and crosses zero exactly at the onset of chaos, which is marked.',
      'Hunt the windows: deep inside the chaos the diagram suddenly clears into a tidy three-year cycle near r ≈ 3.83 (and there are five- and six-year windows too). Your score is the longest exact cycle you can land on.'
    ],
    mount
  });
})();
