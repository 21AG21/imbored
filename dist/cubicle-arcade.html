<script>
/* Battleship. A floor-by-floor asset audit dressed up as naval warfare. */
(function () {
  'use strict';
  const { h, randInt, pick } = Engine;

  /* the standard fleet, relabelled as things you'd account for in a drill */
  const FLEET = [
    { name: 'Server rack', size: 5 },
    { name: 'Boardroom table', size: 4 },
    { name: 'Water cooler', size: 3 },
    { name: 'Filing cabinet', size: 3 },
    { name: 'Fax machine', size: 2 }
  ];
  const N = 10;
  const COLS = 'ABCDEFGHIJ';

  const inb = (r, c) => r >= 0 && r < N && c >= 0 && c < N;

  function footprint(r, c, size, o) {
    const out = [];
    for (let i = 0; i < size; i++) out.push(o === 'h' ? [r, c + i] : [r + i, c]);
    return out;
  }
  function emptyBoard() { return { grid: new Array(N * N).fill(-1), ships: [] }; }
  function canPlace(board, cells) {
    for (const cc of cells) {
      const r = cc[0], c = cc[1];
      if (!inb(r, c)) return false;
      if (board.grid[r * N + c] !== -1) return false;
    }
    return true;
  }
  function addShip(board, spec, cells) {
    const ship = { name: spec.name, size: spec.size, cells: cells, hits: 0, sunk: false };
    const idx = board.ships.length;
    board.ships.push(ship);
    for (const cc of cells) board.grid[cc[0] * N + cc[1]] = idx;
    return ship;
  }
  function randomBoard() {
    const b = emptyBoard();
    for (const spec of FLEET) {
      let placed = false, tries = 0;
      while (!placed && tries < 800) {
        tries++;
        const o = Math.random() < 0.5 ? 'h' : 'v';
        const r = o === 'h' ? randInt(0, 9) : randInt(0, N - spec.size);
        const c = o === 'h' ? randInt(0, N - spec.size) : randInt(0, 9);
        const cells = footprint(r, c, spec.size, o);
        if (canPlace(b, cells)) { addShip(b, spec, cells); placed = true; }
      }
      if (!placed) {
        /* exhaustive fallback; practically never needed on a 10x10 */
        for (let rr = 0; rr < N && !placed; rr++)
          for (let cc = 0; cc < N && !placed; cc++)
            for (let oi = 0; oi < 2 && !placed; oi++) {
              const cells = footprint(rr, cc, spec.size, oi ? 'v' : 'h');
              if (canPlace(b, cells)) { addShip(b, spec, cells); placed = true; }
            }
      }
    }
    return b;
  }
  function allSunk(board) { return board.ships.every((s) => s.sunk); }
  function unsunk(board) { let n = 0; for (const s of board.ships) if (!s.sunk) n++; return n; }

  function mount(root, api) {
    const bagg = Engine.bag();

    let phase = 'setup';       /* setup | battle | over */
    let turn = 'player';       /* player | cpu */
    let mode = '1p';           /* 1p vs CPU | 2p hotseat pass-and-play */
    let busy = false;
    let reveal = false;
    let playerBoard, enemyBoard;
    let pShots, eShots;        /* shots taken AT a board: 0 unknown, 1 miss, 2 hit */
    /* 2p canonical state: each player owns a board; the render vars above are
       pointed at the current player's perspective by setView() */
    let boardA, boardB, shotsAtA, shotsAtB, cur = 1;
    let setupIdx = 0;
    let orient = 'h';
    let hoverCell = null;
    let wins = api.load('wins', 0);
    let streak = api.load('streak', 0);

    let alive = true;
    const timers = new Set();
    function after(ms, fn) {
      const id = setTimeout(function () { timers.delete(id); if (alive) fn(); }, ms);
      timers.add(id);
      return id;
    }
    bagg.add(function () { alive = false; timers.forEach(clearTimeout); timers.clear(); });

    /* ---------------- DOM ---------------- */
    const banner = h('div', { class: 'banner', style: { display: 'none' } });

    function buildBoard(kind) {
      const el = h('div', { class: 'bs-board bs-' + kind });
      const cells = new Array(N * N);
      el.appendChild(h('div', { class: 'bs-lab corner' }));
      for (let c = 0; c < N; c++) el.appendChild(h('div', { class: 'bs-lab' }, COLS[c]));
      for (let r = 0; r < N; r++) {
        el.appendChild(h('div', { class: 'bs-lab' }, String(r + 1)));
        for (let c = 0; c < N; c++) {
          const cell = h('div', { class: 'cell', data: { r: String(r), c: String(c) } });
          cells[r * N + c] = cell;
          el.appendChild(cell);
        }
      }
      return { el: el, cells: cells };
    }
    const me = buildBoard('me');
    const them = buildBoard('them');
    const meTitle = h('h4', null, 'Your floor');
    const wrap = h('div', { class: 'battleship' },
      h('div', { class: 'panelrow' },
        h('div', { class: 'bs-side' }, meTitle, me.el),
        h('div', { class: 'bs-side' }, h('h4', null, 'Enemy floor'), them.el)));
    /* full-cover interstitial so a passing player never sees the other's fleet */
    const passScreen = h('div', { class: 'bs-pass', style: { display: 'none' } });
    wrap.appendChild(passScreen);
    root.append(banner, wrap);

    function showPass(nextPlayer, msg, onReady) {
      busy = true;
      passScreen.replaceChildren(
        h('div', { class: 'bs-pass-card' },
          h('h3', null, 'Pass the device to Player ' + nextPlayer),
          h('p', null, msg),
          h('button', {
            class: 'btn primary', type: 'button',
            onclick: function () { passScreen.style.display = 'none'; onReady(); }
          }, 'I am Player ' + nextPlayer + ' — Ready')));
      passScreen.style.display = '';
    }

    /* ---------------- toolbar ---------------- */
    const pTurn = api.pill('Setup');
    const pEnemy = api.pill('Targets left: 5');
    const pStreak = api.pill('Streak 0', 'best');

    const btnNew = api.button('New game', newGame);
    const btnRandom = api.button('Re-roll fleet', randomiseSetup);
    const btnClear = api.button('Place by hand', clearSetup);
    const btnRotate = api.button('Rotate (R)', rotate);
    const btnStart = api.button('Start battle', primaryAction, 'primary');
    api.select('Players', [
      { value: '1p', label: '1 player (vs CPU)' },
      { value: '2p', label: '2 players (hotseat)' }
    ], '1p', function (v) { mode = v; resetForMode(); });
    const setupBtns = [btnRandom, btnClear, btnRotate, btnStart];
    void btnNew;

    function resetForMode() { banner.style.display = 'none'; if (mode === '2p') newSetup2p(); else newSetup(); }
    function primaryAction() { if (mode === '2p') return primary2p(); return startBattle(); }
    /* point the shared render vars at a player's perspective (own board on the
       left, opponent's hidden board on the right) */
    function setView(player) {
      cur = player;
      if (player === 1) { playerBoard = boardA; pShots = shotsAtA; enemyBoard = boardB; eShots = shotsAtB; }
      else { playerBoard = boardB; pShots = shotsAtB; enemyBoard = boardA; eShots = shotsAtA; }
    }
    function syncCanonical() {
      if (mode !== '2p') return;
      if (cur === 1) boardA = playerBoard; else boardB = playerBoard;
    }

    /* ---------------- listeners ---------------- */
    bagg.listen(them.el, 'click', function (e) {
      const t = e.target.closest('.cell');
      if (!t) return;
      if (phase !== 'battle' || busy) return;
      if (mode === '2p') { fire2p(+t.dataset.r, +t.dataset.c); return; }
      if (turn !== 'player') return;
      playerFire(+t.dataset.r, +t.dataset.c);
    });
    bagg.listen(me.el, 'click', function (e) {
      if (phase !== 'setup') return;
      const t = e.target.closest('.cell');
      if (!t) return;
      placeAt(+t.dataset.r, +t.dataset.c);
    });
    bagg.listen(me.el, 'pointermove', function (e) {
      if (phase !== 'setup' || setupIdx >= FLEET.length) return;
      const t = e.target.closest('.cell');
      const nc = t ? [+t.dataset.r, +t.dataset.c] : null;
      if ((nc && hoverCell && nc[0] === hoverCell[0] && nc[1] === hoverCell[1]) || (!nc && !hoverCell)) return;
      hoverCell = nc;
      renderMe();
    });
    bagg.listen(me.el, 'pointerleave', function () {
      if (!hoverCell) return;
      hoverCell = null;
      renderMe();
    });
    bagg.add(Engine.onKey(function (e) {
      if (phase === 'setup' && (e.code === 'KeyR' || e.key === 'r' || e.key === 'R')) { rotate(); return true; }
      return false;
    }));

    /* ---------------- setup phase ---------------- */
    function newGame() { resetForMode(); }

    function newSetup() {
      phase = 'setup'; mode = '1p'; turn = 'player'; busy = false; reveal = false;
      hoverCell = null; orient = 'h';
      btnStart.textContent = 'Start battle';
      passScreen.style.display = 'none';
      playerBoard = emptyBoard();
      enemyBoard = randomBoard();
      pShots = new Array(N * N).fill(0);
      eShots = new Array(N * N).fill(0);
      setupIdx = 0;
      randomiseSetup();
    }

    function randomiseSetup() {
      if (phase !== 'setup') return;
      playerBoard = randomBoard();
      syncCanonical();
      setupIdx = FLEET.length;
      hoverCell = null;
      api.sfx.click();
      api.status(mode === '2p'
        ? 'Player ' + cur + ': fleet moored. Re-roll, place by hand, then hit ' + (cur === 1 ? 'Pass to Player 2.' : 'Start battle.')
        : 'Fleet moored. Re-roll, place it by hand, or start the drill.');
      updateToolbar(); updatePills(); renderAll();
    }

    function clearSetup() {
      if (phase !== 'setup') return;
      playerBoard = emptyBoard();
      syncCanonical();
      setupIdx = 0; hoverCell = null;
      api.sfx.click();
      api.status((mode === '2p' ? 'Player ' + cur + ': placing your ' : 'Placing your ') + FLEET[0].name + ' (' + FLEET[0].size + '). Click a square; press R to rotate.');
      updateToolbar(); updatePills(); renderAll();
    }

    function rotate() {
      if (phase !== 'setup') return;
      orient = orient === 'h' ? 'v' : 'h';
      api.sfx.blip(440);
      renderMe();
    }

    function placeAt(r, c) {
      if (setupIdx >= FLEET.length) return;
      const spec = FLEET[setupIdx];
      const cells = footprint(r, c, spec.size, orient);
      if (!canPlace(playerBoard, cells)) {
        api.sfx.bad();
        api.status('That will not fit. Try another square or rotate with R.');
        return;
      }
      addShip(playerBoard, spec, cells);
      setupIdx++;
      api.sfx.click();
      if (setupIdx >= FLEET.length) api.status('Fleet ready. Hit Start battle.');
      else api.status('Now placing ' + FLEET[setupIdx].name + ' (' + FLEET[setupIdx].size + '). Press R to rotate.');
      updateToolbar(); renderMe();
    }

    function startBattle() {
      if (phase !== 'setup' || setupIdx < FLEET.length) return;
      phase = 'battle'; turn = 'player'; busy = false; reveal = false; hoverCell = null;
      api.sfx.good();
      api.status('Battle stations. Click a square on the enemy floor to fire.');
      updateToolbar(); updatePills(); renderAll();
    }

    /* ---------------- 2-player hotseat (pass-and-play) ---------------- */
    function newSetup2p() {
      phase = 'setup'; mode = '2p'; reveal = false; busy = false; hoverCell = null; orient = 'h';
      boardA = emptyBoard(); boardB = emptyBoard();
      shotsAtA = new Array(N * N).fill(0); shotsAtB = new Array(N * N).fill(0);
      setView(1);
      playerBoard = randomBoard(); syncCanonical(); setupIdx = FLEET.length;
      btnStart.textContent = 'Pass to Player 2';
      api.status('Player 1: place your fleet. Re-roll or place by hand, then Pass to Player 2. Player 2, look away.');
      updateToolbar(); updatePills(); renderAll();
    }

    function primary2p() {
      if (phase !== 'setup' || setupIdx < FLEET.length) return;
      api.sfx.good();
      if (cur === 1) {
        showPass(2, 'Player 2, set up your own fleet. No peeking at Player 1’s floor.', function () {
          setView(2);
          playerBoard = randomBoard(); syncCanonical(); setupIdx = FLEET.length;
          hoverCell = null; orient = 'h';
          btnStart.textContent = 'Start battle';
          api.status('Player 2: place your fleet, then Start battle.');
          updateToolbar(); updatePills(); renderAll();
        });
      } else {
        showPass(1, 'Battle stations — Player 1 fires first.', function () {
          phase = 'battle'; reveal = false; busy = false; hoverCell = null;
          setView(1);
          api.status('Player 1: click a square on the enemy floor to fire.');
          updateToolbar(); updatePills(); renderAll();
        });
      }
    }

    function fire2p(r, c) {
      const i = r * N + c;
      if (eShots[i] !== 0) return;
      const res = resolveShot(enemyBoard, eShots, r, c);
      renderThem(); updatePills();
      const shooter = cur, nxt = cur === 1 ? 2 : 1;
      if (allSunk(enemyBoard)) { endGame2p(shooter); return; }
      const msg = res.sunk ? ('You sank their ' + res.name + ' (' + res.size + ').')
        : res.hit ? 'Direct hit.' : 'Splash — a miss.';
      busy = true;
      after(700, function () {
        if (!alive || phase !== 'battle') return;
        showPass(nxt, msg + ' Player ' + shooter + ', look away.', function () {
          setView(nxt); busy = false; reveal = false;
          api.status('Player ' + nxt + ': fire at the enemy floor.');
          updatePills(); renderAll();
        });
      });
    }

    function endGame2p(winner) {
      phase = 'over'; busy = true; reveal = true;
      updateToolbar(); updatePills(); renderAll();
      api.sfx.great();
      banner.style.display = '';
      banner.replaceChildren(
        h('h3', null, 'Player ' + winner + ' wins.'),
        h('p', null, 'Player ' + winner + ' sank the entire enemy fleet.'),
        h('button', { class: 'btn primary', type: 'button', onclick: newGame }, 'Rematch'));
    }

    /* ---------------- combat ---------------- */
    function resolveShot(board, shots, r, c) {
      const i = r * N + c;
      const shipIdx = board.grid[i];
      if (shipIdx >= 0) {
        shots[i] = 2;
        const ship = board.ships[shipIdx];
        ship.hits++;
        if (ship.hits >= ship.size) { ship.sunk = true; api.sfx.boom(); return { hit: true, sunk: true, name: ship.name, size: ship.size }; }
        api.sfx.thud();
        return { hit: true, sunk: false, name: ship.name, size: ship.size };
      }
      shots[i] = 1;
      api.sfx.blip(240);
      return { hit: false, sunk: false };
    }

    function playerFire(r, c) {
      const i = r * N + c;
      if (eShots[i] !== 0) return;
      const res = resolveShot(enemyBoard, eShots, r, c);
      if (res.sunk) api.status('Cleared their ' + res.name + ' (' + res.size + '). ' + unsunk(enemyBoard) + ' asset(s) left.');
      else if (res.hit) api.status('Direct hit on the enemy floor.');
      else api.status('Splash. Nothing there.');
      renderThem(); updatePills();
      if (allSunk(enemyBoard)) { endGame(true); return; }
      turn = 'cpu'; busy = true;
      updatePills(); renderThem();
      after(560, cpuTurn);
    }

    function cpuTurn() {
      if (!alive || phase !== 'battle') return;
      const shot = cpuPick();
      if (!shot) { turn = 'player'; busy = false; renderThem(); return; }
      const res = resolveShot(playerBoard, pShots, shot[0], shot[1]);
      renderMe(); updatePills();
      if (allSunk(playerBoard)) { endGame(false); return; }
      turn = 'player'; busy = false;
      if (res.sunk) api.status('The CPU cleared your ' + res.name + ' (' + res.size + '). Your move.');
      else if (res.hit) api.status('The CPU tagged one of your assets. Your move.');
      else api.status('The CPU missed. Your move.');
      updatePills(); renderThem();
    }

    /* ---------------- CPU intelligence ---------------- */
    function allUnknown() {
      const a = [];
      for (let i = 0; i < N * N; i++) if (pShots[i] === 0) a.push([Math.floor(i / N), i % N]);
      return a;
    }
    function activeHits() {
      const out = [];
      for (const s of playerBoard.ships) {
        if (s.sunk) continue;
        for (const cc of s.cells) if (pShots[cc[0] * N + cc[1]] === 2) out.push(cc);
      }
      return out;
    }
    function cpuPick() {
      if (api.diffId === 'nightmare') return densityPick() || pick(allUnknown() ) || null;
      if (api.diffId !== 'chill') {
        const t = targetPick();
        if (t) return t;
      }
      return huntPick();
    }
    function targetPick() {
      const hits = activeHits();
      if (!hits.length) return null;
      const H = new Set(hits.map((k) => k[0] * N + k[1]));
      const dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
      const strong = [];
      for (const hc of hits) {
        const r = hc[0], c = hc[1];
        for (const d of dirs) {
          const dr = d[0], dc = d[1];
          if (!H.has((r + dr) * N + (c + dc))) continue;
          /* a line exists in this direction: aim just past each end */
          let er = r, ec = c;
          while (inb(er + dr, ec + dc) && H.has((er + dr) * N + (ec + dc))) { er += dr; ec += dc; }
          if (inb(er + dr, ec + dc) && pShots[(er + dr) * N + (ec + dc)] === 0) strong.push([er + dr, ec + dc]);
          let br = r, bc = c;
          while (inb(br - dr, bc - dc) && H.has((br - dr) * N + (bc - dc))) { br -= dr; bc -= dc; }
          if (inb(br - dr, bc - dc) && pShots[(br - dr) * N + (bc - dc)] === 0) strong.push([br - dr, bc - dc]);
        }
      }
      if (strong.length) return pick(strong);
      const weak = [];
      for (const hc of hits) {
        for (const d of dirs) {
          const nr = hc[0] + d[0], ncc = hc[1] + d[1];
          if (inb(nr, ncc) && pShots[nr * N + ncc] === 0) weak.push([nr, ncc]);
        }
      }
      return weak.length ? pick(weak) : null;
    }
    function huntPick() {
      const all = [], par = [];
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        if (pShots[r * N + c] === 0) { all.push([r, c]); if ((r + c) % 2 === 0) par.push([r, c]); }
      }
      if (!all.length) return null;
      if (api.diffId === 'hard' && par.length) return pick(par);
      return pick(all);
    }
    function densityPick() {
      const rem = playerBoard.ships.filter((s) => !s.sunk).map((s) => s.size);
      if (!rem.length) return null;
      const activeSet = new Set(activeHits().map((k) => k[0] * N + k[1]));
      const avail = new Array(N * N);
      for (let i = 0; i < N * N; i++) {
        if (pShots[i] === 1) avail[i] = false;
        else if (pShots[i] === 2) avail[i] = !playerBoard.ships[playerBoard.grid[i]].sunk;
        else avail[i] = true;
      }
      const heat = new Array(N * N).fill(0);
      for (const size of rem) {
        for (let r = 0; r < N; r++) for (let c = 0; c <= N - size; c++) {
          let ok = true, cov = 0;
          for (let k = 0; k < size; k++) { const i = r * N + (c + k); if (!avail[i]) { ok = false; break; } if (activeSet.has(i)) cov++; }
          if (!ok) continue;
          const w = cov > 0 ? Math.pow(80, cov) : 1;
          for (let k = 0; k < size; k++) { const i = r * N + (c + k); if (pShots[i] === 0) heat[i] += w; }
        }
        for (let c = 0; c < N; c++) for (let r = 0; r <= N - size; r++) {
          let ok = true, cov = 0;
          for (let k = 0; k < size; k++) { const i = (r + k) * N + c; if (!avail[i]) { ok = false; break; } if (activeSet.has(i)) cov++; }
          if (!ok) continue;
          const w = cov > 0 ? Math.pow(80, cov) : 1;
          for (let k = 0; k < size; k++) { const i = (r + k) * N + c; if (pShots[i] === 0) heat[i] += w; }
        }
      }
      let bi = -1, bv = -1;
      for (let i = 0; i < N * N; i++) { if (pShots[i] === 0 && heat[i] > bv) { bv = heat[i]; bi = i; } }
      if (bi < 0) return null;
      return [Math.floor(bi / N), bi % N];
    }

    /* ---------------- end ---------------- */
    function endGame(playerWon) {
      phase = 'over'; busy = true; turn = null; reveal = true;
      updateToolbar(); updatePills(); renderAll();
      banner.style.display = '';
      if (playerWon) {
        wins++; streak++;
        api.save('wins', wins); api.save('streak', streak);
        const res = api.submit(streak);
        api.sfx.great();
        banner.replaceChildren(
          h('h3', null, 'Floor cleared.'),
          h('p', null, 'Every enemy asset accounted for. Career wins: ' + wins + '. Win streak: ' + streak + '.' +
            (res && res.isRecord ? ' New best streak.' : '')),
          h('button', { class: 'btn primary', type: 'button', onclick: newGame }, 'Run it again'));
      } else {
        streak = 0; api.save('streak', 0);
        api.sfx.bad();
        banner.replaceChildren(
          h('h3', null, 'You got audited.'),
          h('p', null, 'The CPU cleared your last asset. Streak reset to zero. Career wins: ' + wins + '.'),
          h('button', { class: 'btn primary', type: 'button', onclick: newGame }, 'Try again'));
      }
      updatePills();
    }

    /* ---------------- rendering ---------------- */
    function setCls(el, cls) { if (el.className !== cls) el.className = cls; }

    function renderMe() {
      let prev = null, prevOk = false;
      if (phase === 'setup' && setupIdx < FLEET.length && hoverCell) {
        const cells = footprint(hoverCell[0], hoverCell[1], FLEET[setupIdx].size, orient);
        prevOk = canPlace(playerBoard, cells);
        prev = new Set();
        for (const cc of cells) if (inb(cc[0], cc[1])) prev.add(cc[0] * N + cc[1]);
      }
      for (let i = 0; i < N * N; i++) {
        let cls = 'cell';
        const shipIdx = playerBoard.grid[i];
        if (pShots[i] === 2) cls += playerBoard.ships[shipIdx].sunk ? ' sunk' : ' hit';
        else if (pShots[i] === 1) cls += ' miss';
        else if (shipIdx >= 0) cls += ' ship';
        if (prev && prev.has(i)) cls += prevOk ? ' prev-ok' : ' prev-bad';
        setCls(me.cells[i], cls);
      }
    }

    function renderThem() {
      const live = phase === 'battle' && !busy && (mode === '2p' || turn === 'player');
      for (let i = 0; i < N * N; i++) {
        let cls = 'cell';
        if (eShots[i] === 2) cls += enemyBoard.ships[enemyBoard.grid[i]].sunk ? ' sunk' : ' hit';
        else if (eShots[i] === 1) cls += ' miss';
        else {
          cls += ' water';
          if (reveal && enemyBoard.grid[i] >= 0) cls += ' ghost';
          if (live) cls += ' live';
        }
        setCls(them.cells[i], cls);
      }
    }

    function renderAll() { renderMe(); renderThem(); }

    function updatePills() {
      if (mode === '2p') {
        meTitle.textContent = 'Player ' + cur + ' — your floor';
        pTurn.textContent = phase === 'setup' ? 'Player ' + cur + ' setup'
          : phase === 'over' ? 'Game over' : 'Player ' + cur + ' fires';
        pTurn.className = 'pill' + (phase === 'battle' ? ' good' : '');
        pEnemy.textContent = 'Enemy assets: ' + (enemyBoard ? unsunk(enemyBoard) : FLEET.length);
        pStreak.textContent = 'Hotseat';
        return;
      }
      meTitle.textContent = 'Your floor';
      pTurn.textContent = phase === 'setup' ? 'Setup'
        : phase === 'over' ? 'Game over'
          : (turn === 'player' ? 'Your move' : 'CPU firing');
      pTurn.className = 'pill' + (phase === 'battle' && turn === 'player' ? ' good'
        : phase === 'battle' && turn === 'cpu' ? ' warn' : '');
      pEnemy.textContent = 'Targets left: ' + (enemyBoard ? unsunk(enemyBoard) : FLEET.length);
      const b = api.best();
      pStreak.textContent = 'Streak ' + streak + (b ? ' · best ' + b : '');
    }

    function updateToolbar() {
      const setup = phase === 'setup';

<script>
/* Memory Match. Flip two, keep the pairs. Always winnable, no way to get stuck. */
(function () {
  'use strict';
  const { h, shuffle } = Engine;

  const FACES = ['gridlock', 'coffee', 'snake', 'atc', 'powergrid', 'jam', 'pipes', 'reflex',
    'solitaire', 'deskgolf', 'connect4', 'sokoban', 'copycat', 'whack', 'lightsout', 'desktoss',
    'elevator', 'tetris'];

  const SIZES = {
    chill: { cols: 4, rows: 3, label: '6 pairs' },
    normal: { cols: 4, rows: 4, label: '8 pairs' },
    hard: { cols: 6, rows: 4, label: '12 pairs' },
    nightmare: { cols: 6, rows: 6, label: '18 pairs' }
  };

  function mount(root, api) {
    const bagg = Engine.bag();
    const cfg = SIZES[api.diffId] || SIZES.normal;
    const pairs = cfg.cols * cfg.rows / 2;

    let deck, first, busy, matched, moves, startedAt, done, tick, mode = '1p', turn = 1, p1 = 0, p2 = 0;

    const pMoves = api.pill('Moves: 0');
    const pPairs = api.pill('');
    const pTime = api.pill('0:00');
    const banner = h('div', { class: 'banner', style: { display: 'none' } });

    const board = h('div', { class: 'mem-board', style: { gridTemplateColumns: 'repeat(' + cfg.cols + ', 1fr)' } });
    root.append(board, banner);

    function start() {
      const chosen = shuffle(FACES).slice(0, pairs);
      deck = shuffle(chosen.concat(chosen)).map((face, i) => ({ face, i, matched: false }));
      first = null; busy = false; matched = 0; moves = 0; done = false;
      turn = 1; p1 = 0; p2 = 0;
      startedAt = Date.now();
      banner.style.display = 'none';
      render();
      sync();
      api.status(mode === '2p'
        ? 'Hotseat: take turns flipping two cards. Match a pair and you go again; miss and the turn passes. Most pairs wins.'
        : 'Flip two cards. If they match they stay up. Find every pair.');
    }

    function sync() {
      if (mode === '2p') {
        pMoves.textContent = 'P1 ' + p1 + ' – ' + p2 + ' P2';
        pPairs.textContent = (turn === 1 ? 'Player 1' : 'Player 2') + '’s turn';
      } else {
        pMoves.textContent = 'Moves: ' + moves;
        pPairs.textContent = cfg.label;
      }
    }

    function render() {
      board.replaceChildren();
      deck.forEach((card, i) => {
        const el = h('button', {
          class: 'mem-card', type: 'button',
          onclick: () => flip(i)
        },
          h('span', { class: 'mem-inner' },
            h('span', { class: 'mem-face mem-back' }),
            h('span', { class: 'mem-face mem-front', html: Icons.svg(card.face, 46) })));
        card.el = el;
        board.appendChild(el);
      });
    }

    function flip(i) {
      if (busy || done) return;
      const card = deck[i];
      if (card.matched || card === first) return;
      card.el.classList.add('flipped');
      api.sfx.blip(520);

      if (!first) { first = card; return; }

      moves++;
      sync();

      if (first.face === card.face) {
        first.matched = card.matched = true;
        first.el.classList.add('matched');
        card.el.classList.add('matched');
        first = null;
        matched++;
        if (mode === '2p') { if (turn === 1) p1++; else p2++; }
        api.sfx.good();
        sync();
        if (matched === pairs) win();
      } else {
        busy = true;
        const a = first, b = card;
        first = null;
        api.sfx.thud();
        setTimeout(() => {
          a.el.classList.remove('flipped');
          b.el.classList.remove('flipped');
          busy = false;
          if (mode === '2p') { turn = turn === 1 ? 2 : 1; sync(); }
        }, 720);
      }
    }

    function win() {
      done = true;
      if (mode === '2p') {
        api.sfx.great();
        banner.style.display = '';
        banner.replaceChildren(
          h('h3', null, p1 > p2 ? 'Player 1 wins.' : p2 > p1 ? 'Player 2 wins.' : 'Dead heat.'),
          h('p', null, 'Final pairs: Player 1 ' + p1 + ', Player 2 ' + p2 + '.'),
          h('button', { class: 'btn primary', type: 'button', onclick: start }, 'Rematch'));
        return;
      }
      const secs = Math.round((Date.now() - startedAt) / 1000);
      /* fewer moves is better; a perfect game is one move per pair */
      const best = api.load('best:' + cfg.cols + 'x' + cfg.rows, null);
      const record = best == null || moves < best;
      if (record) api.save('best:' + cfg.cols + 'x' + cfg.rows, moves);
      const wins = api.load('wins', 0) + 1;
      api.save('wins', wins);
      api.submit(wins);
      api.sfx.great();
      banner.style.display = '';
      banner.replaceChildren(
        h('h3', null, 'All matched.'),
        h('p', null, pairs + ' pairs in ' + moves + ' moves and ' + Engine.fmtTime(secs) + '. ' +
          (record ? 'Fewest moves yet on this size.' : 'Best on this size: ' + best + ' moves.')),
        h('button', { class: 'btn primary', type: 'button', onclick: start }, 'Shuffle again'));
    }

    api.button('New game', start);
    api.select('Players', [{ value: '1p', label: '1 player' }, { value: '2p', label: '2 players (hotseat)' }], '1p', (v) => { mode = v; start(); });
    pPairs.textContent = cfg.label;

    tick = setInterval(() => {
      if (!startedAt || done) return;
      pTime.textContent = Engine.fmtTime((Date.now() - startedAt) / 1000);
    }, 500);
    bagg.add(() => clearInterval(tick));

    start();
    return () => bagg.dispose();
  }

  Arcade.register({
    id: 'memory',
    title: 'Memory Match',
    emoji: 'memory',
    cat: 'brain',
    order: 26,
    blurb: 'Flip two cards, keep the pairs that match. Calm, quick, and impossible to lose. Just try to do it in fewer moves.',
    scoreLabel: 'Games won',
    tags: ['memory', 'pairs', 'concentration', 'cards'],
    how: [
      'Tap a card to flip it, then tap a second one.',
      'A matching pair stays face up. A mismatch flips both back down.',
      'Find every pair to win. You cannot lose, so the goal is to do it in as few moves as possible.',
      'Your fewest-moves record is kept for each board size.',
      'The difficulty dial only changes the board size: 6 pairs on Chill up to 18 on Nightmare.',
      'Set Players to 2 for hotseat: take turns, a matched pair lets you go again, and the most pairs wins.'
    ],
    mount
  });
})();

<script>
/* Desk Tennis. You versus a CPU that never gets up for coffee. */
(function () {
  'use strict';
  const { h, clamp, rand } = Engine;
  const W = 820, H = 520;
  const PW = 14, PH = 96, MARGIN = 26, BR = 9;
  const WIN = 7;

  function mount(root, api) {
    const bagg = Engine.bag();
    const cv = Engine.canvas(root, W, H);
    const ctx = cv.ctx;
    const keys = Engine.keys(['ArrowUp', 'ArrowDown', 'w', 's', 'W', 'S']);
    bagg.add(() => keys.dispose());

    let you, cpu, ball, youScore, cpuScore, rally, bestRally, over, serveT;

    const pScore = api.pill('0 – 0');
    const pRally = api.pill('Rally: 0');
    const banner = h('div', { class: 'banner', style: { display: 'none' } });
    root.appendChild(banner);
    api.button('Rematch', reset);
    let mode = '1p';
    api.select('Players', [
      { value: '1p', label: '1 player (vs CPU)' },
      { value: '2p', label: '2 players (hotseat)' }
    ], '1p', (v) => { mode = v; reset(); });

    let pointerY = null;
    bagg.listen(cv.el, 'pointermove', (e) => { pointerY = cv.pos(e).y; });
    bagg.listen(cv.el, 'pointerdown', (e) => { pointerY = cv.pos(e).y; });
    bagg.listen(cv.el, 'pointerleave', () => { pointerY = null; });

    function reset() {
      you = { y: H / 2 };
      cpu = { y: H / 2 };
      youScore = 0; cpuScore = 0; bestRally = 0; over = false;
      pointerY = null;
      serve(1);
      api.status(mode === '2p'
        ? 'Hotseat: left player uses W and S, right player uses Up and Down arrows. First to ' + WIN + '.'
        : 'Mouse or drag to move your bat. Up/Down or W/S work too. First to ' + WIN + ' takes it.');
      sync();
    }

    function serve(dir) {
      rally = 0;
      const ang = rand(-0.32, 0.32);
      const sp = 360;
      ball = { x: W / 2, y: H / 2, vx: dir * sp * Math.cos(ang), vy: sp * Math.sin(ang) };
      serveT = 0.8;
    }

    function hit(pad) {
      const off = clamp((ball.y - pad.y) / (PH / 2), -1, 1);
      const sp = Math.min(780, Math.hypot(ball.vx, ball.vy) * 1.06 + 14);
      const dir = ball.vx < 0 ? 1 : -1;
      const ang = off * 0.92;
      ball.vx = dir * sp * Math.cos(ang);
      ball.vy = sp * Math.sin(ang);
      rally++;
      if (rally > bestRally) bestRally = rally;
      api.sfx.blip(420 + rally * 10);
      sync();
    }

    function point(youScored) {
      if (youScored) { youScore++; api.sfx.good(); } else { cpuScore++; api.sfx.bad(); }
      sync();
      if (youScore >= WIN || cpuScore >= WIN) return end();
      serve(youScored ? 1 : -1);
    }

    function update(dt) {
      if (over) return;

      /* left bat = Player 1 (W/S; arrows and pointer also drive it in 1-player) */
      const speed = 600;
      let p1 = (keys.get('w', 'W') ? -1 : 0) + (keys.get('s', 'S') ? 1 : 0);
      if (mode === '1p') {
        p1 += (keys.get('ArrowUp') ? -1 : 0) + (keys.get('ArrowDown') ? 1 : 0);
        if (pointerY != null) you.y += clamp(pointerY - you.y, -speed * dt, speed * dt);
      }
      if (p1) you.y += p1 * speed * dt;
      you.y = clamp(you.y, PH / 2, H - PH / 2);

      if (mode === '2p') {
        /* right bat = Player 2 (arrow keys) */
        const p2 = (keys.get('ArrowUp') ? -1 : 0) + (keys.get('ArrowDown') ? 1 : 0);
        if (p2) cpu.y += p2 * speed * dt;
        cpu.y = clamp(cpu.y, PH / 2, H - PH / 2);
      } else {
        /* right bat = CPU: track the ball with difficulty-scaled speed and wobble */
        const cpuSpeed = 300 + api.dm * 120;
        const wobble = clamp(1 - api.dm * 0.4, 0.08, 0.9) * 130;
        const target = ball.vx > 0 ? ball.y + rand(-wobble, wobble) : H / 2;
        cpu.y += clamp(target - cpu.y, -cpuSpeed * dt, cpuSpeed * dt);
        cpu.y = clamp(cpu.y, PH / 2, H - PH / 2);
      }

      if (serveT > 0) { serveT -= dt; return; }

      /* substep the ball so it can never tunnel through a bat */
      const steps = Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / 7) || 1;
      const sdt = dt / steps;
      for (let s = 0; s < steps; s++) {
        ball.x += ball.vx * sdt;
        ball.y += ball.vy * sdt;
        if (ball.y < BR) { ball.y = BR; ball.vy = Math.abs(ball.vy); api.sfx.click(); }
        if (ball.y > H - BR) { ball.y = H - BR; ball.vy = -Math.abs(ball.vy); api.sfx.click(); }

        const px = MARGIN + PW;
        if (ball.vx < 0 && ball.x - BR <= px && ball.x - BR >= MARGIN - 8 &&
          Math.abs(ball.y - you.y) <= PH / 2 + BR) { ball.x = px + BR; hit(you); }

        const cx = W - MARGIN - PW;
        if (ball.vx > 0 && ball.x + BR >= cx && ball.x + BR <= W - MARGIN + 8 &&
          Math.abs(ball.y - cpu.y) <= PH / 2 + BR) { ball.x = cx - BR; hit(cpu); }

        if (ball.x < -30) return point(false);
        if (ball.x > W + 30) return point(true);
      }
    }

    function end() {
      over = true;
      const youWon = youScore > cpuScore;
      const res = api.submit(bestRally);
      (youWon ? api.sfx.great : api.sfx.bad)();
      banner.style.display = '';
      banner.replaceChildren(
        h('h3', null, mode === '2p'
          ? (youWon ? 'Left player wins.' : 'Right player wins.')
          : (youWon ? 'Game. You win.' : 'CPU takes it.')),
        h('p', null, 'Final ' + youScore + '–' + cpuScore + '. Longest rally ' + bestRally + ' hits.' +
          (res.isRecord ? ' New rally record!' : res.isFirst ? '' : ' Best rally: ' + res.best + '.')),
        h('button', { class: 'btn primary', type: 'button', onclick: reset }, 'Rematch'));
    }

    function sync() {
      pScore.textContent = youScore + ' – ' + cpuScore;
      pRally.textContent = 'Rally: ' + rally;
    }

    function draw() {
      ctx.fillStyle = '#0b1020';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,255,255,.16)';
      for (let y = 10; y < H; y += 30) ctx.fillRect(W / 2 - 3, y, 6, 16);

      ctx.fillStyle = 'rgba(255,255,255,.22)';
      ctx.font = 'bold 66px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(youScore, W / 2 - 78, 74);
      ctx.fillText(cpuScore, W / 2 + 78, 74);
      ctx.textAlign = 'left';

      ctx.fillStyle = '#dfe6f5';
      ctx.fillRect(MARGIN, you.y - PH / 2, PW, PH);
      ctx.fillStyle = '#ffd05a';
      ctx.fillRect(W - MARGIN - PW, cpu.y - PH / 2, PW, PH);

      ctx.fillStyle = '#fff';
      ctx.fillRect(ball.x - BR, ball.y - BR, BR * 2, BR * 2);

      if (serveT > 0 && !over) {
        ctx.fillStyle = 'rgba(255,255,255,.5)';
        ctx.font = 'bold 15px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('serving…', W / 2, H - 40);
        ctx.textAlign = 'left';
      }
    }

    reset();
    bagg.add(Engine.loop((dt) => { update(dt); draw(); }));
    return () => bagg.dispose();
  }

  Arcade.register({
    id: 'pong',
    title: 'Desk Tennis',
    emoji: 'pong',
    cat: 'action',
    order: 29,
    blurb: 'The original video game, more or less. You, a CPU, and a square that will not stop. Your longest rally is the score worth chasing.',
    scoreLabel: 'Longest rally',
    tags: ['pong', 'paddle', 'ball', 'vs-cpu'],
    how: [
      'Move your bat with the mouse, a drag, or Up/Down and W/S.',
      'Where the ball strikes your bat bends its angle — hit near the edge to fire it back sharp.',
      'First side to seven points wins the match.',
      'Your recorded score is the longest single rally you keep alive.',
      'Harder settings give the CPU a faster, steadier bat.',
      'Set Players to 2 for hotseat on one keyboard: left bat is W/S, right bat is the Up/Down arrows.'
    ],
    mount
  });
})();

<script>
(function () {
  'use strict';
  const { clamp, rand, pick } = Engine;

  function mount(root, api) {
    const bagg = Engine.bag();
    const W = 760, H = 560;
    const cv = Engine.canvas(root, W, H, { maxHeight: '78vh' });
    const ctx = cv.ctx;

    const COLS = 9, ROWS = 5, TOTAL = COLS * ROWS;
    const invW = 38, invH = 24, colStep = 60, rowStep = 40;
    const x0 = Math.round((W - ((COLS - 1) * colStep + invW)) / 2);
    const rowColors = ['#e8402a', '#6f3fa8', '#00a6b4', '#6fcf2f', '#ffcb1f'];
    const margin = 16;
    const shipY = H - 40, shipW = 46, shipH = 16;
    const breachLine = H - 74;

    const startLives = api.diffId === 'nightmare' ? 2 : (api.diffId === 'chill' ? 4 : 3);
    const maxShots = api.diffId === 'chill' ? 4 : (api.hard ? 2 : 3);
    const bunkerCount = api.hard ? 3 : 4;
    const speedDm = 0.9 + (api.dm - 1) * 0.45;

    const scorePill = api.pill('Score 0');
    const livesPill = api.pill('Lives ' + startLives);
    const wavePill = api.pill('Wave 1');
    api.status('Arrow keys or A/D to strafe, Space to fire. Touch: D-pad, FIRE in the center.');

    const keys = Engine.keys(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'Space', 'KeyA', 'KeyD']);
    bagg.add(keys.dispose);

    let inv, dir, fx, fy, shots, bombs, bunkers, ufo, ufoTimer;
    let ship, aimX, lives, score, wave, fireCd, bombCd, state, breakT, respawnT, overCd, fireQueued, result;

    function buildBunkers() {
      bunkers = [];
      const cols = 12, rows = 8, cell = 5;
      const bw = cols * cell;
      const by = H - 150;
      const gap = W / (bunkerCount + 1);
      for (let i = 0; i < bunkerCount; i++) {
        const bx = Math.round(gap * (i + 1) - bw / 2);
        const grid = [];
        for (let r = 0; r < rows; r++) {
          const rowArr = [];
          for (let c = 0; c < cols; c++) rowArr.push(true);
          grid.push(rowArr);
        }
        // round the top corners
        grid[0][0] = grid[0][1] = grid[0][cols - 1] = grid[0][cols - 2] = false;
        grid[1][0] = grid[1][cols - 1] = false;
        // carve a doorway at the bottom center
        for (let r = rows - 3; r < rows; r++) {
          for (let c = 4; c < 8; c++) grid[r][c] = false;
        }
        bunkers.push({ x: bx, y: by, cols: cols, rows: rows, cell: cell, grid: grid });
      }
    }

    function spawnWave(n) {
      inv = [];
      const startY = 60 + Math.min(6, n - 1) * 14;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          inv.push({ col: c, row: r, alive: true, color: rowColors[r], points: (ROWS - r) * 10 });
        }
      }
      dir = 1; fx = 0; fy = startY;
      shots = []; bombs = []; ufo = null;
      ufoTimer = rand(8, 16);
      bombCd = rand(0.6, 1.4);
    }

    function invX(iv) { return x0 + iv.col * colStep + fx; }
    function invY(iv) { return iv.row * rowStep + fy; }

    function reset() {
      lives = startLives; score = 0; wave = 1;
      ship = { x: (W - shipW) / 2 };
      aimX = ship.x;
      fireCd = 0; respawnT = 0; overCd = 0; fireQueued = false;
      state = 'play'; breakT = 0; result = null;
      buildBunkers();
      spawnWave(1);
      updateHud();
    }

    function updateHud() {
      scorePill.textContent = 'Score ' + score;
      livesPill.textContent = 'Lives ' + Math.max(0, lives);
      wavePill.textContent = 'Wave ' + wave;
    }

    function aliveList() { return inv.filter(function (v) { return v.alive; }); }

    function fire() {
      shots.push({ x: ship.x + shipW / 2, y: shipY - 6 });
      fireCd = 0.30;
      api.sfx.tone({ freq: 660, to: 900, dur: 0.08, type: 'square', vol: 0.5 });
    }

    function hitBunker(px, py) {
      for (let i = 0; i < bunkers.length; i++) {
        const b = bunkers[i];
        if (px < b.x || px >= b.x + b.cols * b.cell) continue;
        if (py < b.y || py >= b.y + b.rows * b.cell) continue;
        const ci = Math.floor((px - b.x) / b.cell);
        const ri = Math.floor((py - b.y) / b.cell);
        if (!b.grid[ri] || !b.grid[ri][ci]) continue;
        const rad = 1;
        for (let dy = -rad; dy <= rad; dy++) {
          for (let dx = -rad; dx <= rad; dx++) {
            const nr = ri + dy, nc = ci + dx;
            if (b.grid[nr] && b.grid[nr][nc] && (Math.abs(dx) + Math.abs(dy) <= rad || Math.random() < 0.4)) {
              b.grid[nr][nc] = false;
            }
          }
        }
        return true;
      }
      return false;
    }

    function loseLife(reason) {
      lives--;
      updateHud();
      api.sfx.bad();
      bombs = [];
      if (lives <= 0) {
        gameOver();
      } else {
        respawnT = 1.1;
        if (reason === 'breach') fy = 60;
        ship.x = (W - shipW) / 2;
        aimX = ship.x;
      }
    }

    function gameOver() {
      state = 'over';
      overCd = 0.7;
      api.sfx.thud();
      api.sfx.boom();
      result = api.submit(score);
    }

    function rectHit(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    }

    function update(dt) {
      if (state === 'over') {
        if (overCd > 0) overCd -= dt;
        return;
      }
      if (state === 'break') {
        breakT -= dt;
        if (breakT <= 0) {
          wave++;
          updateHud();
          spawnWave(wave);
          state = 'play';
        }
        return;
      }

      const spd = 300;
      const left = keys.get('ArrowLeft', 'a', 'A');
      const right = keys.get('ArrowRight', 'd', 'D');
      if (left || right) {
        ship.x += (right ? 1 : 0) * spd * dt - (left ? 1 : 0) * spd * dt;
        ship.x = clamp(ship.x, margin, W - margin - shipW);
        aimX = ship.x;
      } else {
        const d = clamp(aimX - ship.x, -spd * dt, spd * dt);
        ship.x = clamp(ship.x + d, margin, W - margin - shipW);
      }
      aimX = clamp(aimX, margin, W - margin - shipW);

      if (respawnT > 0) respawnT -= dt;
      fireCd -= dt;
      const wantFire = keys.get('Space', ' ') || fireQueued;
      if (wantFire && fireCd <= 0 && shots.length < maxShots) {
        fire();
        fireQueued = false;
      }

      // player shots
      for (let i = shots.length - 1; i >= 0; i--) {
        const s = shots[i];
        s.y -= 470 * dt;
        if (s.y < -12) { shots.splice(i, 1); continue; }
        if (hitBunker(s.x, s.y)) { shots.splice(i, 1); continue; }
        if (ufo && rectHit(s.x - 2, s.y, 4, 10, ufo.x, ufo.y, ufo.w, ufo.h)) {
          score += ufo.points; updateHud(); api.sfx.great();
          ufo = null; shots.splice(i, 1); continue;
        }
        const list = aliveList();
        let done = false;
        for (let j = 0; j < list.length; j++) {
          const v = list[j];
          const vx = invX(v), vy = invY(v);
          if (rectHit(s.x - 2, s.y, 4, 10, vx, vy, invW, invH)) {
            v.alive = false;
            score += v.points; updateHud();
            api.sfx.blip(700 + v.row * 60);
            shots.splice(i, 1); done = true; break;
          }
        }
        if (done) continue;
      }

      // wave cleared?
      const alive = aliveList();
      if (alive.length === 0) {
        state = 'break'; breakT = 1.2;
        api.sfx.great();
        return;
      }

      // march the formation
      const frac = alive.length / TOTAL;
      const waveFactor = 1 + (wave - 1) * 0.1;
      const speed = (22 + (1 - frac) * 95) * speedDm * waveFactor;
      fx += dir * speed * dt;
      let minC = COLS, maxC = 0, maxR = 0;
      for (let k = 0; k < alive.length; k++) {
        if (alive[k].col < minC) minC = alive[k].col;
        if (alive[k].col > maxC) maxC = alive[k].col;
        if (alive[k].row > maxR) maxR = alive[k].row;
      }
      const groupLeft = x0 + minC * colStep + fx;
      const groupRight = x0 + maxC * colStep + invW + fx;
      if (dir > 0 && groupRight >= W - margin) { dir = -1; fy += 16; }
      else if (dir < 0 && groupLeft <= margin) { dir = 1; fy += 16; }

      // breach at the bottom
      const lowest = maxR * rowStep + fy + invH;
      if (lowest >= breachLine) {
        loseLife('breach');
        if (state === 'over') return;
      }

      // invader bombs, dropped from the lowest of a random column
      bombCd -= dt;
      const maxBombs = (api.hard ? 5 : 3) + (wave - 1);
      if (bombCd <= 0 && bombs.length < maxBombs) {
        const byCol = {};
        for (let k = 0; k < alive.length; k++) {
          const v = alive[k];
          if (!byCol[v.col] || v.row > byCol[v.col].row) byCol[v.col] = v;
        }
        const shooters = Object.keys(byCol).map(function (kk) { return byCol[kk]; });
        const shooter = pick(shooters);
        bombs.push({ x: invX(shooter) + invW / 2, y: invY(shooter) + invH });
        bombCd = rand(0.7, 1.7) / (speedDm * waveFactor);
      }
      const bombSpd = 210 * (0.85 + 0.15 * api.dm);
      for (let i = bombs.length - 1; i >= 0; i--) {
        const b = bombs[i];
        b.y += bombSpd * dt;
        if (b.y > H) { bombs.splice(i, 1); continue; }
        if (hitBunker(b.x, b.y)) { bombs.splice(i, 1); continue; }
        if (respawnT <= 0 && rectHit(b.x - 2, b.y, 4, 10, ship.x, shipY, shipW, shipH)) {
          bombs.splice(i, 1);
          loseLife('hit');
          if (state === 'over') return;
        }
      }

      // urgent bonus invader
      if (ufo) {
        ufo.x += ufo.vx * dt;
        if (ufo.x > W + 60 || ufo.x < -60) ufo = null;
      } else {
        ufoTimer -= dt;
        if (ufoTimer <= 0 && alive.length > 2) {
          const fromLeft = Math.random() < 0.5;
          ufo = {
            x: fromLeft ? -50 : W + 50,
            y: 30, w: 60, h: 18,
            vx: (fromLeft ? 1 : -1) * 130,
            points: pick([50, 100, 150, 200])
          };
          ufoTimer = rand(12, 22);
        }
      }
    }

    function drawInv(ix, iy, color) {
      ctx.fillStyle = color;
      ctx.fillRect(ix, iy, invW, invH);
      ctx.strokeStyle = '#1d1722';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(ix, iy, invW, invH);
      ctx.beginPath();
      ctx.moveTo(ix, iy);
      ctx.lineTo(ix + invW / 2, iy + invH * 0.55);
      ctx.lineTo(ix + invW, iy);
      ctx.stroke();
    }

    function drawShip() {
      ctx.fillStyle = '#00a6b4';
      ctx.fillRect(ship.x, shipY + 4, shipW, shipH - 4);
      ctx.fillRect(ship.x + shipW / 2 - 3, shipY - 6, 6, 10);
      ctx.strokeStyle = '#1d1722';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(ship.x, shipY + 4, shipW, shipH - 4);
    }

    function draw() {
      cv.clear('#0c1119');
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      for (let i = 0; i < 40; i++) {
        const sx = (i * 97 + 13) % W;
        const sy = (i * 53 + 29) % (H - 120);
        ctx.fillRect(sx, sy, 2, 2);
      }
      for (let i = 0; i < bunkers.length; i++) {
        const b = bunkers[i];
        ctx.fillStyle = '#6fcf2f';
        for (let r = 0; r < b.rows; r++) {
          for (let c = 0; c < b.cols; c++) {
            if (b.grid[r][c]) ctx.fillRect(b.x + c * b.cell, b.y + r * b.cell, b.cell, b.cell);
          }
        }
      }
      const alive = aliveList();
      for (let i = 0; i < alive.length; i++) {
        drawInv(invX(alive[i]), invY(alive[i]), alive[i].color);
      }
      if (ufo) {
        ctx.fillStyle = '#ff2d87';
        ctx.fillRect(ufo.x, ufo.y, ufo.w, ufo.h);
        ctx.strokeStyle = '#1d1722';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(ufo.x, ufo.y, ufo.w, ufo.h);
        ctx.fillStyle = '#fffdf3';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('URGENT', ufo.x + ufo.w / 2, ufo.y + ufo.h / 2 + 1);
      }
      ctx.fillStyle = '#ffcb1f';
      for (let i = 0; i < shots.length; i++) ctx.fillRect(shots[i].x - 2, shots[i].y, 4, 10);
      ctx.fillStyle = '#e8402a';
      for (let i = 0; i < bombs.length; i++) ctx.fillRect(bombs[i].x - 2, bombs[i].y, 4, 10);

      if (!(respawnT > 0 && Math.floor(respawnT * 10) % 2 === 0)) drawShip();

      if (state === 'over') {
        ctx.fillStyle = 'rgba(12,17,25,0.8)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ffcb1f';
        ctx.font = 'bold 44px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('GAME OVER', W / 2, H / 2 - 40);
        ctx.fillStyle = '#fffdf3';
        ctx.font = 'bold 20px monospace';
        ctx.fillText('Final Score ' + score, W / 2, H / 2 + 4);
        if (result && result.isRecord) {
          ctx.fillStyle = '#6fcf2f';
          ctx.fillText('NEW RECORD', W / 2, H / 2 + 34);
        }
        ctx.fillStyle = '#cfc6ae';
        ctx.font = '15px monospace';
        ctx.fillText('Press Space or New Game to retry', W / 2, H / 2 + 70);
      }
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
    }

    Engine.dpad(root, function (d) {
      if (state === 'over') {
        if (d === 'action' && overCd <= 0) reset();
        return;
      }
      if (d === 'left') aimX = clamp(aimX - 70, margin, W - margin - shipW);
      else if (d === 'right') aimX = clamp(aimX + 70, margin, W - margin - shipW);
      else if (d === 'action') fireQueued = true;
    }, { center: 'FIRE', class: 'touch-only' });

    bagg.add(Engine.onKey(function (e) {
      if (state === 'over' && overCd <= 0 && (e.code === 'Space' || e.key === ' ' || e.code === 'Enter')) {
        reset();
        return true;
      }
      return false;
    }));

    api.button('New Game', function () { reset(); });

    reset();

    bagg.add(Engine.loop(function (dt) {
      update(dt);
      draw();
    }));

    return function () { bagg.dispose(); };
  }

  Arcade.register({
    id: 'invaders',
    title: 'Inbox Invaders',
    emoji: 'invaders',
    cat: 'action',
    order: 30,
    blurb: 'The unread count is descending in formation. Clear it before it lands on your desk.',
    scoreLabel: 'Score',
    tags: ['shooter', 'arcade', 'reflex'],
    how: [
      'Goal: shoot every email invader before the formation reaches the bottom.',
      'Move with Left/Right or A/D and fire with Space; on touch use the D-pad and the center FIRE button.',
      'The fewer invaders left, the faster they march and drop. The Out-of-Office bunkers absorb fire but erode away.',
      'Score by shooting invaders; the URGENT banner sweeping the top is worth a fat bonus.',
      'You get three lives and lose one if an invader lands or a bomb hits you; a cleared wave respawns faster and lower.',
      'Harder settings mean quicker invaders, more bombs, and fewer bunkers; nightmare starts with fewer lives.'
    ],
    usesLetters: true,
    mount: mount
  });
})();
