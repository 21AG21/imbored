<script>
/* Company Car — a pseudo-3D arcade racer. A proper curving, cresting road drawn
 * the OutRun way (projected road segments), traffic to weave through, twenty
 * procedurally-built stages you can jump between freely, and a clock. Keyboard
 * or on-screen buttons. */
(function () {
  'use strict';
  const { h, clamp } = Engine;
  const W = 640, H = 400;

  const SEG = 200;                 // segment length (world units)
  const RUMBLE = 3;               // segments per rumble stripe
  const ROADW = 2000;             // half road width
  const LANES = 3;
  const DRAW = 240;               // segments drawn ahead
  const CAMH = 1000;              // camera height
  const FOV = 100;
  const CAMD = 1 / Math.tan((FOV / 2) * Math.PI / 180);
  const MAXSPD = SEG * 60;        // top speed (units/sec) — one segment per frame at 60fps * 60
  const ACCEL = MAXSPD / 5;
  const BRAKE = -MAXSPD / 2.5;
  const DECEL = -MAXSPD / 6;
  const OFFDECEL = -MAXSPD / 2;
  const CENTRI = 0.32;
  const LEVELS = 20;

  const COL = {
    sky: ['#4a90d9', '#7ec0ee'],
    tree: '#1c5a2a',
    grassL: '#3a9d3a', grassD: '#329033',
    roadL: '#6b6b6b', roadD: '#666666',
    rumbleL: '#e8402a', rumbleD: '#f4f4f4',
    lane: '#f4f4f4'
  };

  function ease(a, b, p) { return a + (b - a) * (-Math.cos(p * Math.PI) / 2 + 0.5); }
  function easeIn(a, b, p) { return a + (b - a) * p * p; }
  function easeOut(a, b, p) { return a + (b - a) * (1 - (1 - p) * (1 - p)); }

  function mount(root, api) {
    const bagg = Engine.bag();
    const cv = Engine.canvas(root, W, H, { maxHeight: '62vh' });
    const ctx = cv.ctx;
    const keys = Engine.keys(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 's', 'a', 'd', 'W', 'S', 'A', 'D', ' ']);

    let segs, trackLen, cars, level, pos, playerX, speed, t, over, won, started;
    level = clamp(api.load('level', 1), 1, LEVELS);

    const pLevel = api.pill('Stage 1');
    const pSpeed = api.pill('0 mph');
    const pTime = api.pill('0.0s');
    const pBest = api.pill('');
    const banner = h('div', { class: 'banner', style: { display: 'none' } });
    root.appendChild(banner);

    api.select('Stage', Array.from({ length: LEVELS }, (_, i) => ({ value: String(i + 1), label: 'Stage ' + (i + 1) })), String(level), (v) => { level = +v; api.save('level', level); build(); });
    api.button('Restart stage', build);

    /* touch controls */
    const pad = h('div', { class: 'racer-pad' });
    bagg.add(() => keys.dispose());
    const mk = (label, code) => { const b = h('button', { class: 'racer-btn', type: 'button' }, label); const set = (v) => { keys.state[code] = v; }; bagg.listen(b, 'pointerdown', (e) => { e.preventDefault(); set(true); }); bagg.listen(b, 'pointerup', () => set(false)); bagg.listen(b, 'pointerleave', () => set(false)); bagg.listen(b, 'pointercancel', () => set(false)); return b; };
    pad.append(mk('◀', 'ArrowLeft'), mk('GAS', 'ArrowUp'), mk('BRK', 'ArrowDown'), mk('▶', 'ArrowRight'));
    root.appendChild(pad);

    /* ---- track builder ---- */
    function lastY() { return segs.length ? segs[segs.length - 1].p2.wy : 0; }
    function addSeg(curve, y) {
      const n = segs.length, y1 = lastY();
      segs.push({
        i: n, curve,
        p1: { wx: 0, wy: y1, wz: n * SEG }, p2: { wx: 0, wy: y, wz: (n + 1) * SEG },
        color: Math.floor(n / RUMBLE) % 2 ? 'd' : 'l', cars: []
      });
    }
    function addRoad(enter, hold, leave, curve, y) {
      const startY = lastY(), endY = startY + y * SEG;
      const total = enter + hold + leave;
      for (let n = 0; n < enter; n++) addSeg(easeIn(0, curve, n / enter), easeInOutY(startY, endY, n / total));
      for (let n = 0; n < hold; n++) addSeg(curve, easeInOutY(startY, endY, (enter + n) / total));
      for (let n = 0; n < leave; n++) addSeg(easeInOut(curve, 0, n / leave), easeInOutY(startY, endY, (enter + hold + n) / total));
    }
    function easeInOut(a, b, p) { return ease(a, b, p); }
    function easeInOutY(a, b, p) { return ease(a, b, p); }

    /* seeded pseudo-random so each stage is fixed but distinct */
    function build() {
      const rng = Engine.rng('racer:' + level);
      segs = []; cars = [];
      const diff = level / LEVELS;
      const sections = 8 + level;
      addRoad(30, 40, 30, 0, 0);                 // start straight
      for (let s = 0; s < sections; s++) {
        const len = [30, 50, 40];
        const curve = (rng() < 0.5 ? -1 : 1) * (2 + rng() * 4) * (0.4 + diff);
        const hill = (rng() - 0.5) * (20 + diff * 60);
        if (rng() < 0.7) addRoad(len[0], len[1] + (rng() * 40 | 0), len[2], curve, hill);
        else addRoad(20, 30, 20, 0, hill);        // straight-ish with a crest
      }
      addRoad(30, 60, 30, 0, 0);                  // finish straight
      trackLen = segs.length * SEG;
      /* traffic: more and denser on later stages */
      const nCars = 8 + level * 3;
      for (let c = 0; c < nCars; c++) {
        const i = 40 + Math.floor(rng() * (segs.length - 80));
        const lane = (rng() * LANES | 0) - 1;   // -1,0,1
        segs[i].cars.push({ x: lane * 0.55, col: ['#ffcb1f', '#e8402a', '#6f3fa8', '#00a6b4'][rng() * 4 | 0], spd: (0.35 + rng() * 0.25) });
      }
      pos = 0; playerX = 0; speed = 0; t = 0; over = false; won = false; started = false;
      banner.style.display = 'none';
      pLevel.textContent = 'Stage ' + level;
      const b = api.load('best:' + level, null);
      pBest.textContent = b == null ? 'no time' : 'best ' + b.toFixed(1) + 's';
      api.status('Stage ' + level + ' of ' + LEVELS + '. Hold gas, steer through the traffic, reach the finish. Arrow keys or the buttons; you can jump to any stage from the menu.');
    }

    function segAt(z) {
      if (!segs || !segs.length) return null;
      let i = Math.floor(z / SEG) % segs.length;
      if (i < 0 || !isFinite(i)) i = 0;
      return segs[i] || segs[0];
    }

    function update(dt) {
      if (over || !segs) return;
      const cur = segAt(pos);
      if (!cur) return;
      const spdPct = speed / MAXSPD;
      const dir = (keys.get('ArrowLeft') || keys.get('a') || keys.get('A')) ? -1 : (keys.get('ArrowRight') || keys.get('d') || keys.get('D')) ? 1 : 0;
      if (dir) started = true;
      playerX += dir * dt * 2.4 * spdPct;
      /* centrifugal push on curves */
      playerX -= dt * spdPct * cur.curve * CENTRI;

      const gas = keys.get('ArrowUp') || keys.get('w') || keys.get('W') || keys.get(' ');
      const brk = keys.get('ArrowDown') || keys.get('s') || keys.get('S');
      if (gas) { speed += ACCEL * dt; started = true; }
      else if (brk) speed += BRAKE * dt;
      else speed += DECEL * dt;
      if ((playerX < -1 || playerX > 1) && speed > MAXSPD / 4) speed += OFFDECEL * dt;   // off-road drag
      speed = clamp(speed, 0, MAXSPD);
      playerX = clamp(playerX, -2.4, 2.4);

      /* traffic collision */
      for (const car of cur.cars) {
        if (speed > 0 && Math.abs(playerX - car.x) < 0.5) { speed = MAXSPD * 0.18; playerX += (playerX > car.x ? 1 : -1) * dt * 2; api.sfx.thud(); }
      }

      pos += speed * dt;
      if (started) t += dt;
      if (pos >= trackLen) return finish();
    }

    function finish() {
      over = true; won = true; speed = 0;
      const prev = api.load('best:' + level, null);
      const rec = prev == null || t < prev;
      if (rec) api.save('best:' + level, +t.toFixed(1));
      const done = api.load('cleared', 0) + 1; api.save('cleared', done); api.submit(done);
      api.sfx.great();
      banner.style.display = '';
      banner.replaceChildren(
        h('h3', null, 'Stage ' + level + ' cleared'),
        h('p', null, 'Time ' + t.toFixed(1) + 's' + (rec ? ' — new best!' : prev != null ? ' (best ' + prev.toFixed(1) + 's)' : '') + '.'),
        h('div', { class: 'racer-endbtns' },
          level < LEVELS ? h('button', { class: 'btn primary', type: 'button', onclick: () => { level++; api.save('level', level); build(); } }, 'Next stage →') : h('span', null, 'You cleared every stage!'),
          h('button', { class: 'btn', type: 'button', onclick: build }, 'Replay')));
    }

    /* ---- rendering ---- */
    function project(p, camX, camY, camZ) {
      p.cx = p.wx - camX; p.cy = p.wy - camY; p.cz = p.wz - camZ;
      p.scale = CAMD / Math.max(1, p.cz);
      p.sx = Math.round(W / 2 + p.scale * p.cx * W / 2);
      p.sy = Math.round(H / 2 - p.scale * p.cy * H / 2);
      p.sw = Math.round(p.scale * ROADW * W / 2);
    }
    function poly(x1, y1, w1, x2, y2, w2, color) {
      ctx.fillStyle = color; ctx.beginPath();
      ctx.moveTo(x1 - w1, y1); ctx.lineTo(x1 + w1, y1); ctx.lineTo(x2 + w2, y2); ctx.lineTo(x2 - w2, y2);
      ctx.closePath(); ctx.fill();
    }

    function draw() {
      /* sky + ground */
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, COL.sky[0]); g.addColorStop(1, COL.sky[1]);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

      const base = segAt(pos), basePct = (pos % SEG) / SEG;
      let x = 0, dx = -(base.curve * basePct);
      let maxy = H;
      const camY = CAMH + base.p1.wy;

      for (let n = 0; n < DRAW; n++) {
        const seg = segs[(base.i + n) % segs.length];
        const looped = seg.i < base.i;
        const camZ = pos - (looped ? trackLen : 0);
        project(seg.p1, playerX * ROADW - x, camY, camZ);
        project(seg.p2, playerX * ROADW - x - dx, camY, camZ);
        x += dx; dx += seg.curve;
        if (seg.p1.cz <= CAMD || seg.p2.sy >= seg.p1.sy || seg.p2.sy >= maxy) continue;
        const p1 = seg.p1, p2 = seg.p2, dark = seg.color === 'd';
        /* grass band */
        poly(W / 2, p1.sy, W / 2, W / 2, p2.sy, W / 2, dark ? COL.grassD : COL.grassL);
        /* rumble + road */
        const r1 = p1.sw * 1.18, r2 = p2.sw * 1.18;
        poly(p1.sx, p1.sy, r1, p2.sx, p2.sy, r2, dark ? COL.rumbleD : COL.rumbleL);
        poly(p1.sx, p1.sy, p1.sw, p2.sx, p2.sy, p2.sw, dark ? COL.roadD : COL.roadL);
        /* centre lane dashes */
        if (!dark) {
          const lw1 = p1.sw * 0.03, lw2 = p2.sw * 0.03;
          for (let l = 1; l < LANES; l++) {
            const off = (l / LANES) * 2 - 1;
            poly(p1.sx + p1.sw * off, p1.sy, lw1, p2.sx + p2.sw * off, p2.sy, lw2, COL.lane);
          }
        }
        maxy = p2.sy;
        seg._p1 = { sx: p1.sx, sy: p1.sy, sw: p1.sw };   // stash for sprite pass
      }

      /* traffic sprites, back to front */
      for (let n = DRAW - 1; n >= 0; n--) {
        const seg = segs[(base.i + n) % segs.length];
        if (!seg._p1 || !seg.cars.length) continue;
        for (const car of seg.cars) {
          const sp = seg._p1, cw = sp.sw * 0.9, cx = sp.sx + sp.sw * car.x, cy = sp.sy;
          if (cw < 2) continue;
          ctx.fillStyle = car.col;
          ctx.fillRect(cx - cw * 0.28, cy - cw * 0.4, cw * 0.56, cw * 0.34);
          ctx.fillStyle = '#111';
          ctx.fillRect(cx - cw * 0.28, cy - cw * 0.08, cw * 0.56, cw * 0.08);
        }
        seg._p1 = null;
      }

      /* player car */
      const pcW = 120, pcH = 60, pcx = W / 2 + playerX * 40 * 0, pcy = H - 68;
      const bounce = speed > 0 ? Math.sin(t * 30) * 1.5 * (speed / MAXSPD) : 0;
      drawCar(W / 2, pcy + bounce, pcW, pcH, '#e8402a', (keys.get('ArrowLeft') || keys.get('a')) ? -1 : (keys.get('ArrowRight') || keys.get('d')) ? 1 : 0);
      void pcx; void pcH;

      /* HUD */
      pSpeed.textContent = Math.round(speed / MAXSPD * 140) + ' mph';
      pTime.textContent = t.toFixed(1) + 's';
      /* progress bar */
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(10, 10, W - 20, 8);
      ctx.fillStyle = '#6fcf2f'; ctx.fillRect(10, 10, (W - 20) * clamp(pos / trackLen, 0, 1), 8);
    }

    function drawCar(cx, cy, w, hh, col, lean) {
      ctx.save(); ctx.translate(cx + lean * 6, cy);
      ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(0, hh * 0.42, w * 0.5, hh * 0.16, 0, 0, 7); ctx.fill();
      ctx.fillStyle = col; ctx.fillRect(-w / 2, -hh * 0.2, w, hh * 0.55);
      ctx.fillStyle = '#8fd0e8'; ctx.fillRect(-w * 0.32, -hh * 0.34, w * 0.64, hh * 0.2);
      ctx.fillStyle = '#111'; ctx.fillRect(-w / 2, hh * 0.28, w * 0.22, hh * 0.2); ctx.fillRect(w / 2 - w * 0.22, hh * 0.28, w * 0.22, hh * 0.2);
      ctx.fillStyle = '#ffcb1f'; ctx.fillRect(-w / 2 + 4, -hh * 0.16, 8, 6); ctx.fillRect(w / 2 - 12, -hh * 0.16, 8, 6);
      ctx.restore();
    }

    bagg.add(Engine.onKey((e) => { if ((e.key === 'r' || e.key === 'R') && over) { build(); return true; } }));

    /* ---- test seam ---- */
    window.__racer = {
      build(lv) { if (lv != null) level = lv; build(); },
      stats: () => ({ level, pos, trackLen, speed, playerX, t, over, won, segs: segs.length, cars: segs.reduce((a, s) => a + s.cars.length, 0) }),
      hold(code, v) { keys.state[code] = v; },
      tick(sec) { let s = sec; while (s > 0) { const dt = Math.min(1 / 60, s); update(dt); s -= dt; } },
      setPos(z) { pos = z; }
    };
    bagg.add(() => { if (window.__racer) delete window.__racer; });

    build();
    bagg.add(Engine.loop((dt) => { update(Math.min(0.05, dt)); draw(); }));
    return () => bagg.dispose();
  }

  Arcade.register({
    id: 'racer',
    title: 'Company Car',
    emoji: 'car',
    cat: 'action',
    order: 20,
    blurb: 'A proper arcade racer hiding in a browser tab — a curving, cresting pseudo-3D highway, traffic to thread, and twenty stages that get twistier and busier. Floor it, keep it on the tarmac, and beat the clock. Jump to any stage whenever you like.',
    scoreLabel: 'Stages cleared',
    tags: ['racing', 'driving', 'arcade', '3d'],
    how: [
      'Hold gas to accelerate, brake to slow, and steer left/right to stay on the road — arrow keys, WASD, or the on-screen buttons on touch.',
      'The road bends and rolls over hills. On a curve the car drifts to the outside, so steer into the bend to hold your line; drift onto the grass and you bog down.',
      'Traffic is scattered down every stage. Clip a car and you lose almost all your speed, so pick your lane early.',
      'Reach the finish line to clear the stage and bank your time. Twenty stages get longer, curvier and more crowded as you go.',
      'Use the Stage menu to jump straight to any stage whenever you want — no need to grind through in order. Your best time per stage is saved.'
    ],
    mount
  });
})();

</script>
<script>
/* The Obby — a Roblox-style obstacle course. Run and jump across platforms,
 * dodge lava and spikes, touch the checkpoints so a fall only costs a little,
 * and reach the flag. Twenty stages that ramp up; jump to any of them. */
(function () {
  'use strict';
  const { h, clamp } = Engine;
  const W = 720, H = 420;
  const GRAV = 2000, JUMP = 660, MOVE = 300, PW = 22, PH = 30;
  const LEVELS = 20;
  const PLAT_COLS = ['#e8402a', '#ffcb1f', '#6fcf2f', '#00a6b4', '#6f3fa8', '#ff2d87'];

  function mount(root, api) {
    const bagg = Engine.bag();
    const cv = Engine.canvas(root, W, H, { maxHeight: '58vh' });
    const ctx = cv.ctx;
    const keys = Engine.keys(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'a', 'd', 'w', 'A', 'D', 'W', ' ']);
    bagg.add(() => keys.dispose());

    let plats, hazards, checks, finish, worldEnd, level, px, py, vx, vy, grounded, spawnIdx, deaths, t, over, coyote, jumpBuf;
    level = clamp(api.load('level', 1), 1, LEVELS);

    const pLevel = api.pill('Stage 1');
    const pDeaths = api.pill('Falls: 0');
    const pTime = api.pill('0.0s');
    const banner = h('div', { class: 'banner', style: { display: 'none' } });
    root.appendChild(banner);

    api.select('Stage', Array.from({ length: LEVELS }, (_, i) => ({ value: String(i + 1), label: 'Stage ' + (i + 1) })), String(level), (v) => { level = +v; api.save('level', level); build(); });
    api.button('Restart stage', build);

    const pad = h('div', { class: 'racer-pad' });
    const mk = (label, code) => { const b = h('button', { class: 'racer-btn', type: 'button' }, label); const set = (v) => { keys.state[code] = v; }; bagg.listen(b, 'pointerdown', (e) => { e.preventDefault(); set(true); }); bagg.listen(b, 'pointerup', () => set(false)); bagg.listen(b, 'pointerleave', () => set(false)); bagg.listen(b, 'pointercancel', () => set(false)); return b; };
    pad.append(mk('◀', 'ArrowLeft'), mk('JUMP', ' '), mk('▶', 'ArrowRight'));
    root.appendChild(pad);

    function build() {
      const rng = Engine.rng('obby:' + level);
      plats = []; hazards = []; checks = [];
      const diff = (level - 1) / (LEVELS - 1);
      let x = 0, y = H - 70;
      plats.push({ x: 0, y, w: 220, h: H - y, c: 0 });
      checks.push({ x: 60, y: y - PH, i: 0 });
      let cx = 220, ci = 1;
      const count = 12 + level * 2;
      for (let i = 0; i < count; i++) {
        const gap = 55 + rng() * (60 + diff * 90);
        const gapStart = cx;
        cx += gap;
        const pw = Math.max(46, 90 - diff * 30 + rng() * 60);
        y = clamp(y + (rng() - 0.5) * (110 + diff * 90), 130, H - 44);
        plats.push({ x: cx, y, w: pw, h: H - y, c: (i % PLAT_COLS.length) });
        /* lava under some gaps */
        if (rng() < 0.35 + diff * 0.2 && i > 1) hazards.push({ x: gapStart, y: H - 16, w: gap, h: 16, t: 'lava' });
        /* spikes on some platform tops */
        if (rng() < 0.22 + diff * 0.2 && i > 2 && pw > 60) hazards.push({ x: cx + pw * 0.32, y: y - 12, w: pw * 0.36, h: 12, t: 'spike' });
        if (i % 4 === 3) { checks.push({ x: cx + pw / 2, y: y - PH, i: ci++ }); }
        cx += pw;
      }
      cx += 70; y = clamp(y, 130, H - 44);
      plats.push({ x: cx, y, w: 150, h: H - y, c: 2 });
      finish = { x: cx + 60, y: y - 54, w: 30, h: 54 };
      worldEnd = cx + 150;
      spawnIdx = 0; deaths = 0; t = 0; over = false;
      respawn();
      banner.style.display = 'none';
      pLevel.textContent = 'Stage ' + level;
      api.status('Stage ' + level + ' of ' + LEVELS + '. Run with ◀ ▶ / A D, jump with Space / W. Touch a checkpoint so a fall only sends you back a bit. Reach the flag. Jump to any stage from the menu.');
    }

    function respawn() {
      const c = checks[spawnIdx] || checks[0];
      px = c.x; py = c.y; vx = 0; vy = 0; grounded = false; coyote = 0; jumpBuf = 0;
    }
    function die() {
      deaths++; pDeaths.textContent = 'Falls: ' + deaths;
      api.sfx.bad(); respawn();
    }

    function overlap(ax, ay, aw, ah, b) { return ax < b.x + b.w && ax + aw > b.x && ay < b.y + b.h && ay + ah > b.y; }

    function update(dt) {
      if (over) return;
      t += dt;
      const left = keys.get('ArrowLeft', 'a', 'A'), right = keys.get('ArrowRight', 'd', 'D');
      const jump = keys.get('ArrowUp', 'w', 'W', ' ');
      vx = (right ? 1 : 0) * MOVE - (left ? 1 : 0) * MOVE;

      if (jump) jumpBuf = 0.12; else jumpBuf -= dt;
      coyote -= dt;
      if (jumpBuf > 0 && (grounded || coyote > 0)) { vy = -JUMP; grounded = false; coyote = 0; jumpBuf = 0; api.sfx.blip(620); }

      vy += GRAV * dt;
      /* move X, resolve */
      px += vx * dt;
      for (const p of plats) {
        if (overlap(px, py, PW, PH, p)) {
          if (vx > 0) px = p.x - PW; else if (vx < 0) px = p.x + p.w;
        }
      }
      /* move Y, resolve */
      py += vy * dt;
      grounded = false;
      for (const p of plats) {
        if (overlap(px, py, PW, PH, p)) {
          if (vy > 0) { py = p.y - PH; vy = 0; grounded = true; coyote = 0.1; }
          else if (vy < 0) { py = p.y + p.h; vy = 0; }
        }
      }

      /* checkpoints */
      for (const c of checks) if (c.i > spawnIdx && px + PW / 2 > c.x) { spawnIdx = c.i; api.sfx.good(); }

      /* hazards + fall */
      for (const hz of hazards) if (overlap(px + 3, py + 3, PW - 6, PH - 6, hz)) return die();
      if (py > H + 40) return die();

      /* finish */
      if (overlap(px, py, PW, PH, finish)) return finishLevel();
      px = clamp(px, 0, worldEnd - PW);
    }

    function finishLevel() {
      over = true;
      const prev = api.load('best:' + level, null);
      const rec = prev == null || t < prev;
      if (rec) api.save('best:' + level, +t.toFixed(1));
      const done = api.load('cleared', 0) + 1; api.save('cleared', done); api.submit(done);
      api.sfx.great();
      banner.style.display = '';
      banner.replaceChildren(
        h('h3', null, 'Flag reached!'),
        h('p', null, 'Stage ' + level + ' done in ' + t.toFixed(1) + 's with ' + deaths + ' fall' + (deaths === 1 ? '' : 's') + (rec ? ' — new best time!' : '') + '.'),
        h('div', { class: 'racer-endbtns' },
          level < LEVELS ? h('button', { class: 'btn primary', type: 'button', onclick: () => { level++; api.save('level', level); build(); } }, 'Next stage →') : h('span', null, 'You cleared every stage!'),
          h('button', { class: 'btn', type: 'button', onclick: build }, 'Replay')));
    }

    function draw() {
      const camX = clamp(px - W * 0.34, 0, Math.max(0, worldEnd - W));
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#2a3552'); g.addColorStop(1, '#3e4e78');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.translate(-camX, 0);

      for (const p of plats) {
        ctx.fillStyle = PLAT_COLS[p.c]; ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fillRect(p.x, p.y, p.w, 5);
        ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(p.x, p.y + p.h - 4, p.w, 4);
      }
      for (const hz of hazards) {
        if (hz.t === 'lava') { ctx.fillStyle = '#ff5a2a'; ctx.fillRect(hz.x, hz.y, hz.w, hz.h); ctx.fillStyle = '#ffb02e'; for (let x = hz.x; x < hz.x + hz.w; x += 12) ctx.fillRect(x, hz.y, 6, 3); }
        else { ctx.fillStyle = '#d0d0d8'; for (let x = hz.x; x < hz.x + hz.w - 6; x += 10) { ctx.beginPath(); ctx.moveTo(x, hz.y + hz.h); ctx.lineTo(x + 5, hz.y); ctx.lineTo(x + 10, hz.y + hz.h); ctx.closePath(); ctx.fill(); } }
      }
      for (const c of checks) {
        const reached = c.i <= spawnIdx;
        ctx.fillStyle = reached ? '#6fcf2f' : '#8a8674';
        ctx.fillRect(c.x - 2, c.y - 22, 4, 24);
        ctx.beginPath(); ctx.moveTo(c.x + 2, c.y - 22); ctx.lineTo(c.x + 18, c.y - 17); ctx.lineTo(c.x + 2, c.y - 12); ctx.closePath(); ctx.fill();
      }
      /* finish flag */
      ctx.fillStyle = '#ded6c2'; ctx.fillRect(finish.x - 2, finish.y, 4, finish.h);
      ctx.fillStyle = '#ffcb1f'; ctx.fillRect(finish.x + 2, finish.y, 22, 16);
      ctx.fillStyle = '#1d1722'; ctx.fillRect(finish.x + 2, finish.y, 22, 4); ctx.fillRect(finish.x + 2, finish.y + 8, 22, 4);

      /* player */
      ctx.fillStyle = '#ffcb1f'; ctx.fillRect(px, py, PW, PH);
      ctx.fillStyle = '#1d1722'; ctx.fillRect(px + (vx >= 0 ? 12 : 4), py + 8, 5, 5);
      ctx.fillStyle = '#e8402a'; ctx.fillRect(px, py + PH - 8, PW, 4);
      ctx.restore();

      pTime.textContent = t.toFixed(1) + 's';
      /* progress */
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(10, 10, W - 20, 7);
      ctx.fillStyle = '#6fcf2f'; ctx.fillRect(10, 10, (W - 20) * clamp(px / worldEnd, 0, 1), 7);
    }

    bagg.add(Engine.onKey((e) => { if ((e.key === 'r' || e.key === 'R') && over) { build(); return true; } }));

    /* ---- test seam ---- */
    window.__obby = {
      build(lv) { if (lv != null) level = lv; build(); },
      stats: () => ({ level, px, py, vy, grounded, spawnIdx, deaths, t, over, worldEnd, finish: { x: finish.x, y: finish.y }, plats: plats.length, hazards: hazards.length, checks: checks.length }),
      hold(code, v) { keys.state[code] = v; },
      tick(sec) { let s = sec; while (s > 0) { const dt = Math.min(1 / 60, s); update(dt); s -= dt; } },
      teleport(x, y) { px = x; py = y == null ? py : y; vy = 0; }
    };
    bagg.add(() => { if (window.__obby) delete window.__obby; });

    build();
    bagg.add(Engine.loop((dt) => { update(Math.min(0.033, dt)); draw(); }));
    return () => bagg.dispose();
  }

  Arcade.register({
    id: 'obby',
    title: 'The Obby',
    emoji: 'obby',
    cat: 'action',
    order: 21,
    blurb: 'A Roblox-style obstacle course: sprint and leap across a rainbow of platforms, clear the lava and the spikes, tag the green checkpoints, and reach the flag. Twenty stages that get meaner, and you can drop into any of them.',
    scoreLabel: 'Stages cleared',
    tags: ['platformer', 'obby', 'jump', 'obstacle-course'],
    how: [
      'Run left and right with the arrows or A/D, and jump with Space, W, or the on-screen JUMP button. There is a little coyote-time and jump-buffering so jumps feel forgiving.',
      'Cross the gaps by jumping platform to platform. Falling into a gap, touching lava, or landing on spikes sends you back — but only to your last checkpoint.',
      'Green flags along the way are checkpoints: run past one and it lights up, so a mistake costs a little, not the whole stage.',
      'Reach the chequered flag at the end to clear the stage. Your time and fall count are recorded, and your best time per stage is saved.',
      'Twenty stages get longer, higher and more hazardous. Use the Stage menu to jump straight to any of them.'
    ],
    mount
  });
})();

<script>
/* Court — daft two-player physics sports. Two wobbly players on one keyboard
 * bounce, jump and boot a ball at each other's goal. Basketball (sink it in the
 * hoop) or Soccer (ram it into the net). Hotseat or versus a hapless CPU. */
(function () {
  'use strict';
  const { h, clamp } = Engine;
  const W = 720, H = 440, GROUND = H - 26;
  const PR = 26, BR = 14, GRAV = 1900, JUMP = 720, MOVE = 320, WIN = 7;

  function mount(root, api) {
    const bagg = Engine.bag();
    const cv = Engine.canvas(root, W, H, { maxHeight: '58vh' });
    const ctx = cv.ctx;
    const keys = Engine.keys(['a', 'd', 'w', 'A', 'D', 'W', 'ArrowLeft', 'ArrowRight', 'ArrowUp']);
    bagg.add(() => keys.dispose());

    let mode = '2p', sport = 'bball', p1, p2, ball, s1, s2, over, serveT, msg;

    const pScore = api.pill('0 — 0');
    const pMode = api.pill('Hotseat');
    const banner = h('div', { class: 'banner', style: { display: 'none' } });
    root.appendChild(banner);

    api.select('Players', [{ value: '2p', label: '2 players (hotseat)' }, { value: '1p', label: '1 player (vs CPU)' }], '2p', (v) => { mode = v; reset(); });
    api.select('Sport', [{ value: 'bball', label: 'Basketball' }, { value: 'soccer', label: 'Soccer' }], 'bball', (v) => { sport = v; reset(); });
    api.button('New match', reset);

    /* touch: two thumbs */
    const pad = h('div', { class: 'hoops-pad' });
    const side = (cls, defs) => { const box = h('div', { class: 'hoops-side ' + cls }); defs.forEach(([l, code]) => { const b = h('button', { class: 'racer-btn', type: 'button' }, l); const set = (v) => { keys.state[code] = v; }; bagg.listen(b, 'pointerdown', (e) => { e.preventDefault(); set(true); }); bagg.listen(b, 'pointerup', () => set(false)); bagg.listen(b, 'pointerleave', () => set(false)); bagg.listen(b, 'pointercancel', () => set(false)); box.appendChild(b); }); return box; };
    pad.append(side('l', [['◀', 'a'], ['JUMP', 'w'], ['▶', 'd']]), side('r', [['◀', 'ArrowLeft'], ['JUMP', 'ArrowUp'], ['▶', 'ArrowRight']]));
    root.appendChild(pad);

    function reset() {
      p1 = { x: W * 0.25, y: GROUND, vx: 0, vy: 0, col: '#e8402a' };
      p2 = { x: W * 0.75, y: GROUND, vx: 0, vy: 0, col: '#2a7fd6' };
      s1 = 0; s2 = 0; over = false;
      serve(0);
      pMode.textContent = mode === '2p' ? 'Hotseat' : 'vs CPU';
      banner.style.display = 'none';
      sync();
      api.status(sport === 'bball'
        ? 'Basketball. Bump the ball into the OTHER player\'s hoop. Left player: A D move, W jump. Right player: arrows. First to ' + WIN + '.'
        : 'Soccer. Boot the ball into the OTHER player\'s goal. Left: A D W. Right: arrows. First to ' + WIN + '.');
    }

    function serve(dir) {
      ball = { x: W / 2, y: 120, vx: dir * 120, vy: 0 };
      serveT = 0.4;
    }
    function sync() { pScore.textContent = s1 + ' — ' + s2; }

    /* goals/hoops: p1 (left) attacks the RIGHT target; p2 attacks the LEFT target */
    function targets() {
      if (sport === 'bball') return { left: { hx: 62, hy: 150, rw: 34 }, right: { hx: W - 62, hy: 150, rw: 34 } };
      return { left: { gx: 0, gy: GROUND - 96, gw: 20, gh: 96 }, right: { gx: W - 20, gy: GROUND - 96, gw: 20, gh: 96 } };
    }

    function movePlayer(pl, left, right, jump) {
      pl.vx = (right ? MOVE : 0) - (left ? MOVE : 0);
      if (jump && pl.y >= GROUND - 0.5) pl.vy = -JUMP;
      pl.vy += GRAV * (1 / 60);
      pl.x = clamp(pl.x + pl.vx / 60, PR, W - PR);
      pl.y += pl.vy / 60;
      if (pl.y > GROUND) { pl.y = GROUND; pl.vy = 0; }
    }

    function cpu(pl) {
      const left = ball.x < pl.x - 12, right = ball.x > pl.x + 12;
      const jump = ball.y < pl.y - 40 && Math.abs(ball.x - pl.x) < 90 && pl.y >= GROUND - 0.5;
      return { left, right, jump };
    }

    function kick(pl) {
      const dx = ball.x - pl.x, dy = ball.y - pl.y, d = Math.hypot(dx, dy) || 1;
      if (d < PR + BR) {
        const nx = dx / d, ny = dy / d;
        ball.x = pl.x + nx * (PR + BR); ball.y = pl.y + ny * (PR + BR);
        const power = 430;
        ball.vx = nx * power + pl.vx * 0.7;
        ball.vy = ny * power + pl.vy * 0.6 - 80;
        api.sfx.blip(300);
      }
    }

    function update(dt) {
      if (over) return;
      const j1 = keys.get('w', 'W'), j2 = keys.get('ArrowUp');
      movePlayer(p1, keys.get('a', 'A'), keys.get('d', 'D'), j1);
      if (mode === '2p') movePlayer(p2, keys.get('ArrowLeft'), keys.get('ArrowRight'), j2);
      else { const c = cpu(p2); movePlayer(p2, c.left, c.right, c.jump); }

      /* ball physics */
      if (serveT > 0) serveT -= dt;
      ball.vy += GRAV * dt;
      ball.x += ball.vx * dt; ball.y += ball.vy * dt;
      if (ball.x < BR) { ball.x = BR; ball.vx = Math.abs(ball.vx) * 0.75; }
      if (ball.x > W - BR) { ball.x = W - BR; ball.vx = -Math.abs(ball.vx) * 0.75; }
      if (ball.y < BR) { ball.y = BR; ball.vy = Math.abs(ball.vy) * 0.6; }
      if (ball.y > GROUND - BR) { ball.y = GROUND - BR; ball.vy = -Math.abs(ball.vy) * 0.68; ball.vx *= 0.9; if (Math.abs(ball.vy) < 40) ball.vy = 0; }
      kick(p1); kick(p2);

      const T = targets();
      if (sport === 'bball') {
        /* score when the ball drops through a rim from above */
        for (const [t, who] of [[T.right, 1], [T.left, 2]]) {
          if (ball.vy > 0 && Math.abs(ball.x - t.hx) < t.rw && ball.y > t.hy && ball.y < t.hy + 26) { return goal(who); }
        }
      } else {
        if (ball.x < T.left.gx + T.left.gw + BR && ball.y > T.left.gy) return goal(2);
        if (ball.x > T.right.gx - BR && ball.y > T.right.gy) return goal(1);
      }
    }

    function goal(who) {
      if (who === 1) s1++; else s2++;
      api.sfx.great(); sync();
      if (s1 >= WIN || s2 >= WIN) return end();
      serve(who === 1 ? -1 : 1);
    }

    function end() {
      over = true;
      const p1win = s1 > s2;
      if (mode === '1p') { if (p1win) { const w = api.load('wins', 0) + 1; api.save('wins', w); api.submit(w); } api.sfx[p1win ? 'great' : 'bad'](); }
      else api.sfx.great();
      banner.style.display = '';
      banner.replaceChildren(
        h('h3', null, mode === '2p' ? (p1win ? 'Red wins!' : 'Blue wins!') : (p1win ? 'You win!' : 'CPU wins.')),
        h('p', null, 'Final score ' + s1 + ' — ' + s2 + '.'),
        h('button', { class: 'btn primary', type: 'button', onclick: reset }, 'Rematch'));
    }

    function drawPlayer(pl, face) {
      ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(pl.x, GROUND + 4, PR * 0.8, 6, 0, 0, 7); ctx.fill();
      ctx.fillStyle = pl.col; ctx.beginPath(); ctx.arc(pl.x, pl.y - PR, PR, Math.PI, 0); ctx.rect(pl.x - PR, pl.y - PR, PR * 2, PR); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(pl.x + face * 8, pl.y - PR - 4, 5, 0, 7); ctx.fill();
      ctx.fillStyle = '#1d1722'; ctx.beginPath(); ctx.arc(pl.x + face * 10, pl.y - PR - 4, 2.4, 0, 7); ctx.fill();
    }

    function draw() {
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#3a6ea5'); g.addColorStop(1, '#5a86b8');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = sport === 'bball' ? '#c47a3a' : '#3a9d3a'; ctx.fillRect(0, GROUND, W, H - GROUND);
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(W / 2 - 1, 0, 2, GROUND);

      const T = targets();
      if (sport === 'bball') {
        for (const t of [T.left, T.right]) {
          const bx = t.hx < W / 2 ? 4 : W - 18;
          ctx.fillStyle = '#ded6c2'; ctx.fillRect(bx, t.hy - 44, 14, 60);          // backboard post
          ctx.fillStyle = '#e8402a'; ctx.fillRect(t.hx - t.rw, t.hy - 4, t.rw * 2, 6);  // rim
          ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1;
          for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(t.hx + i * t.rw * 0.7, t.hy); ctx.lineTo(t.hx + i * t.rw * 0.4, t.hy + 20); ctx.stroke(); }
        }
      } else {
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        ctx.fillRect(T.left.gx, T.left.gy, T.left.gw, T.left.gh);
        ctx.fillRect(T.right.gx, T.right.gy, T.right.gw, T.right.gh);
      }

      drawPlayer(p1, 1); drawPlayer(p2, -1);

      /* ball */
      ctx.fillStyle = sport === 'bball' ? '#e8621f' : '#f4f4f4';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, BR, 0, 7); ctx.fill();
      ctx.strokeStyle = '#1d1722'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, BR, 0, 7); ctx.stroke();
      if (sport === 'bball') { ctx.beginPath(); ctx.moveTo(ball.x - BR, ball.y); ctx.lineTo(ball.x + BR, ball.y); ctx.moveTo(ball.x, ball.y - BR); ctx.lineTo(ball.x, ball.y + BR); ctx.stroke(); }
      void msg;
    }

    /* ---- test seam ---- */
    window.__hoops = {
      reset(m, sp) { if (m) mode = m; if (sp) sport = sp; reset(); },
      stats: () => ({ mode, sport, s1, s2, over, ball: { x: ball.x, y: ball.y }, p1: { x: p1.x, y: p1.y } }),
      hold(code, v) { keys.state[code] = v; },
      ballTo(x, y, vx, vy) { ball = { x, y, vx: vx || 0, vy: vy || 0 }; serveT = 0; },
      tick(sec) { let s = sec; while (s > 0) { const dt = Math.min(1 / 60, s); update(dt); s -= dt; } }
    };
    bagg.add(() => { if (window.__hoops) delete window.__hoops; });

    reset();
    bagg.add(Engine.loop((dt) => { update(Math.min(0.033, dt)); draw(); }));
    return () => bagg.dispose();
  }

  Arcade.register({
    id: 'hoops',
    title: 'Court',
    emoji: 'hoops',
    cat: 'action',
    order: 22,
    blurb: 'Gloriously silly two-player physics sport on one keyboard. Two wobbling players jump and boot a ball at each other\'s goal — basketball through the hoop or soccer into the net. Hotseat a coworker or humble the CPU.',
    scoreLabel: 'CPU wins',
    tags: ['sports', 'basketball', 'soccer', 'hotseat', 'physics'],
    how: [
      'Two players share the keyboard. Left player moves with A and D and jumps with W; right player uses the arrow keys. On touch, each half of the screen has its own buttons.',
      'Bump, head and boot the ball. In Basketball you score by knocking the ball down through the OTHER player\'s hoop; in Soccer you shove it into their net at the edge.',
      'Everything is physics — the ball bounces off the floor, the walls, and both players, so it is chaos, and that is the point. Jump into the ball to launch it.',
      'First to seven points wins the match. Pick Basketball or Soccer from the menu.',
      'No friend nearby? Switch Players to 1 and take on the CPU. Beating it counts toward your score.'
    ],
    mount
  });
})();

<script>
/* The Commute. Cross the open-plan office without being flattened by a chair. */
(function () {
  'use strict';
  const { h, clamp, rand, randInt, pick } = Engine;

  const COLS = 20, CELLW = 42;
  const W = COLS * CELLW;          // 840
  const ROWH = 46, ROWS = 12;
  const H = ROWS * ROWH + 34;      // room for the desk row label
  const TOP = 34;

  const rowY = (r) => TOP + (ROWS - 1 - r) * ROWH;   // row 0 at the bottom

  /* office hazards, drawn rather than typed */
  const HAZARDS = [
    { kind: 'chair', w: 46, col: '#4a4155' },
    { kind: 'cart', w: 64, col: '#a79e88' },
    { kind: 'printer', w: 58, col: '#cfc6ae' },
    { kind: 'trolley', w: 50, col: '#00a6b4' }
  ];

  function drawHazard(ctx, k, w, hgt) {
    ctx.fillStyle = k.col;
    if (k.kind === 'chair') {
      ctx.fillRect(-w / 2, -4, w, 9);
      ctx.fillRect(-w / 2 + 4, -hgt / 2 + 2, 8, 14);
      ctx.fillStyle = '#1d1722';
      ctx.beginPath(); ctx.arc(-w / 2 + 7, 10, 4, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(w / 2 - 7, 10, 4, 0, 7); ctx.fill();
    } else if (k.kind === 'cart') {
      ctx.fillRect(-w / 2, -hgt / 2 + 4, w, hgt - 14);
      ctx.fillStyle = '#1d1722';
      ctx.fillRect(-w / 2, -hgt / 2 + 4, w, 3);
      ctx.beginPath(); ctx.arc(-w / 2 + 8, hgt / 2 - 8, 4, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(w / 2 - 8, hgt / 2 - 8, 4, 0, 7); ctx.fill();
    } else if (k.kind === 'printer') {
      ctx.fillRect(-w / 2, -10, w, 20);
      ctx.fillStyle = '#fffdf3';
      ctx.fillRect(-w / 2 + 6, -16, w - 12, 7);
      ctx.fillStyle = '#1d1722';
      ctx.fillRect(-w / 2 + 5, 2, w - 10, 4);
    } else {
      ctx.fillRect(-w / 2, -hgt / 2 + 6, w, hgt - 16);
      ctx.fillStyle = '#1d1722';
      ctx.fillRect(-w / 2 + 4, -hgt / 2 + 10, w - 8, 4);
      ctx.beginPath(); ctx.arc(-w / 2 + 9, hgt / 2 - 10, 4, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(w / 2 - 9, hgt / 2 - 10, 4, 0, 7); ctx.fill();
    }
  }

  function mount(root, api) {
    const bagg = Engine.bag();
    const cv = Engine.canvas(root, W, H);
    const ctx = cv.ctx;
    const dm = api.dm;

    let px, py, row, lanes, belts, desks, lives, score, over, dead, deadT, round, hopT, best;

    const pScore = api.pill('Score: 0');
    const pLives = api.pill('♥♥♥');
    const pRound = api.pill('Round 1');
    const banner = h('div', { class: 'banner', style: { display: 'none' } });
    root.appendChild(banner);
    Engine.dpad(root, (d) => { if (d !== 'action') hop(d); }, { class: 'touch-only' });

    function reset(full) {
      if (full) { lives = 3; score = 0; round = 1; }
      desks = [false, false, false, false, false];
      buildLanes();
      spawnPlayer();
      over = false;
      banner.style.display = 'none';
      api.status('Arrows or WASD to hop. Lanes 1 to 4 will flatten you. The belts up top will only carry you if you land on a box.');
      sync();
    }

    function buildLanes() {
      const spd = (1 + (round - 1) * 0.16) * dm;
      lanes = [];
      for (let r = 1; r <= 4; r++) {
        const dir = r % 2 ? 1 : -1;
        const speed = dir * rand(58, 116) * spd;
        const items = [];
        const n = randInt(3, 5);
        const gap = W / n;
        const type = pick(HAZARDS);
        for (let i = 0; i < n; i++) {
          items.push({ x: i * gap + rand(0, gap * 0.4), w: type.w, kind: type });
        }
        lanes.push({ r, speed, items });
      }
      belts = [];
      for (let r = 7; r <= 10; r++) {
        const dir = r % 2 ? -1 : 1;
        const speed = dir * rand(44, 92) * spd;
        /* boxes have to cover most of the belt or landing on one is a coin flip */
        const items = [];
        const n = randInt(4, 5);
        const gap = W / n;
        for (let i = 0; i < n; i++) {
          items.push({ x: i * gap + rand(0, gap * 0.18), w: gap * rand(0.66, 0.82) });
        }
        belts.push({ r, speed, items });
      }
    }

    function spawnPlayer() {
      row = 0;
      px = W / 2;
      py = rowY(0);
      dead = false;
      deadT = 0;
      hopT = 0;
    }

    function sync() {
      pScore.textContent = 'Score: ' + score;
      pLives.textContent = lives > 0 ? '♥'.repeat(lives) : '--';
      pLives.className = 'pill ' + (lives <= 1 ? 'bad' : '');
      pRound.textContent = 'Round ' + round;
    }

    function hop(d) {
      if (over || dead) return;
      if (d === 'up' && row < ROWS - 1) { row++; score += 2; hopT = 0.12; }
      else if (d === 'down' && row > 0) { row--; hopT = 0.12; }
      else if (d === 'left') { px = clamp(px - CELLW, 16, W - 16); hopT = 0.1; }
      else if (d === 'right') { px = clamp(px + CELLW, 16, W - 16); hopT = 0.1; }
      else return;
      api.sfx.tone({ freq: 520, to: 700, dur: 0.05, type: 'square', vol: 0.06 });
      if (row === ROWS - 1) arrive();
      sync();
    }

    function arrive() {
      const slot = Math.floor(px / (W / 5));
      if (slot < 0 || slot > 4 || desks[slot]) { return die('That desk is taken.'); }
      desks[slot] = true;
      score += 60;
      api.sfx.good();
      if (desks.every(Boolean)) {
        round++;
        score += 250;
        desks = [false, false, false, false, false];
        buildLanes();
        api.sfx.great();
      }
      spawnPlayer();
      sync();
    }

    function die(why) {
      if (dead) return;
      dead = true;
      deadT = 0.9;
      lives--;
      api.sfx.boom();
      sync();
      if (lives <= 0) {
        over = true;
        const res = api.submit(score);
        banner.style.display = '';
        banner.replaceChildren(
          h('h3', null, 'Flattened.'),
          h('p', null, why + ' Final score ' + score + ' on round ' + round + '.' +
            (res.isRecord ? ' New best!' : res.isFirst ? '' : ' Best: ' + res.best + '.')),
          h('button', { class: 'btn primary', type: 'button', onclick: () => reset(true) }, 'Try the commute again'));
      }
    }

    function update(dt) {
      if (over) return;
      if (dead) { deadT -= dt; if (deadT <= 0) spawnPlayer(); return; }
      if (hopT > 0) hopT -= dt;

      for (const l of lanes.concat(belts)) {
        for (const it of l.items) {
          it.x += l.speed * dt;
          if (l.speed > 0 && it.x > W + 40) it.x = -it.w - rand(20, 120);
          if (l.speed < 0 && it.x < -it.w - 40) it.x = W + rand(20, 120);
        }
      }

      py += (rowY(row) - py) * Math.min(1, dt * 18);

      /* traffic lanes squash you */
      const lane = lanes.find((l) => l.r === row);
      if (lane) {
        for (const it of lane.items) {
          if (px > it.x - 15 && px < it.x + it.w + 15) return die('A rolling chair got you.');
        }
      }

      /* belts carry you, and only if you are standing on something */
      const belt = belts.find((b) => b.r === row);
      if (belt) {
        /* a short grace after landing, so a hop onto the edge of a box is not instant death */
        const edge = hopT > 0 ? 14 : 0;
        const on = belt.items.find((it) => px > it.x - edge && px < it.x + it.w + edge);
        if (!on) return die('You stepped onto a moving belt with nothing on it.');
        px += belt.speed * dt;
        if (px < 6 || px > W - 6) return die('The belt carried you into the wall.');
      }
    }

    function draw() {
      ctx.fillStyle = '#141a26';
      ctx.fillRect(0, 0, W, H);

      /* row backgrounds */
      for (let r = 0; r < ROWS; r++) {
        const y = rowY(r);
        let col = '#1e2635';
        if (r === 0 || r === 5 || r === 6) col = '#2b3548';           // safe carpet
        else if (r >= 1 && r <= 4) col = '#232c3d';                   // walkway
        else if (r >= 7 && r <= 10) col = '#12303a';                  // belts
        else if (r === 11) col = '#3b2e1c';                           // desks
        ctx.fillStyle = col;
        ctx.fillRect(0, y, W, ROWH);
        if (r >= 7 && r <= 10) {
          ctx.strokeStyle = 'rgba(255,255,255,.06)';
          ctx.lineWidth = 2;
          for (let x = 0; x < W; x += 22) {
            ctx.beginPath();
            ctx.moveTo(x, y); ctx.lineTo(x + 10, y + ROWH);
            ctx.stroke();
          }
        }
      }

      /* desks along the top */
      for (let i = 0; i < 5; i++) {
        const x = i * (W / 5);
        ctx.fillStyle = desks[i] ? '#6fcf2f' : '#5d452a';
        ctx.fillRect(x + 8, rowY(11) + 6, W / 5 - 16, ROWH - 12);
        ctx.strokeStyle = '#0c1119';
        ctx.lineWidth = 3;
        ctx.strokeRect(x + 8, rowY(11) + 6, W / 5 - 16, ROWH - 12);
        const dx = x + W / 10, dy = rowY(11) + ROWH / 2;
        ctx.fillStyle = desks[i] ? '#1d1722' : '#cfc6ae';
        ctx.fillRect(dx - 13, dy - 8, 26, 15);
        ctx.fillStyle = desks[i] ? '#1d1722' : '#8a6a3a';
        ctx.fillRect(dx - 4, dy + 7, 8, 5);
      }

      /* belts first, so hazards draw over them cleanly */
      for (const b of belts) {
        const y = rowY(b.r);
        for (const it of b.items) {
          ctx.fillStyle = '#8a6a3a';
          ctx.fillRect(it.x, y + 7, it.w, ROWH - 14);
          ctx.strokeStyle = '#0c1119';
          ctx.lineWidth = 3;
          ctx.strokeRect(it.x, y + 7, it.w, ROWH - 14);
          ctx.strokeStyle = '#c9a06a';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(it.x + 6, y + ROWH / 2); ctx.lineTo(it.x + it.w - 6, y + ROWH / 2);
          ctx.stroke();
        }
      }

      for (const l of lanes) {
        const y = rowY(l.r);
        for (const it of l.items) {
          ctx.save();
          ctx.translate(it.x + it.w / 2, y + ROWH / 2);
          if (l.speed < 0) ctx.scale(-1, 1);
          drawHazard(ctx, it.kind, it.w, ROWH - 8);
          ctx.restore();
        }
      }

      /* you */
      if (!dead || Math.floor(deadT * 12) % 2) {
        const s = hopT > 0 ? 1.18 : 1;
        ctx.save();
        ctx.translate(px, py + ROWH / 2);
        ctx.scale(s, s);
        if (dead) {
          ctx.fillStyle = '#e8402a';
          ctx.beginPath();
          for (let i = 0; i < 10; i++) {
            const a = i / 10 * Math.PI * 2, rr = i % 2 ? 7 : 15;
            i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
          }
          ctx.closePath(); ctx.fill();
        } else {
          ctx.fillStyle = '#00a6b4';
          ctx.beginPath(); ctx.arc(0, -9, 5.5, 0, 7); ctx.fill();
          ctx.fillRect(-5, -3, 10, 11);
          ctx.fillRect(-5, 8, 4, 6);
          ctx.fillRect(1, 8, 4, 6);
        }
        ctx.restore();
      }

      ctx.fillStyle = '#ded6c2';
      ctx.font = 'bold 12px Verdana, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('GET TO A FREE DESK', 10, 22);
      ctx.textAlign = 'right';
      ctx.fillText(desks.filter(Boolean).length + ' / 5 SEATED', W - 10, 22);
      ctx.textAlign = 'left';
    }

    bagg.add(Engine.onKey((e) => {
      const m = {
        ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
        w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right'
      }[e.key];
      if (m) { hop(m); return true; }
    }));
    bagg.add(Engine.swipe(cv.el, hop));

    api.button('Restart', () => reset(true));
    reset(true);
    bagg.add(Engine.loop((dt) => { update(dt); draw(); }));
    return () => bagg.dispose();
  }

  Arcade.register({
    id: 'commute',
    title: 'The Commute',
    emoji: 'commute',
    cat: 'action',
    order: 34,
    blurb: 'Cross the open-plan office to an empty desk. Four lanes of rolling chairs first, then the belts, where standing on nothing is fatal.',
    scoreLabel: 'Score',
    tags: ['frogger', 'crossing', 'office', 'arcade'],
    how: [
      'Arrows, WASD or swipe to hop one square at a time.',
      'The bottom four lanes are traffic. Touching anything in them ends that life.',
      'The four dark lanes near the top are conveyor belts. You must land on a box, and the box carries you sideways.',
      'Fill all five desks to clear the round. Everything gets faster after that.',
      'Three lives. Each square forward is worth points, each desk is worth sixty.'
    ],
    mount
  });
})();

</script>

(function () {

  const { h, clamp, rand, pick } = Engine;

    { id: 'intern', name: 'Unpaid Intern', icon: 'panic', base: 15, cps: 0.15, blurb: 'Fetches coffee. Slowly. Resentfully.' },

    { id: 'singularity', name: 'Caffeine Singularity', icon: 'boom', base: 62000000, cps: 190000, blurb: 'Time is a flat white now.' }
  ];

  const EVENTS = [
    { t: 'Somebody took the last cup and did not start a new pot.', mul: -0.08 },
    { t: 'Free doughnuts in the kitchen! Morale spike!', mul: 0.25 },
    { t: 'The fire alarm went off. Nobody brewed anything for a bit.', mul: -0.12 },
    { t: 'A mystery box of beans arrived. No note.', mul: 0.4 },
    { t: 'The machine is making iced coffee only. It is January.', mul: -0.06 },
    { t: 'You were named Employee Of The Month by nobody in particular.', mul: 0.6 },
    { t: 'Post-lunch slump. Everything is molasses.', mul: -0.15 }
  ];

  const fmt = (n) => {
    if (n < 1000) return n.toFixed(n < 10 && n % 1 ? 1 : 0);
    const units = ['k', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx'];
    let u = -1;
    while (n >= 1000 && u < units.length - 1) { n /= 1000; u++; }
    return n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) + units[u];
  };

  function mount(root, api) {
    const bagg = Engine.bag();
    const priceScale = 1 + (api.dm - 1) * 0.55;      /* nightmare makes everything pricier */

    let S = api.load('save', null);
    if (!S || typeof S.cups !== 'number' || S.diff !== api.diffId) {
      S = { cups: 0, total: 0, clicks: 0, own: {}, diff: api.diffId };
    }
    for (const it of SHOP) if (!S.own[it.id]) S.own[it.id] = 0;

    let boost = 0, boostT = 0, eventText = '', eventT = 0, pops = [];

    const pCups = api.pill('Cups: 0');
    const pRate = api.pill('0.0 /sec');
    const pTotal = api.pill('lifetime 0');

    const mug = h('button', { class: 'mug', type: 'button', 'aria-label': 'Brew a cup' },
      h('span', { class: 'mug-art', html: Icons.svg('coffee', 110) }),
      h('span', { class: 'mug-label' }, 'BREW'));

    const popLayer = h('div', { class: 'pop-layer' });
    const eventBar = h('div', { class: 'coffee-event' });
    const shopEl = h('div', { class: 'shop' });

    root.append(
      h('div', { class: 'coffee-wrap' },
        h('div', { class: 'coffee-left' }, popLayer, mug, eventBar),
        shopEl));

    api.button('Wipe the save', () => {
      if (!confirm('Delete every bean you have ever earned? There is no undo.')) return;
      S = { cups: 0, total: 0, clicks: 0, own: {}, diff: api.diffId };
      for (const it of SHOP) S.own[it.id] = 0;
      boost = 0; boostT = 0;
      save();
      renderShop();
      sync();
    }, 'danger');

    const price = (it) => Math.ceil(it.base * priceScale * Math.pow(1.15, S.own[it.id]));
    const cps = () => SHOP.reduce((a, it) => a + it.cps * S.own[it.id], 0) * (1 + boost);

    function buy(it, many) {
      let n = 0;
      while (n < (many ? 10 : 1) && S.cups >= price(it)) {
        S.cups -= price(it);
        S.own[it.id]++;
        n++;
      }
      if (n) { api.sfx.good(); save(); renderShop(); sync(); }
      else api.sfx.bad();
    }

    const rows = [];
    function renderShop() {
      shopEl.replaceChildren(h('h4', { class: 'shop-head' }, 'THE SHOP'));
      rows.length = 0;
      for (const it of SHOP) {
        const owned = h('span', { class: 'shop-own' }, String(S.own[it.id]));
        const cost = h('span', { class: 'shop-cost' }, fmt(price(it)));
        const row = h('button', {
          class: 'shop-row', type: 'button',
          onclick: (e) => buy(it, e.shiftKey)
        },
          h('span', { class: 'shop-emoji', html: Icons.svg(it.icon, 24) }),
          h('span', { class: 'shop-body' },
            h('span', { class: 'shop-name' }, it.name),
            h('span', { class: 'shop-blurb' }, it.blurb)),
          h('span', { class: 'shop-right' }, cost, owned));
        rows.push({ it, row, cost, owned });
        shopEl.appendChild(row);
      }
      shopEl.appendChild(h('p', { class: 'shop-foot' }, 'shift-click buys ten at once'));
    }

    function pop(text, x, y) {
      const el = h('span', { class: 'pop' }, text);
      el.style.left = x + '%';
      el.style.top = y + '%';
      popLayer.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }

    function brew(ev) {
      const gain = 1 + cps() * 0.06;
      S.cups += gain;
      S.total += gain;
      S.clicks++;
      api.sfx.tone({ freq: 420 + rand(-40, 60), to: 240, dur: 0.06, type: 'triangle', vol: 0.07 });
      pop('+' + fmt(gain), rand(24, 72), rand(20, 62));
      mug.classList.remove('squish');
      void mug.offsetWidth;
      mug.classList.add('squish');
      sync();
    }
    mug.addEventListener('click', brew);

    function sync() {
      pCups.textContent = 'Cups: ' + fmt(S.cups);
      pRate.textContent = fmt(cps()) + ' /sec' + (boost ? (boost > 0 ? ' UP' : ' DOWN') : '');
      pRate.className = 'pill ' + (boost > 0 ? 'good' : boost < 0 ? 'bad' : '');
      pTotal.textContent = 'lifetime ' + fmt(S.total);
      for (const r of rows) {
        r.cost.textContent = fmt(price(r.it));
        r.owned.textContent = String(S.own[r.it.id]);
        r.row.classList.toggle('afford', S.cups >= price(r.it));
      }
    }

    let saveT = 0;
    function save() { api.save('save', S); api.submit(Math.floor(S.total)); }

    let evTimer = rand(25, 45) / api.dm;
    bagg.add(Engine.loop((dt) => {
      const gained = cps() * dt;
      S.cups += gained;
      S.total += gained;

      if (boostT > 0) { boostT -= dt; if (boostT <= 0) boost = 0; }
      evTimer -= dt;
      if (evTimer <= 0) {
        const e = pick(EVENTS);
        boost = e.mul * (e.mul < 0 ? api.dm : 1 / api.dm);
        boostT = 14;
        eventText = e.t;
        eventT = 7;
        evTimer = rand(25, 45) / api.dm;
        api.sfx.blip(e.mul > 0 ? 700 : 220);
      }
      if (eventT > 0) {
        eventT -= dt;
        eventBar.textContent = eventText;
        eventBar.className = 'coffee-event show ' + (boost > 0 ? 'up' : 'down');
      } else eventBar.className = 'coffee-event';

      saveT += dt;
      if (saveT > 4) { saveT = 0; save(); }
      sync();
    }));

    bagg.add(() => save());
    renderShop();
    sync();
    api.status('Click the mug. Buy things that click the mug for you. Do not look at the clock.');
    return () => bagg.dispose();
  }

  Arcade.register({
    id: 'coffee',
    title: 'Coffee Clicker',

    how: [

      'Spend cups in the shop. Everything you buy brews coffee while you do literally anything else.',
      'Shift-click a shop row to buy ten at once.',

    ],
    mount
  });
})();
